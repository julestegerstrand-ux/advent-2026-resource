<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25244F">
<title>Advent 2026 Course</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--surface:#FBF4EA;--ink:#2E1F2B;--muted:#6B5563;--line:#E2D2BE;--head:#F3E6D3;--card:#fff;--green:#0B874B;--accent:#3B3A78;--teal:#1E7470;--scarlet:#B3321F;--night:#25244F;--on:#FFF8EE;--c:#3B3A78;--t:#FFF8EE}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--surface:#1c1b3a;--ink:#F5EBDD;--muted:#C9BBCB;--line:#3a3968;--head:#25244F;--card:#2a2960;--green:#4cc38a;--accent:#A9A7F0;--teal:#56c2bb;--scarlet:#F59A87;--c:#A9A7F0;--t:#1D1B38;--btnink:#1D1B38}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:18px/1.6 "DM Sans",system-ui,sans-serif}
a{color:var(--teal)}
.hero{display:block;width:100%;height:auto;max-height:360px;object-fit:cover;object-position:50% 12%}
.banner{background:var(--night);color:var(--on);padding:40px 24px;text-align:center}
.banner h1{font:500 clamp(30px,5vw,44px)/1.15 "Fraunces",Georgia,serif;margin:0 0 8px}
.banner p{margin:0 auto;max-width:34em;opacity:.92}
main{max-width:820px;margin:0 auto;padding:24px 16px 64px}
.module{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);margin-bottom:22px;--c:var(--accent);--t:var(--ink)}
.mh{margin:0;font:inherit}.mhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--head);color:var(--ink);padding:16px 20px;font:700 20px "DM Sans",system-ui,sans-serif;cursor:pointer}.tri{width:0;height:0;border-left:8px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;transition:transform .15s}.mhead[aria-expanded=true] .tri{transform:rotate(90deg)}.tools{display:flex;gap:10px;justify-content:flex-end;margin-bottom:14px}.tools .nb{min-height:40px;font-size:16px}[hidden]{display:none!important}
.wk .mhead{background:var(--c);color:var(--t)}
.row{display:flex;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line);border-left:5px solid var(--c);color:var(--ink);text-decoration:none;font-weight:700}
.row:hover,.row:focus-visible{background:var(--head)}
.row.sub{padding-left:54px;font-weight:500}
.ico.round{border-radius:50%}.sr{position:absolute;left:-9999px}.author{display:flex;gap:20px;align-items:flex-start;margin:26px 0 8px;padding-top:20px;border-top:1px solid var(--line)}.author img{width:150px;height:auto;border-radius:12px;flex:none}.author p{margin:2px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:16px 0}.gallery figure{margin:0}.gallery img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}.video{position:relative;padding-top:56.25%;margin:16px 0}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px}.page img{max-width:100%}.page blockquote{margin:16px 0;padding:6px 0 6px 18px;border-left:4px solid var(--c)}.page ul,.page ol{padding-left:1.3em}.page li{margin:6px 0}.muted{color:var(--muted)}
.ico{flex:none;width:18px;height:22px;background:var(--c);border:2px solid var(--c);border-radius:3px}
.grp{padding:14px 20px;font-weight:700;color:var(--muted);border-top:1px solid var(--line);border-left:5px solid var(--c)}
.crumb{margin:0 0 8px;font-size:16px}
.signupbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--scarlet);border-radius:8px;padding:14px 18px;margin:0 0 20px}
.signupbar p{margin:0;flex:1 1 280px}
.signupbar .btn{margin:0}
.signupbar .nb{min-height:44px}
.page{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:8px;padding:24px 26px;--c:var(--accent)}
.page h2{font:500 clamp(26px,4vw,34px)/1.2 "Fraunces",Georgia,serif;margin:0 0 14px}
.page h2:focus{outline:none}
.week{border-left:6px solid var(--c);padding:2px 0 2px 14px;margin:14px 0}
.week b{display:block}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:999px;border:2px solid var(--ink);color:var(--ink);background:transparent;text-decoration:none;font:700 17px "DM Sans",system-ui,sans-serif}
.nb.go{background:var(--c);border-color:var(--c);color:var(--t)}
.nb:hover{filter:brightness(.95)}
.nb[aria-disabled=true]{opacity:.35;pointer-events:none}
.btn{display:inline-block;background:var(--scarlet);color:var(--btnink,#fff);text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;margin:6px 8px 6px 0}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.note{color:var(--muted);font-size:16px}
.draft{border:2px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted)}
footer{margin-top:32px;color:var(--muted);font-size:16px}
a:focus-visible,button:focus-visible{outline:3px solid #F2C14E;outline-offset:2px}
@media (max-width:600px){.author{flex-direction:column}.page{padding:20px 16px}.row.sub{padding-left:34px}}

/* devices and browsers */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:rgba(30,116,112,.18)}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow-wrap:break-word}
.page{overflow-wrap:anywhere}
.video iframe{top:0;left:0;right:0;bottom:0}
.page iframe{max-width:100%}
a:focus,button:focus{outline:3px solid #F2C14E;outline-offset:2px}
.row,.nb,.mhead,.btn{-webkit-appearance:none;touch-action:manipulation}
.row{min-height:48px}
.nb{min-height:48px}
.tools .nb{min-height:44px}
/* older Safari has no flex gap, so give the main spots real margins */
.row .ico{margin-right:14px}
.mhead .tri{margin-right:12px}
.author>img{margin-right:20px}
.nav .nb{margin:4px 0}
.tools .nb{margin-left:10px}
@media (max-width:760px){main{padding-left:14px;padding-right:14px}.hero{max-height:240px}.banner{padding:28px 18px}}
@media (max-width:520px){
  body{font-size:17px}
  .nav{display:block}
  .nav .nb{display:flex;justify-content:center;width:100%;margin:8px 0}
  .nav .nb.go{order:0}
  .tools{justify-content:stretch}.tools .nb{flex:1;justify-content:center}
  .author>img{margin-right:0;margin-bottom:12px}
}
@media (min-width:1100px){body{font-size:19px}main{max-width:900px}}
@media (hover:none){.row:hover{background:transparent}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.hero,.banner,.nav,.tools,.crumb{display:none}body{background:#fff;color:#000}.page{border:0;padding:0}.video{display:none}}

/* look */
.herowrap{position:relative;background:#25244F}
.herowrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(to bottom,rgba(37,36,79,0),#25244F)}
.banner{padding-top:8px;position:relative;z-index:1;margin-top:-1px}
.mhead .mt{flex:1}
.mhead .mw{height:52px;width:auto;margin-left:auto;background:#FBF4EA;border-radius:10px;padding:2px 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));grid-gap:14px;margin:0 0 24px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;border:0;border-radius:16px;padding:16px 12px 14px;background:var(--c);color:var(--t);cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(46,31,43,.14)}
.tile img{width:100%;max-width:150px;height:auto;background:#FBF4EA;border-radius:12px;margin-bottom:10px}
.tile .tw{font-size:14px}
.tile .tn{font:500 24px "Fraunces",Georgia,serif;line-height:1.2}
.tile .td{font-size:15px}
.tile:hover{transform:translateY(-2px)}
.module{box-shadow:0 4px 14px rgba(46,31,43,.08);border-radius:14px}
.page{box-shadow:0 4px 14px rgba(46,31,43,.08);border-radius:14px;line-height:1.7}
.page p{max-width:42em}
.page h2{margin-bottom:18px}
.page .video{max-width:42em}
.page p,.page li{margin:0 0 1em}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .wk{--c:var(--cd)}}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}.mhead .mw{height:44px}}
@media print{.tiles{display:none}}

/* module banners */
.mhead{padding:20px 22px;gap:14px}
.mhead .ttl{display:block;font:500 clamp(21px,3.4vw,27px)/1.2 "Fraunces",Georgia,serif}
.mhead .eb{display:block;font:700 12.5px "DM Sans",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.wk .mhead{background-color:var(--c);background-image:radial-gradient(circle at 8% 28%,rgba(255,255,255,.55) 1px,transparent 1.6px),radial-gradient(circle at 34% 70%,rgba(255,255,255,.4) 1px,transparent 1.6px),radial-gradient(circle at 57% 22%,rgba(255,255,255,.5) 1px,transparent 1.6px),radial-gradient(circle at 71% 78%,rgba(255,255,255,.35) 1px,transparent 1.6px),radial-gradient(circle at 90% 18%,rgba(255,255,255,.5) 1px,transparent 1.6px),linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.16) 100%)}
.mhead .mw{height:64px;border-radius:14px;padding:3px 8px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.wk .mhead{min-height:104px}
.mhead[aria-expanded=false]{padding-top:16px;padding-bottom:16px}
.module:not(.wk) .mhead{border-bottom:3px solid var(--c)}
@media (max-width:520px){.mhead{padding:16px 14px}.mhead .mw{height:48px}.mhead .eb{font-size:11.5px}}

/* tools, search, roles */
.skip{position:absolute;left:-9999px;top:0;background:#FBF4EA;color:#2E1F2B;padding:12px 18px;z-index:50;font-weight:700}
.skip:focus{left:8px;top:8px}
.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;background:#25244F;color:#FFF8EE;padding:6px 14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tbhome{color:#FFF8EE;font:500 19px "Fraunces",Georgia,serif;text-decoration:none;padding:8px 4px}
.tbtools button{min-height:40px;min-width:44px;margin-left:8px;border-radius:999px;border:2px solid #FFF8EE;background:transparent;color:#FFF8EE;font:700 16px "DM Sans",system-ui,sans-serif;cursor:pointer;padding:0 14px}
.tbtools button:hover{background:rgba(255,255,255,.15)}
html.fs1 body{font-size:20px}html.fs2 body{font-size:22px}html.fs3 body{font-size:25px}
.hh{font:500 26px "Fraunces",Georgia,serif;margin:6px 0 12px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));grid-gap:12px;margin:0 0 26px}
.role{display:block;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:0 3px 10px rgba(46,31,43,.06)}
.role:hover,.role:focus-visible{border-color:var(--accent)}
.role b{display:block;font-size:18px}.role span{display:block;font-size:15px;color:var(--muted)}
.search{margin:0 0 26px}
.search label{display:block;font-weight:700;margin-bottom:6px}
.search input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
#results{margin-top:10px}
.res{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0;text-decoration:none;color:var(--ink)}
.res b{display:block}.res small{display:block;color:var(--muted);font-size:15px}.res em{font-style:normal;background:#F2C14E55}
.resume{margin:0 0 18px;font-weight:700}
.rl{list-style:none;padding:0}.rl li{margin:0}.rl a{display:block;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:700;text-decoration:none}
.ftype{font-size:.85em;color:var(--muted);white-space:nowrap}
.copyrow{margin-top:14px;display:flex;align-items:center;flex-wrap:wrap}
.copyrow .nb{min-height:44px;font-size:16px}
.copyrow [role=status]{margin-left:12px;color:var(--muted)}
@media (max-width:520px){.tbhome{font-size:17px}.tbtools button{margin-left:6px;padding:0 10px}}
@media print{.topbar,.skip,.copyrow,.search,.roles{display:none}}
.fnote{font-size:15px;margin:8px 0}

/* getting back */
:root{--onacc:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--onacc:#1c1b3a}}
.backbar{display:flex;flex-wrap:wrap;margin:0 0 14px}
.backbar .nb{margin:0 10px 8px 0}
.nb.backhome{background:var(--accent);border-color:var(--accent);color:var(--onacc);min-height:50px;font-size:18px}
.nb.backrole{border-color:var(--accent);min-height:50px;font-size:18px}
.page .backbar{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.more{margin-top:26px;padding-top:18px;border-top:2px solid var(--line)}
.chips{display:flex;flex-wrap:wrap}
.chip{display:inline-block;margin:0 10px 10px 0;padding:10px 16px;border-radius:999px;border:2px solid var(--accent);color:var(--ink);text-decoration:none;font-weight:700}
.crumb{margin:0 0 6px;font-size:16px;color:var(--muted)}
@media (max-width:520px){.backbar .nb{width:100%;justify-content:center;margin-right:0}}
@media print{.backbar,.chips,.more{display:none}}
body.sub .herowrap{display:none}
body.sub .banner{padding:12px 18px;margin-top:0}
body.sub .banner p{display:none}
body.sub .banner h1{font-size:22px;margin:0}
body.sub main{padding-top:16px}
</style>

'<p>This week’s handout gives you two ways to pray during Advent: Lectio Divina and short practices. You can pray each one on your own or with a small group, and you don’t need any experience to lead them. The steps are printed on each page.</p>'+
'<p><strong>Lectio Divina</strong> means sacred reading. It is an old way of praying with Scripture. You read a short passage aloud four times, slowly, and pause after each reading. Each time, you listen for something different: a word that catches you, what it touches in your life, what you want to say to God, and then rest. In a group, a different person can read each time.</p>'+
'<p><strong>The practices</strong> are simple ways to pray with your body, your breath, and your attention. Each one takes 5 to 20 minutes and ends with questions to pray with or share.</p>'+
'<p><a href="New%20England%20Advent%202026/Week%201_Hope/Advent%20Week%201%20Hope%20-%20Lectio%20and%20Group%20Practices.pdf" target="_blank" rel="noopener">Practices for the first week of Advent (PDF to print)</a></p>'+
'<p>This week we wait with people who feel that God has hidden from them, and yet we keep listening. Often, when we listen together, we can help each other notice even small ways God is present.</p>'+
'<h3>Lectio Divina</h3><p>Isaiah 64:7-9<br>Psalm 80:17-19<br>1 Corinthians 1:7-9<br>Mark 13:34-37</p>'+

'<p>Each passage and practice starts on a new page, so you can print only the one you need. The handout is a PDF that’s ready to print.</p>'+
'<p>These prayers are part of Sacred Seasons, an Advent prayer app being developed by Everyday Peacemaking, LLC. The app should be ready in mid-November. To become a tester or to sign up to hear when it’s ready, visit <a href="'+APP+'" target="_blank" rel="noopener">sacredseasons.julenetegerstrand.com</a>.</p>'+

'<h3>What we count</h3><p>We use GoatCounter, a small visit counter, to learn which pages and files people use. It keeps only totals. For each day it records how many times a page or file was opened or an outside link was clicked, and it keeps these tallies in separate lists that cannot be matched to each other:</p><ul>'+

function rolesHTML(){
  var h='<section aria-labelledby="iam"><h2 class="hh" id="iam">I am a&hellip;</h2><div class="roles">';
  ROLES.forEach(function(r){h+='<a class="role" href="#'+r.id+'"><b>'+r.label+'</b><span>'+r.note+'</span></a>'});
  return h+'</div></section>';
}
function rolePage(r){
  var h='<div class="backbar"><a class="nb backhome" href="#">&larr; All resources</a></div><article class="page"><h2 id="ptitle" tabindex="-1">For: '+r.label+'</h2><p>'+r.note+'. Here are the pages made for you.</p>',n=0;
  MODS.forEach(function(m){
    var items=m.items.filter(function(it){return it.id&&r.test(it)});
    if(!items.length)return;
    n++;h+='<h3>'+m.title+'</h3><ul class="rl">';
    items.forEach(function(it){
      h+='<li><a href="'+(it.href?it.href:'#'+it.id)+'"'+(it.href?' target="_blank" rel="noopener"':'')+'>'+it.title+'</a></li>';
    });
    h+='</ul>';
  });
  if(!n)h+='<p class="note">Pages for this group will appear here as they are added.</p>';
  h+='<div class="more"><p><b>Need something else?</b></p><div class="backbar"><a class="nb backhome" href="#">&larr; See all resources</a></div><p class="note">Or choose a different group:</p><div class="chips">';
  ROLES.forEach(function(x){if(x.id!==r.id)h+='<a class="chip" href="#'+x.id+'">'+x.label+'</a>'});
  return h+'</div></div></article>';
}
var INDEX=null;
function buildIndex(){
  INDEX=[];
  MODS.forEach(function(m){m.items.forEach(function(it){
    if(!it.id)return;
    INDEX.push({id:it.id,title:plain(it.title),mod:m.title,href:it.href,text:plain(it.title+" "+(it.html||""))});
  })});
}
function searchHTML(){
  return '<div class="search"><label for="q">Search this course</label><input id="q" type="search" placeholder="Try a song, a Bible passage, or a name" autocomplete="off"><div id="results" aria-live="polite"></div></div>';
}
function runSearch(q){
  var out=document.getElementById("results");if(!out)return;
  q=q.trim();
  if(q.length<2){out.innerHTML="";return}
  if(!INDEX)buildIndex();
  var lq=q.toLowerCase(),h="",n=0;
  INDEX.forEach(function(it){
    if(n>=20)return;
    var low=it.text.toLowerCase(),k=low.indexOf(lq);
    if(k<0)return;
    n++;
    var s=Math.max(0,k-40),snip=it.text.slice(s,k+lq.length+60);
    var i2=snip.toLowerCase().indexOf(lq);
    snip=(s>0?"&hellip;":"")+snip.slice(0,i2).replace(/</g,"&lt;")+"<em>"+snip.slice(i2,i2+lq.length).replace(/</g,"&lt;")+"</em>"+snip.slice(i2+lq.length).replace(/</g,"&lt;")+"&hellip;";
    h+='<a class="res" href="'+(it.href?it.href:'#'+it.id)+'"'+(it.href?' target="_blank" rel="noopener"':'')+'><b>'+it.title+'</b><small>'+it.mod+'</small><small>'+snip+'</small></a>';
  });
  out.innerHTML=n?'<p class="note">'+n+(n===1?' page found':' pages found')+'</p>'+h:'<p class="note">Nothing found for &ldquo;'+q.replace(/</g,"&lt;")+'&rdquo;. Try a shorter word.</p>';
}
function lastKey(){return "advent26-last"}
function rememberPage(id){try{localStorage.setItem(lastKey(),id)}catch(e){}}
function resumeHTML(){
  var id=null;try{id=localStorage.getItem(lastKey())}catch(e){}
  if(!id)return "";
  var f=null;MODS.forEach(function(m){m.items.forEach(function(it){if(it.id===id&&!it.href)f=it})});
  return f?'<p class="resume"><a href="#'+f.id+'">Pick up where you left off: '+plain(f.title)+'</a></p>':"";
}
function modPages(m){return m.items.filter(function(x){return x.id&&!x.href})}
function page(i){
  var it=FLAT[i],m=it.mod,list=modPages(m),k=list.indexOf(it),prev=list[k-1],next=list[k+1],nm=null;
  if(!next){for(var j=MODS.indexOf(m)+1;j<MODS.length;j++){var l2=modPages(MODS[j]);if(l2.length){nm=l2[0];break}}}
  var nt=next?next:nm;
  return backbar()+'<p class="crumb">'+m.title+'</p>'+
  '<article class="page'+(m.wk||m.feat?' wk':'')+'"'+style(m)+'><h2 id="ptitle" tabindex="-1">'+it.title+'</h2>'+it.html+
  '<nav class="nav" aria-label="Page navigation">'+
  (prev?'<a class="nb" href="#'+prev.id+'" aria-label="Previous: '+plain(prev.title)+'">&larr; Previous</a>':'<span class="nb" aria-disabled="true">&larr; Previous</span>')+
  '<a class="nb backhome" href="#">All resources</a>'+
  (nt?'<a class="nb go" href="#'+nt.id+'" aria-label="'+(next?'Next: ':'Next module: ')+plain(nt.title)+'">'+(next?'Next':'Next module')+' &rarr;</a>':'<span class="nb go" aria-disabled="true">Next &rarr;</span>')+
  '</nav>'+backbar()+'<div class="copyrow"><button type="button" class="nb" id="copylink">Copy link to this page</button><span id="copystatus" role="status"></span></div></article>';
}
function enhance(root){
  if(!SHOW_DRAFTS){
    root.querySelectorAll(".muted,.draft").forEach(function(e){if(/to be added|ready for your content/.test(e.textContent))e.parentNode&&e.parentNode.removeChild(e)});
    root.querySelectorAll(".page p,.page li").forEach(function(e){if(!e.textContent.trim()&&!e.querySelector("img,iframe"))e.parentNode.removeChild(e)});
  }
  root.querySelectorAll(".page a[href]").forEach(function(a){
    var href=a.getAttribute("href")||"",txt=a.textContent;
    var ext=/^https?:/i.test(href)||a.getAttribute("target")==="_blank";
    if(/^Watch on YouTube/.test(txt)&&!a.getAttribute("aria-label")){
      var e=a.parentNode.previousElementSibling,ttl="";
      while(e&&!ttl){var f=e.querySelector&&e.querySelector("iframe");if(f&&f.title)ttl=f.title;e=e.previousElementSibling}
      if(ttl)a.setAttribute("aria-label","Watch on YouTube: "+ttl+" (opens in a new tab)");
    }
    var low=decodeURIComponent(href.split("?")[0]).toLowerCase(),ft="";
    if(/\.pdf$/.test(low)&&!/pdf/i.test(txt))ft="PDF";
    else if(/\.docx?$/.test(low)&&!/docx?|word/i.test(txt))ft="Word file";
    if(ft){var s=document.createElement("span");s.className="ftype";s.textContent=" ("+ft+")";a.appendChild(s)}
    if(ext&&!a.querySelector(".sr")&&!a.getAttribute("aria-label")){var r=document.createElement("span");r.className="sr";r.textContent=" (opens in a new tab)";a.appendChild(r)}
  });
}
function route(){
  var id=location.hash.slice(1),app=document.getElementById("app"),i=-1,role=null;
  FLAT.forEach(function(it,k){if(it.id===id)i=k});
  ROLES.forEach(function(r){if(r.id===id)role=r});
  if(role)setRole(role.id);else if(i<0&&id!=="credits"&&id!=="privacy")setRole(null);
  if(id==="credits"){app.innerHTML=creditsPage();setTitle("Credits and permissions")}
  else if(id==="privacy"){app.innerHTML=privacyPage();setTitle("Privacy")}
  else if(role){app.innerHTML=rolePage(role);setTitle("For "+role.label.toLowerCase())}
  else if(i>=0){app.innerHTML=page(i);setTitle(plain(FLAT[i].title));rememberPage(FLAT[i].id)}
  else{app.innerHTML=home();setTitle("")}
  document.body.classList.toggle("sub",!!(role||i>=0||id==="credits"||id==="privacy"));
  enhance(app);
  window.scrollTo(0,0);
  var t=document.getElementById("ptitle");if(t)t.focus();
}
/* tools */
(function(){
  function size(n){var c=document.documentElement.classList;for(var k=0;k<4;k++)c.remove("fs"+k);c.add("fs"+n);try{localStorage.setItem("advent26-fs",n)}catch(e){}}
  var cur=0;try{cur=+(localStorage.getItem("advent26-fs")||0)}catch(e){}
  size(cur);
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("button,a");if(!b)return;
    if(b.id==="fsp"){cur=Math.min(3,cur+1);size(cur)}
    else if(b.id==="fsm"){cur=Math.max(0,cur-1);size(cur)}
    else if(b.id==="prt"){window.print()}
    else if(b.id==="signupclose"){try{localStorage.setItem("advent26-signupbar","1")}catch(x){}var bar=b.closest(".signupbar");if(bar)bar.remove();var h1=document.getElementById("app");if(h1)h1.focus()}
    else if(b.id==="skip"){e.preventDefault();var m=document.getElementById("app");m.focus();m.scrollIntoView()}
    else if(b.id==="copylink"){
      var st=document.getElementById("copystatus");
      function ok(){if(st)st.textContent="Link copied"}
      function fail(){if(st)st.textContent="Copy did not work. Copy the address from the top of your browser."}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(location.href).then(ok,fail)}else{fail()}
    }
  });
  document.addEventListener("input",function(e){if(e.target&&e.target.id==="q")runSearch(e.target.value)});
})();

/* GoatCounter visit counts. Put your GoatCounter site name between the quotes, for example "advent2026". Leave it empty to turn counting off. */
var GC_SITE="newenglandadvent2026";
(function(){
  if(!GC_SITE)return;
  var s=document.createElement("script");s.async=true;
  s.src="https://gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter","https://"+GC_SITE+".goatcounter.com/count");
  s.setAttribute("data-goatcounter-settings",'{"no_onload":true}');
  document.head.appendChild(s);
  function count(o){if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count(o)}
  function titleOf(){var h=document.getElementById("ptitle");return h?h.textContent:"Main page"}
  window.addEventListener("load",function(){setTimeout(function(){count({path:"/"+(location.hash.slice(1)||"home"),title:titleOf()})},300)});
  window.addEventListener("hashchange",function(){setTimeout(function(){count({path:"/"+(location.hash.slice(1)||"home"),title:titleOf()})},100)});
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;
    var h=a.getAttribute("href")||"";
    if(/\.(pdf|docx?)$/i.test(h.split("?")[0])){count({path:"download/"+decodeURIComponent(h.split("/").pop()),title:"Download",event:true})}
    else if(/^https?:/i.test(h)&&h.indexOf(location.host)<0){count({path:"link/"+h.replace(/^https?:\/\//,"").slice(0,80),title:"Outside link",event:true})}
  });
})();
window.addEventListener("hashchange",route);route();
</script>
