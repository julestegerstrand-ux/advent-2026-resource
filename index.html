r neighbors. And once we are awake to suffering, Christian discipleship asks us what we will do about what we have seen.<\/p>\n<p>Catholic theologian M. Shawn Copeland's theology of solidarity helps deepen this understanding. Reflecting on the cross in Knowing Christ Crucified, Copeland writes:<\/p>\n<p><em>“There is no more concrete example of the cost of self-transcending love than the cross of the crucified Jewish Jesus, and it is from the ground beneath his cross that Christian discipleship as solidaristic praxis or compassionate arise and is always judged...A theological understanding of solidarity realizes itself in intelligent and effective compassionate action, in doing, in discipleship” (143).<\/em><\/p>\n<p>For Copeland, the cross becomes the ground from which Christian solidarity emerges. We do not simply look at suffering from a safe distance. We are drawn toward it. We become willing to see, to accompany, to act. This gives Jesus's command to keep awake a much more intentional meaning. Keeping awake means refusing to become numb to the suffering around us. It means allowing ourselves to see the people and circumstances that our culture would rather us overlook. It means noticing who is hungry, who is lonely, who is excluded, who is afraid, who is grieving, who is being harmed, who has been pushed to the margins.<\/p>\n<p>And then it means doing something about it. Advent hope is therefore not passive optimism. It is solidaristic hope.<\/p>\n<p>We do not wait for Christ by withdrawing from the world's suffering. We wait for Christ by becoming the kind of people who recognize Christ in the midst of that suffering and responding with compassionate action.<\/p>\n<p>The candles we light during Advent are not only reminders that Jesus is coming. They are invitations to become people who carry light into dark places.<\/p>\n<p>And that brings us to Paul's words in 1 Corinthians. Paul tells the Corinthian church that he gives thanks to God because they have been enriched in Christ, and then he says something incredibly hopeful:<\/p>\n<p>“You are not lacking in any spiritual gift as you wait for the revealing of our Lord Jesus Christ.” As they wait.<\/p>\n<p>Paul acknowledges that the Christian life takes place in the space between Christ's coming and Christ's coming again.<\/p>\n<p>We are a people who wait. We wait as people who have already encountered Christ. We wait as people who have already received God's grace. We wait as people who have already been called into fellowship with Christ.<\/p>\n<p>And then Paul says, \"God is faithful; by him you were called into the fellowship of his Son, Jesus Christ our Lord.\"<\/p>\n<p>God is faithful!!! Our hope rests not in our ability to see the future but in the nature of God.<\/p>\n<p>God is faithful while we wait. God is faithful when restoration feels incomplete. God is faithful when we cannot yet see what God is doing. God is faithful when the shadows seem to be winning.<\/p>\n<p>Remember in Isaiah, the people are waiting for God to tear open the heavens and come down. But perhaps part of what Isaiah is learning is that God's work of restoration does not always arrive in the powerful and dramatic way we expect.<\/p>\n<p>Sometimes God comes slowly. Sometimes restoration looks like rebuilding. Sometimes it looks like a community learning again how to worship, how to care for one another, how to practice justice, how to welcome the vulnerable, how to become a people who embody the future they are waiting for.<\/p>\n<p>This the tension of Advent.<\/p>\n<p>We are waiting for God while also becoming the kind of people God is forming us to be.<\/p>\n<p>We wait for restoration, and we participate in restoration.<\/p>\n<p>We wait for justice, and we practice justice.<\/p>\n<p>We wait for peace, and we become peacemakers.<\/p>\n<p>We wait for God's kingdom, and we embody and enflesh God's kingdom in the places where we live.<\/p>\n<p>Jesus has come. Jesus is coming. Jesus will come again.<\/p>\n<p>The Christ who came to Bethlehem comes to us still, in the presence of the Holy Spirit, in the gathered community, at the table, on the road, in the neighbor who needs our attention, and in the places where God's people are participating in the work of restoration.<\/p>\n<p>And one day, Christ will come again and make all things new.<\/p>\n<p>Keeping awake means refusing to look away. It means standing beneath the cross with our eyes open. It means allowing the suffering of the world to move us toward compassionate action. It means waiting for Christ while participating in the work of Christ.<\/p>\n<p>So, on this first Sunday of Advent, the invitation is clear.<\/p>\n<p>We keep awake while waiting with hope. Because the God who came to us in Jesus Christ has not abandoned the world. The God who tore open the heavens in Christ is still at work among us. And the God who has promised to come again is faithful.<\/p>\n<p>So we wait.<\/p>\n<p>Amen.<\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Mat Thomas at <a href=\"mailto:pastor.mat.thomas@gmail.com\">pastor.mat.thomas@gmail.com<\/a>.<\/p>\n<p><img src=\"assets/thomas.jpg\" alt=\"Rev. Dr. Mat Thomas\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w1-text1": "<p><a href=\"https://www.biblegateway.com/passage/?search=isaiah%2064%3A1-9&version=NRSV\" target=\"_blank\" rel=\"noopener\">Isaiah 64:1-9<\/a><\/p>\n<p>Isaiah 64 comes from what is often called 3rd Isaiah (Isaiah 56–66). Scholars believe this section of Isaiah was written after the Jews had returned from exile. They have returned to Jerusalem \"the City of Peace,\" but the return has not produced the healing that they envisioned. The temple and city are not what they once were, the community is fractured, and the promises of restoration seem frustratingly incomplete. They are home, but they are still waiting for God to make things right.<\/p>\n<p>That context matters for the season of Advent. Hope is not ignoring the reality in front of us, nor is it denying the pain of the present. Isaiah gives voice to a people who have experienced trauma followed by disappointment and yet continue to hope that God will act: “O that you would tear open the heavens and come down” (64:1). The prayer is bold, perhaps even desperate. They are asking God to show up and transform their circumstances.<\/p>\n<p>But there is also a prophetic challenge underneath the prayer. The problem is not only that God needs to come back. God's people need to return to faithfully following the covenant. Throughout this section of Isaiah, the prophet challenges a community that has returned from exile to examine what kind of people they are becoming. Worship cannot be separated from justice, compassion, and faithfulness. They cannot simply rebuild the temple, resume religious practices, and assume everything is fine. Authentic worship has to be embodied in the way they treat one another, particularly the vulnerable and marginalized.<\/p>\n<p>That is why verse 5 is so important: “You meet those who gladly do right, those who remember you in your ways.” The hope for God's presence is connected to the community's own faithfulness. Isaiah is not offering a simplistic formula. It is not if we behave, God will bless us. Instead, I believe Isaiah is insisting that hope in God must produce a particular kind of people. If we are waiting for God to come, we should also be asking what it means for us to live faithfully while we wait.<\/p>\n<p>The language of verses 6–7 becomes confessional. “We have all become like one who is unclean and all our righteous deeds are like a filthy cloth. We all fade like a leaf, and our iniquities, like the wind, take us away. There is no one who calls on your name, or attempts to take hold of you.” Isaiah is proclaiming to the community that their own righteousness is woefully inadequate. They have wandered, and they need God not only to fix their circumstances but to restore their relationship with God.<\/p>\n<p>And then comes a turn in verses 8–9. “Yet, O LORD, you are our Father; we are the clay, and you are our potter; we are all the work of your hand.” Even after confession, the prayer ends not in despair but in relationship, in hope. They appeal to who God is. God is their Father. They are God's people. They remain the work of God's hands.<\/p>\n<p>That makes Isaiah 64 a powerful text for the first Sunday of Advent and the theme of hope. Advent begins with Isaiah revealing to us a people waiting in the darkness, longing for God to tear open the heavens and come down. But, we must remember that our hope is not passive waiting. We wait for God by becoming the kind of people who embody God's coming kingdom. We worship authentically. We practice justice. We remember the covenant. We make room for our neighbors. We live as people who believe God is still at work. Maybe that is what holiness is. Not getting our lives perfectly together, but allowing God to reshape how we worship, do justice, and live together. As we wait and hope for God to tear open the heavens, we respond by tearing down the walls that keep people from belonging.<\/p>\n<p>And perhaps that is the tension of Advent. We are waiting for God to come, while also recognizing that God is already calling us to live faithfully in the worlds we inhabit. The hope is that God has not abandoned the work of God's hands, and neither has God abandoned us. Thanks be to God.<\/p>\n<p>Here is a video I made on the historical context of the book of Isaiah. I am including it in other Isaiah commentaries as well.<\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/mw2sEPcUQKY?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Historical Context of Isaiah\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://www.youtube.com/watch?v=mw2sEPcUQKY\" target=\"_blank\" rel=\"noopener\">Historical Context of Isaiah<\/a><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Mat Thomas at <a href=\"mailto:pastor.mat.thomas@gmail.com\">pastor.mat.thomas@gmail.com<\/a>.<\/p>\n<p><img src=\"assets/thomas.jpg\" alt=\"Rev. Dr. Mat Thomas\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w1-text2": "<p>Psalm 80 is a communal lament, attributed to Asaph. Interestingly, this is a psalm that includes the musical reference: For the director of music. To the tune of “The Lilies of the Covenant.” This psalm cries out for the restoration of Israel, likely following the Assyrian destruction of the northern kingdom in 722 BC. It calls on God as Israel's Shepherd and Gardener, pleading for Him to awaken His strength, shine His face upon His people, and deliver them from their enemies, who are depicted as wild animals destroying a flourishing vine. The psalm uses a refrain, \"Restore us, O God; make your face shine upon us, that we may be saved,\" to emphasize the people's trust in God's favor and restoration.<\/p>\n<p>Thinking of this Psalm in the context of Advent has several elements. At a fundamental level, it is the cry, \"Come and save us!\" This longing for God's coming is at the core of Advent. The psalm also centers on the image of \"the Shepherd of Israel, you who lead Joseph like a flock.\" Because this psalm is a lament, it also invites opportunities to acknowledge sorrow in the midst of the hope of Advent, remembering that both include longing.<\/p>\n<p>We also find here the invocation of \"the son of man you have raised up for yourself,\" and while the phrase has meaning in its original context, we remember that the term is one that Jesus used more than any other to refer to himself.<\/p>\n<p>The psalm gives us an Advent prayer: \"Restore us, Lord God Almighty; make your face shine on us, that we may be saved.\"<\/p>\n<p>(It is interesting to note that this same Psalm text is used here in Year B for Week One.) and again in Year A for Week Four.<\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%201_Hope/Psalm%2080%20Responsive%20Reading.pdf\" target=\"_blank\" rel=\"noopener\">Responsive Reading of Psalm 80<\/a><\/p>\n<p><strong>Outline of Psalm 80 from <a href=\"https://www.amazon.com/Outline-Bible-Harold-L-Willmington/dp/0842337016\" target=\"_blank\" rel=\"noopener\">The Outline Bible<\/a><\/strong><\/p>\n<p>Asaph cries out to God because his people are scorned by their enemies. He recalls God's past goodness to them and asks for favor once again. Asaph uses three images to describe God's people and their relationship to him.<\/p>\n<p>I. THE SHEEP AND THE SHEPHERD (80:1-7): Asaph calls God the Shepherd of Israel.<\/p>\n<p>A. Listen to us (80:1-2): Asaph wants God, who is \"enthroned above the cherubim,\" to respond to his people's cries and rescue<\/p>\n<ul>\n<li>Do not be angry with us (80:4-6): God has rejected them and made them the scorn of nations.<\/li>\n<li>Redeem your people (80:3, 7): Asaph asks God to cause his people to turn to him again so they can be saved.<\/li>\n<\/ul>\n<p>II. THE VINE AND THE VINEYARD OWNER (80:8-16)<\/p>\n<p>A. The past vine (80:8-11)<\/p>\n<ol>\n<li>It is brought out of Egypt as a tender vine (80:8).<\/li>\n<li>It is brought into Canaan, where it flourishes (80:8-11).<\/li>\n<\/ol>\n<ul>\n<li>The present vine (80:12-13, 16): It is punished for its fruitless-ness.<\/li>\n<li>The future vine (80:14-15): The psalmist begs God to return and care once again for his vine.<\/li>\n<\/ul>\n<p>III. THE SINNERS AND THE SAVIOR (80:17-19)<\/p>\n<ul>\n<li>The person (80:17): \"Strengthen the man you love, the son of your choice\" is most likely a reference to the Messiah.<\/li>\n<li>The plea (80:18-19): \"Make your face shine down upon us\" is a plea for God to turn toward them and save them.<\/li>\n<\/ul>\n<h3>Commentary Links<\/h3>\n<p><a href=\"https://www.aplainaccount.org/post/psalm-80-1-2-8-19\" target=\"_blank\" rel=\"noopener\">A Plain Account<\/a><br>\n<a href=\"https://cepreaching.org/commentary/2022-12-12/psalm-801-7-17-19-6/\" target=\"_blank\" rel=\"noopener\">Center for Excellence in Preaching<\/a><br>\n<a href=\"https://enduringword.com/bible-commentary/psalm-80/\" target=\"_blank\" rel=\"noopener\">Enduring Word Commentary<\/a><br>\n<a href=\"https://www.2belikechrist.com/articles/psalm-80-summary-in-5-minutes\" target=\"_blank\" rel=\"noopener\">Five Minute Commentary<\/a><br>\n<a href=\"https://www.workingpreacher.org/commentaries/revised-common-lectionary/first-sunday-of-advent-2/commentary-on-psalm-801-7-17-19-9\" target=\"_blank\" rel=\"noopener\">Working Preacher<\/a><\/p>\n<h3>Musical Settings<\/h3>\n<p><a href=\"https://open.spotify.com/track/2NsdC4MAwUv7qE8Svw4xBQ\" target=\"_blank\" rel=\"noopener\">Psalm 80 (Poor Bishop Hooper)<\/a><br>\n<a href=\"https://open.spotify.com/track/6ADkBoDV9KrBMzcCwxyBOd\" target=\"_blank\" rel=\"noopener\">Psalm 80 (Sons of Korah)<\/a><\/p>\n<p>If you are interested in further dialogue about the content on any of the weekly Psalm pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w1-text3": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/frSqD2eMGHw?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"1 Corinthians 1:3-9\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/frSqD2eMGHw\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%201_Hope/1%20Cor%201.docx\" download>1 Cor 1.docx<\/a> <span class=\"muted\">Bible text in this handout: the New Revised Standard Version (NRSV).<\/span><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Dave Young at <a href=\"mailto:dave@northst.org\">dave@northst.org<\/a>.<\/p>\n<p><img src=\"assets/young.jpg\" alt=\"Rev. Dr. David Young\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w1-text4": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/ML6LZwCWsAU?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Mark 13:24-37\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/ML6LZwCWsAU\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%201_Hope/Mark%2013.docx\" download>Mark 13.docx<\/a> <span class=\"muted\">Bible text in this handout: the Common English Bible (CEB).<\/span><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Dave Young at <a href=\"mailto:dave@northst.org\">dave@northst.org<\/a>.<\/p>\n<p><img src=\"assets/young.jpg\" alt=\"Rev. Dr. David Young\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w1-worship": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/gNuY6I4OtoE?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"The Thrill of Hope - Advent Hymn\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://www.youtube.com/watch?v=gNuY6I4OtoE\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<h3><em>Worship on the First Sunday of Advent<\/em><\/h3>\n<p>The challenge in Advent worship is to let Advent be Advent. We often want to rush right into Christmas songs when we need to resist the urge and any pressure from the culture and even our people. It may be that we can crossfade and gradually add them in, but be sure and let this first Sunday of Advent focus on songs of Advent, songs of longing, expectancy, and hope.<\/p>\n<h3>Worship Themes to Consider<\/h3>\n<ul>\n<li>Anticipation: Focus on the waiting and expectation of Christ's arrival.<\/li>\n<li>Light vs. Darkness: Contrast the darkness of the world with the coming light of Christ.<\/li>\n<li>Prophetic Fulfillment: Connect the coming of Jesus to the fulfillment of Old Testament prophecies.<\/li>\n<li>Readiness: Call the congregation to prepare their hearts to receive the Savior, much like the people of old.<\/li>\n<li>The Dual Coming: Acknowledge that Christ came in humility and will come again in glory.<\/li>\n<\/ul>\n<h3>Advent Call to Worship<\/h3>\n<p>Leader: The night is passing. The day of salvation is near.<br>\n<strong>People: We are waiting for the dawn of God's incarnation.<\/strong><br>\nLeader: Let us hear the revelation of God's promise.<br>\n<strong>People: For Advent is a time of expecting new light to shine.<\/strong><br>\nLeader: Let us receive light from the prophets.<br>\n<strong>People: For light penetrates darkness and prepares the way of the Lord.<\/strong><br>\nLeader: Let us see God's glory shine forth.<br>\n<strong>All: For we long to be transformed by the light of God's holiness. Come, Lord Jesus!<\/strong><\/p>\n<p>We can also use the Psalms reading as a call to worship, or elsewhere in the worship flow. Each week, we have the Psalm in the form of a responsive reading, which is a great option. It adds additional Scripture in our worship and also gives congregational participation in a way beyond singing.<\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%201_Hope/Psalm%2080%20Responsive%20Reading.pdf\" target=\"_blank\" rel=\"noopener\">Responsive Reading - Psalm 80<\/a><\/p>\n<p>You can also explore various worship resources connected to the Psalm on the <a href=\"#w1-text2\">Psalm 80<\/a> page.<\/p>\n<p><strong>Lighting the Advent Wreath (see the dedicated <a href=\"#wreath\">PAGE<\/a> to this Advent tradition)<\/strong><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%201_Hope/Week%20One%20Advent%20Wreath%20Readings.pdf\" target=\"_blank\" rel=\"noopener\">Week One Advent Wreath Reading<\/a><\/p>\n<h3>Hymn Suggestions<\/h3>\n<p><em>(Hymn #s are from the Sing to the Lord Hymnal)<\/em><\/p>\n<ul>\n<li><em>Celebrate Immanuel's Name #162<\/em><\/li>\n<li><em>Come, Thou Long Expected Jesus #157<\/em><\/li>\n<li><em>Emmanuel #165<\/em><\/li>\n<li><em>O Come, O Come, Emmanuel #163<\/em><\/li>\n<li><a href=\"https://hymnary.org/text/the_advent_of_our_king_our_prayers_must\" target=\"_blank\" rel=\"noopener\"><em>The Advent of Our God<\/em><\/a><\/li>\n<\/ul>\n<p>(Original Tune is St, Thomas, #18 and #54. Can also use any Small Meter tune, such as <em>Blest Be the Tie That Binds<\/em>, #677)<\/p>\n<h3>Other Song Suggestions<\/h3>\n<ul>\n<li><a href=\"https://open.spotify.com/track/177jEwUqgmdmw6uccm6SfJ\" target=\"_blank\" rel=\"noopener\"><em>Come, Thou Long-Expected Jesus<\/em><\/a> (Meredith Andrews version)<\/li>\n<li><a href=\"https://open.spotify.com/track/2yCf80rxfz3Dk7OCAnQvz1\" target=\"_blank\" rel=\"noopener\"><em>Even So, Come<\/em><\/a>. CCLI#7036288<\/li>\n<li><a href=\"https://open.spotify.com/track/11pf16oEoZz9C5uSed3epd\" target=\"_blank\" rel=\"noopener\"><em>King of Heaven<\/em><\/a> or Version with <a href=\"https://open.spotify.com/track/2GXUshVKWi85bt11gDGJA6\" target=\"_blank\" rel=\"noopener\"><em>Hark the Herald Angels Sing<\/em><\/a><\/li>\n<li><a href=\"https://hymnary.org/hymn/UMH/202\" target=\"_blank\" rel=\"noopener\"><em>People Look East<\/em><\/a> <em>(Sing to the Lord Hymnal #202)<\/em><\/li>\n<li><em>We Are Waiting<\/em> (See video, chart, and link below)<\/li>\n<\/ul>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/MHA6y9Psyao?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"We Are Waiting\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://www.youtube.com/watch?v=MHA6y9Psyao\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"https://worshipcurrent.com/we-are-waiting/\" target=\"_blank\" rel=\"noopener\">Chord Chart (on Worship Current)<\/a><\/p>\n<p><a href=\"https://worshipcurrent.com/we-are-waiting/\" target=\"_blank\" rel=\"noopener\">Additional Resources for this song<\/a><\/p>\n<p>If you are interested in further dialogue about the content on any of the weekly worship resources pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w2-group": "<p>This week, we focus on the ministry of John the Baptist and the various ways that we are called to prepare for the coming of the Lord. The Advent theme is Peace, and as we engage with the Gospel we are reminded that one important aspect of peace is having peace with God. Peace with God is about being in right relationship with God, and this comes through repentance and forgiveness.<\/p>\n<p>As you prepare, you might want to read this week's Bible background page on <a href=\"#w2-text4\">Mark 1:1-8<\/a>.<\/p>\n<p>If you can display video content using a projector, TV, or even a laptop, consider using a video presentation of the passage, such as the one below.<\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/o-4hLxlo2Ik?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Daily Gospel Reading Video - St. Mark 1:1-8, WOG\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/o-4hLxlo2Ik\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%202_Peace/Small%20Group%20Resource%20Week%202.pdf\" target=\"_blank\" rel=\"noopener\">Small Group Handout<\/a><\/p>\n<p>If you focus on this week's spiritual practice in your group, be sure to see the page: <a href=\"#w2-practices\">Spiritual Practices: Week Two<\/a>.<\/p>\n<p>If you are interested in further dialogue about this content, you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w2-practices": "<p>This week’s handout gives you two ways to pray during Advent: Lectio Divina and short practices. You can pray each one on your own or with a small group, and you don’t need any experience to lead them. The steps are printed on each page.<\/p>\n<p><strong>Lectio Divina<\/strong> means sacred reading. It is an old way of praying with Scripture. You read a short passage aloud four times, slowly, and keep some silence after each reading. Each time, you listen for something different: a word that catches you, what it touches in your life, what you want to say to God, and then rest. In a group, a different person can read each time.<\/p>\n<p><strong>The practices<\/strong> are simple ways to pray with your body, your breath, and your attention. Each one takes 5 to 20 minutes and ends with questions to pray with or share.<\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%202_Peace/Advent%20Week%202%20Peace%20-%20Lectio%20and%20Group%20Practices.pdf\" target=\"_blank\" rel=\"noopener\">Week 2 Spiritual Practices PDF<\/a><\/p>\n<p>This week we hear God speak tenderly to a weary people, and we look for one small road toward peace.<\/p>\n<h3>Lectio Divina<\/h3>\n<p>Isaiah 40:1-2, 10-11<br>Psalm 85:8-11<br>2 Peter 3:8-9, 13<br>Mark 1:5-8<\/p>\n<h3>Practices<\/h3>\n<p>At the Jordan (15 minutes)<br>The Kiss of Peace (20 minutes)<\/p>\n<p>Each passage and practice starts on a new page, so you can print only the one you need. The handout comes as a ready-to-print PDF.<\/p>\n<p>These prayers are part of the Sacred Seasons web app. Currently the web app can be saved to a phone home screen and will act like an app. The iOS version will be made soon. To become a tester of the iOS or Android app when it is ready, or to sign up to hear about other seasons, visit <a href=\"https://sacredseasons.julenetegerstrand.com/\" target=\"_blank\" rel=\"noopener\">sacredseasons.julenetegerstrand.com<\/a>.<\/p>\n<div class=\"author\"><img src=\"assets/julene.jpg\" alt=\"Dr. Julene Tegerstrand\"><div><p>These Advent practices were created by <strong>Dr. Julene Tegerstrand<\/strong>, co-founder of <strong>Everyday Peacemaking<\/strong>, a ministry that helps people nurture inner resources for peace and practice compassion in a divided world. I also offer <strong>spiritual direction<\/strong> for individuals and groups, providing space to listen for God’s presence and tend to the soul. To learn more, visit <a href=\"https://www.everydaypeacemaking.com\" target=\"_blank\" rel=\"noopener\">www.everydaypeacemaking.com<\/a>, subscribe to my Substack <a href=\"https://humanisaverb.substack.com\" target=\"_blank\" rel=\"noopener\"><em>Human Is a Verb<\/em><\/a> for reflections and practices, or contact me at <a href=\"mailto:julenet@everydaypeacemaking.org\">julenet@everydaypeacemaking.org<\/a>.<\/p><\/div><\/div>\n", "c_w2-reflections": "<p><strong>Waiting with Peace: Prepare the Way<\/strong><\/p>\n<p>The theme for the second week of Advent is Peace. Peace can feel like an impossible dream as we witness violence, injustice, dehumanization, and suffering often justified in the name of God. We long for peace, but we know that peace is more than the absence of conflict. Peace is more than silence, stability, and the appearance of order. Sometimes what the world calls peace is simply the quiet that comes when those who suffer are told to remain silent.<\/p>\n<p>Toward the end of his <a href=\"https://bri-wp-images.s3.amazonaws.com/wp-content/uploads/Letter-From-Birmingham-Jail.pdf\" target=\"_blank\" rel=\"noopener\">Letter from Birmingham Jail<\/a>, Dr. King notes:<\/p>\n<p><em>\"I must make two honest confessions to you, my Christian and Jewish brothers. First, I must confess that over the last few years I have been gravely disappointed with the white moderate. I have almost reached the regrettable conclusion that the Negro's great stumbling block in the stride toward freedom is not the White citizens' “Councilor” or the Ku Klux Klanner, but the white moderate who is more devoted to “order” than to justice; who prefers a negative peace which is the absence of tension to a positive peace which is the presence of justice; who constantly says “I agree with you in the goal you seek, but I can't agree with your methods of direct action” who paternistically feels that he can set the timetable for another man's freedom; who lives by the myth of time and who constantly advises the Negro to wait until a “more convenient season.” Shallow understanding from people of good will is more frustrating than absolute misunderstanding from people of ill will. Lukewarm acceptance is much more bewildering than outright rejection.\"<\/em><\/p>\n<p>King's words challenge us to consider what kind of peace we are waiting for. Are we waiting for a peace that preserves the comfort of those who already have power, or are we longing for the kind of peace that emerges when justice is made real? Advent does not invite us to settle for the appearance of peace while our neighbors continue to suffer. It calls us to prepare the way for the coming of Christ, whose presence disrupts the status quo and invites us into a transformed world. Preparing the way means more than waiting quietly for God to act. It means examining the paths we have created, confronting the obstacles that keep people from experiencing dignity, and participating in God's work of making things right. The peace for which we wait is not the absence of conflict, but the presence of God's justice, compassion, and restorative love.<\/p>\n<p>The prophet Isaiah speaks to a people who have experienced devastation, displacement, and exile. Into their suffering, God declares, “Comfort, O comfort my people” (Isaiah 40:1). These words are not spoken to a people whose circumstances are already peaceful. They are spoken to people who need to know that their suffering has not been forgotten and that their story is not over. God promises that valleys will be lifted, mountains and hills made low, and rough places made plain. The vision is comforting but also disruptive. The world itself must change as God prepares the way for redemption.<\/p>\n<p>This is the peace of God. Peace does not ask the vulnerable and the suffering to accept their circumstances. Peace leans toward a world transformed by God's righteousness and justice. The coming of God brings comfort to those who suffer and challenges the conditions that produce that very suffering. God's peace does not depend on pretending that everything is well. It begins with the promise that God has not abandoned us.<\/p>\n<p>The writer of 2 Peter reminds us that God's timing is different from our own. What feels like delay is not God's absence. We wait for “new heavens and a new earth, where righteousness is at home” (2 Peter 3:13). While we wait, we are called to live lives of holiness. Waiting for God's peace is not passive. It shapes how we live now. We practice peace by refusing to participate in dehumanization, by confronting injustice, by extending compassion, and by building communities where our neighbors are treated as beloved children of God.<\/p>\n<p>In Mark's Gospel, John the Baptist appears in the wilderness, proclaiming a baptism of repentance for the forgiveness of sins. His message echoes Isaiah's call to prepare the way of the Lord. Before Jesus begins his public ministry, the people are invited to turn around, to change direction, and to make room for God's coming reign. The way of peace requires preparation. It asks us to examine the paths we have followed, the evil we have tolerated, and the ways our lives and communities must change to reflect God's vision.<\/p>\n<p>As we wait during this second week of Advent, may we resist the temptation to confuse peace with comfort or silence. May we hear God's promise of comfort for those who suffer. May we live faithfully in the time between the promise and its fulfillment. And may we prepare the way of the Lord by becoming people who embody the peace we proclaim. Amen.<\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Mat Thomas at <a href=\"mailto:pastor.mat.thomas@gmail.com\">pastor.mat.thomas@gmail.com<\/a><\/p>\n<p><img src=\"assets/thomas.jpg\" alt=\"Rev. Dr. Mat Thomas\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w2-text1": "<p><a href=\"https://www.biblegateway.com/passage/?search=isaiah%2040%3A1-11&version=NRSV\" target=\"_blank\" rel=\"noopener\">Isaiah 40:1-11<\/a><\/p>\n<p>Isaiah 40 begins a shift in the book of Isaiah. The first 39 chapters largely speak into a period of warning, judgment, and impending destruction. Isaiah 40 opens a new section, often referred to as 2nd Isaiah (Isaiah 40–55). Here, Isaiah is speaking to a people who have already experienced the devastation that earlier chapters warned about. Jerusalem has fallen. The temple has been destroyed. The people have lived through conquest and exile. They have lost their nation, their king, their temple, their freedom, and their familiar way of life.<\/p>\n<p>And now, after all of that, the first words we hear are, “Comfort, O comfort my people, says your God.”<\/p>\n<p>That is a powerful word to speak into this kind of suffering. God does not begin by explaining everything that happened or telling the people to try harder. God begins with comfort. Speak tenderly to Jerusalem. Tell them that their story is not over, that God is not finished with them yet, despite the devastation and destruction.<\/p>\n<p>Isaiah 40 is a text about peace in the aftermath of loss and grief. The people are living in the tension between what they have experienced and what God is promising. They have every reason to wonder whether God has abandoned them. They have every reason to ask whether they have a future. Are they waiting for something? Will God work again in their midst?<\/p>\n<p>Into that uncertainty comes the voice crying in the wilderness: “Prepare the way of the Lord.” The would have reminded those who first heard these words of the Exodus. Just as God once made a way for Israel out of slavery in Egypt, God is now making a way through the wilderness for God's people to return from exile. The highway through the desert is poetic language for a new Exodus, a new act of liberation. The valleys will be lifted, the mountains brought low, the rough places made plain. The God who heard the cries of enslaved people in Egypt is still the God who hears the cries of God's exiled people in Babylon.<\/p>\n<p>An important thing to note is that the people are not being told to find their own way home. God is making the way. Their hope rests not in their ability to control what happens next but in the faithfulness of God.<\/p>\n<p>That makes this particularly fitting for Advent and the theme of peace. Advent is a season of expectation. We wait for something we cannot yet fully see. But Christian waiting is not empty waiting. We wait because we have received a promise. In a Spirituality of Waiting, Henri Nouwen writes, \"Waiting, as we see it in the people on the first pages of the Gospel, is waiting with a sense of promise already begun in us. So waiting is never a movement from nothing to something. It is always a movement from 'Zechariah...your wife Elizabeth is to bear you a son.' 'Mary...Listen! You are to conceive and bear a son.' (Luke 1. 13, 31) People who wait have received a promise that allows them to wait. They have received something that is at work in them, like a seed that has started to grow. This is very important. We can only really wait if what we are waiting for has something more.\" The people of Isaiah 40 can wait because God has spoken. Their circumstances have not yet changed, but God's promise gives them a reason to believe that their circumstances are not the end of their story.<\/p>\n<p>Isaiah gives us a beautiful image in verse 11: “He will feed his flock like a shepherd; he will gather the lambs in his arms, and carry them in his bosom, and gently lead the mother sheep.” God who has been described throughout Isaiah as powerful and mighty is now revealed as bending down to gather vulnerable lambs into God's arms. God's faithfulness is revealed not only in power but in tenderness, presence, and care.<\/p>\n<p>The text does not promise that suffering will disappear. It does not deny the brokenness of the world or pretend that everything is already as it should be. Instead, it gives us a different kind of hope: God has not abandoned us. God is still making a way. The future is peace.<\/p>\n<p>That is the hope of Advent. We wait because we have already caught glimpses of what we are waiting for. We have experienced moments of peace, in a song, around a table, in the embrace of a loved one, in a community gathered together. Those glimpses do not mean the world is already whole. They remind us that peace is possible because God is still at work.<\/p>\n<p>So we wait. We hope. We long for something more. And Advent reminds us that the God who came to us in the vulnerability of a baby in a manger is still the God who comes alongside us in the wilderness, gathers us into God's arms, and makes a way where we cannot yet see one.  Thanks be to God.<\/p>\n<p>Here is a video I made on the historical context of the book of Isaiah. I am including it in other Isaiah commentaries as well.<\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/mw2sEPcUQKY?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Historical Context of Isaiah\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://www.youtube.com/watch?v=mw2sEPcUQKY\" target=\"_blank\" rel=\"noopener\">Historical Context of Isaiah<\/a><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Mat Thomas at <a href=\"mailto:pastor.mat.thomas@gmail.com\">pastor.mat.thomas@gmail.com<\/a>.<\/p>\n<p><img src=\"assets/thomas.jpg\" alt=\"Rev. Dr. Mat Thomas\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w2-text2": "<p>Psalm 85:1-2 and 8-13 is a song of thanksgiving and hope that celebrates God's forgiveness, peace, and the harmonious meeting of love, faithfulness, righteousness, and peace. It is this theme of peace that makes the Psalm a fitting one for the Second Sunday of Advent. Other Advent connections include the promise and hope that God's  \"salvation is near those who fear him,\" and that God's \"glory may dwell in our land\" (verse 9). The Psalm also affirms that righteousness goes before the Promise and prepares the way (verse 13). We find then, the Advent theme of preparation for the promise of peace, a peace that is connected to righteousness as God comes near.<\/p>\n<p>The Psalm moves from remembering past forgiveness (verses 1–2) to listening for God's present word (verse 8) and culminating in a vision of divine attributes uniting (verses 10–13). During Advent, this psalm bridges the tension between <strong>what God has already done<\/strong> (incarnation/past deliverance) and <strong>what we still wait for<\/strong> (the final renewal of creation).<\/p>\n<p><strong>Key Themes<\/strong><\/p>\n<ul>\n<li><strong>Forgiveness:<\/strong> God turns away anger and forgives the sins of the people.<\/li>\n<li><strong>Listening for Peace:<\/strong> The psalmist waits to hear God speak.<\/li>\n<li><strong>Divine Harmony:<\/strong> Verse 10 offers a famous poetic image where abstract virtues like love, faithfulness, righteousness, and peace come alive and embrace<\/li>\n<\/ul>\n<p><a href=\"New%20England%20Advent%202026/Week%202_Peace/Psalm%2085%20Responsive%20Reading.pdf\" target=\"_blank\" rel=\"noopener\">Responsive Reading of Psalm 85<\/a><\/p>\n<p><strong>Outline of Psalm 85 from <a href=\"https://www.amazon.com/Outline-Bible-Harold-L-Willmington/dp/0842337016\" target=\"_blank\" rel=\"noopener\">The Outline Bible<\/a><\/strong><\/p>\n<p>The psalmist seeks God in his need on the basis of God's past faithfulness to him. He expresses confidence that God will pour out blessings.<\/p>\n<p><strong>1. ACKNOWLEDGING THE PAST (85:1-3)<\/strong><\/p>\n<p style=\"margin-left:1.2em\">A. God restores his people (85:1): He blesses them.<\/p>\n<p style=\"margin-left:1.2em\">B. God forgives his people (85:2-3): He covers their sins and ends his anger.<\/p>\n<p><strong>II. QUESTIONING THE PRESENT (85:4-7)<\/strong><\/p>\n<p style=\"margin-left:1.2em\">A. \"Will you be angry with us always?\" (85:4-6): They ask God to put aside his wrath against them and future generations.<\/p>\n<p style=\"margin-left:1.2em\">B. \"Show us your unfailing love, O LORD\" (85:7): They ask God to grant them salvation.<\/p>\n<p><strong>III. ANTICIPATING THE FUTURE (85:8-13)<\/strong><\/p>\n<p style=\"margin-left:1.2em\">A. The glorious message (85:8-9): God promises peace and salvation to people who honor him.<\/p>\n<p style=\"margin-left:1.2em\">B. The glorious meetings (85:10-13)<\/p>\n<p style=\"margin-left:2.4em\">1. Unfailing love and truth meet (85:10).<\/p>\n<p style=\"margin-left:2.4em\">2. Righteousness and peace kiss (85:10-13)<\/p>\n<h3>Commentary Links<\/h3>\n<p><a href=\"https://www.aplainaccount.org/post/psalm-85-1-2-8-13-2\" target=\"_blank\" rel=\"noopener\">A Plain Account<\/a><br>\n<a href=\"https://cepreaching.org/commentary/2017-12-04/psalm-851-2-8-13/\" target=\"_blank\" rel=\"noopener\">Center for Excellence in Preaching<\/a><br>\n<a href=\"https://enduringword.com/bible-commentary/psalm-85/\" target=\"_blank\" rel=\"noopener\">Enduring Word Commentary<\/a><br>\n<a href=\"https://www.youtube.com/watch?v=70XlE3emhjA\" target=\"_blank\" rel=\"noopener\">Five Minute Commentary<\/a><br>\n<a href=\"https://www.workingpreacher.org/commentaries/revised-common-lectionary/second-sunday-of-advent-2/commentary-on-psalm-851-2-8-13-4\" target=\"_blank\" rel=\"noopener\">Working Preacher<\/a><\/p>\n<h3>Musical Settings<\/h3>\n<p><a href=\"https://open.spotify.com/track/0M9nbG5mdtHky75FTvEvyf\" target=\"_blank\" rel=\"noopener\">Psalm 85 (Poor Bishop Hooper)<\/a><br>\n<a href=\"https://open.spotify.com/track/2DfYLCMxL1PubiMgBT16Eo\" target=\"_blank\" rel=\"noopener\">Psalm 85 (Sacred Word Worship)<\/a><br>\n<a href=\"https://open.spotify.com/track/3RjXiN1S1P7G2i41lYW1W5\" target=\"_blank\" rel=\"noopener\">Psalm 85 (Streetlights) - Spoken Word<\/a><\/p>\n<p>If you are interested in further dialogue about the content on any of the weekly Psalm pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w2-text3": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/ShceIObHsik?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"2 Peter 3:8-15, Dave Young\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/ShceIObHsik\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%202_Peace/2%20Peter%203.docx\" download>2 Peter 3.docx<\/a> <span class=\"muted\">Bible text in this handout: the Common English Bible (CEB).<\/span><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Dave Young at <a href=\"mailto:dave@northst.org\">dave@northst.org<\/a>.<\/p>\n<p><img src=\"assets/young.jpg\" alt=\"Rev. Dr. David Young\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w2-text4": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/Jes_1Y0OKP0?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Mark 1:1-8, Dave Young\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/Jes_1Y0OKP0\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%202_Peace/Mark%201.docx\" download>Mark 1.docx<\/a> <span class=\"muted\">Bible text in this handout: the New Revised Standard Version (NRSV).<\/span><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Dave Young at <a href=\"mailto:dave@northst.org\">dave@northst.org<\/a>.<\/p>\n<p><img src=\"assets/young.jpg\" alt=\"Rev. Dr. David Young\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w2-worship": "<p><strong><em>Worship on the Second Sunday of Advent<\/em><\/strong><\/p>\n<p>This week, we continue to focus on Advent in general, and also introduce the theme of Peace. (As has been said elsewhere, sometimes the themes in Weeks Two and Four flip between Peace and Love. Different years, different traditions, and different text choices, among other factors, can all influence this. The themes of Weeks One and Three are mostly fixed.) The Scripture texts invite us to think of Peace in multiple dimensions. It is Peace (rest, calm, stillness) in our hearts. It is Peace (reconciliation, relationship, restoration) with God. It is Peace (reconciliation, relationship restoration) with others. In a world of conflict and division, this Advent theme is no small claim. In a season of rush and hurriedness, this Advent theme is no small feat. Invite people into all of the dimensions of Peace!<\/p>\n<p>Note: With the theme of Peace, I am suggesting the use of some Christmas carols/songs with that theme. While generally we want to use them sparingly in Advent, I am suggesting that we limit the use of Christmas music to songs that highlight the weekly theme. Keep some true Advent-themed music present each week.<\/p>\n<p><strong>Worship Themes to Consider<\/strong><\/p>\n<ul>\n<li>Peace, rest, stillness<\/li>\n<li>Reconciliation with God and others<\/li>\n<li>Peacekeeping<\/li>\n<li>Justice<\/li>\n<li>Wholeness<\/li>\n<li>Jesus as the Prince of Peace<\/li>\n<li>The Shalom of God<\/li>\n<li>The coming, peaceable Kingdom<\/li>\n<\/ul>\n<p><strong>Advent Call to Worship<\/strong><\/p>\n<p>Leader: We gather in these darkening days, anticipating the light that is to come, for we long for peace in a world filled with turmoil. Not merely the absence of conflict, but God's deep, abiding shalom—justice, harmony, and a deep sense of calm in our hearts.<\/p>\n<p><strong>All: We come preparing the way of the Lord, to make a highway in our spirits for God's peace to enter in.<\/strong><\/p>\n<p>Leader: We lift up our voices, a longing for a world where swords are beaten into plowshares, and our spirits are freed from anxiety and fear.<\/p>\n<p><strong>All: We seek the presence of God, the steady, unchanging character of the Prince of Peace, whose light guides our feet into ways of peace.<\/strong><\/p>\n<p>Leader: Let us be bearers of God's peace into our communities, our families, and the world, as we wait with hopeful hearts for the arrival of Christ, the Prince of Peace.<\/p>\n<p><strong>All: In the name of the One who is coming, bringing hope, love, peace, and joy, Amen.<\/strong><\/p>\n<p>We can also use the Psalms reading as a call to worship, or elsewhere in the worship flow. Each week, we have the Psalm as a responsive reading, which is a great option. It adds Scripture to our worship and gives congregational participation beyond singing.<\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%202_Peace/Psalm%2085%20Responsive%20Reading.pdf\" target=\"_blank\" rel=\"noopener\">Responsive Reading - Psalm 85:1-2, 8-13<\/a><\/p>\n<p>You can also explore various worship resources connected to the Psalm on the <a href=\"#w2-text2\">Psalm 85<\/a> page.<\/p>\n<p><strong>Lighting the Advent Wreath (see the dedicated <a href=\"#wreath\">PAGE<\/a> to this Advent tradition)<\/strong><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%202_Peace/Week%20Two%20Advent%20Wreath%20Readings.pdf\" target=\"_blank\" rel=\"noopener\">Week Two Advent Wreath Reading<\/a><\/p>\n<p><strong>Hymn Suggestions<\/strong><br><em>(Hymn #s are from the Sing to the Lord Hymnal)<\/em><\/p>\n<ul>\n<li><em>Be Still My Soul #97<\/em><\/li>\n<li><em>Hark! The Herald Angels Sing #191<\/em> (\"Hail the heav'n born Prince of Peace\")<\/li>\n<li><em>I Heard the Bells on Christmas Day #195<\/em><\/li>\n<li>Like a River Glorious #592<\/li>\n<li>Wonderful Peace #590<\/li>\n<li>Wonderful Peace #591<\/li>\n<\/ul>\n<p>Note: It is tempting to use Silent Night (\"sleep in heavenly peace\"), but let's save it for Christmas Eve. :)<\/p>\n<p><strong>Other Song Suggestions<\/strong><\/p>\n<ul>\n<li><a href=\"https://open.spotify.com/track/5Gzoj8wHozuSPn4eOFIQu1\" target=\"_blank\" rel=\"noopener\"><em>Be Still My Soul<\/em><\/a><\/li>\n<li><a href=\"https://open.spotify.com/track/67KczQZbT5xj285LgGzbqX\" target=\"_blank\" rel=\"noopener\">Glory (Let there Be Peace)<\/a> - Matt Maher<\/li>\n<li><em>Let There Be Peace on Earth<\/em><\/li>\n<li><a href=\"https://open.spotify.com/track/1bqW0eAGPqJt7svS6WTuut\" target=\"_blank\" rel=\"noopener\"><em>Peace Has Come<\/em><\/a><\/li>\n<li><a href=\"https://open.spotify.com/track/346VmMBDzylMVkjhvi5Hql\" target=\"_blank\" rel=\"noopener\"><em>Perfect Peace<\/em><\/a><\/li>\n<li><a href=\"https://open.spotify.com/track/7162zAmSAActZHRv5R64JF\" target=\"_blank\" rel=\"noopener\"><em>Prince of Peace<\/em><\/a> <em>(just the refrain)<\/em> (Twila Paris in Master Chorus Book)<\/li>\n<li><a href=\"https://open.spotify.com/track/7CBJgixoDld8SnCAjFpBUp\" target=\"_blank\" rel=\"noopener\">Prince of Peace (Hillsong)<\/a><\/li>\n<li><a href=\"https://open.spotify.com/track/1gUoaZkPi7vMZdxMlGsGOw\" target=\"_blank\" rel=\"noopener\">You Are Holy (Prince of Peace)<\/a><\/li>\n<\/ul>\n<p>If you are interested in further dialogue about the content on any of the weekly worship resources pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w3-group": "<p>This week, we again explore the ministry of John the Baptist as a ministry of preparing a people for the coming of the Lord. This week we turn to the Gospel of John for his account of that ministry. As you prepare, you might want to read this week's Bible background page on <a href=\"#w3-text4\">John 1:6-8, 19-28<\/a><\/p>\n<p>If you can display video content using a projector, TV, or even a laptop, consider using a video presentation of the passage, such as the one below.<\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/W_Feg9uAomw?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Daily Gospel Reading Video - St. John 1:6-8,19-28, WOG\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/W_Feg9uAomw\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%203_Joy/Small%20Group%20Resource%20Week%203.pdf\" target=\"_blank\" rel=\"noopener\">Small Group Handout<\/a><\/p>\n<p>If you focus on this week's spiritual practice in your group, be sure to see the page: <a href=\"#w3-practices\">Spiritual Practices: Week Three<\/a>.<\/p>\n<p>If you are interested in further dialogue about this content, you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w3-practices": "<p>This week’s handout gives you two ways to pray during Advent: Lectio Divina and short practices. You can pray each one on your own or with a small group, and you don’t need any experience to lead them. The steps are printed on each page.<\/p>\n<p><strong>Lectio Divina<\/strong> means sacred reading. It is an old way of praying with Scripture. You read a short passage aloud four times, slowly, and keep some silence after each reading. Each time, you listen for something different: a word that catches you, what it touches in your life, what you want to say to God, and then rest. In a group, a different person can read each time.<\/p>\n<p><strong>The practices<\/strong> are simple ways to pray with your body, your breath, and your attention. Each one takes 5 to 20 minutes and ends with questions to pray with or share.<\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%203_Joy/Advent%20Week%203%20Joy%20-%20Lectio%20and%20Group%20Practices.pdf\" target=\"_blank\" rel=\"noopener\">Week 3 Spiritual Practices PDF<\/a><\/p>\n<p>This week we make room for joy without forcing it, alongside the grief people carry.<\/p>\n<h3>Lectio Divina<\/h3>\n<p>Psalm 126:3-6<br>Isaiah 61:1-3<br>1 Thessalonians 5:16-19<br>John 1:6-8<\/p>\n<h3>Practices<\/h3>\n<p>Ashes and Garland (15 minutes)<br>The Magnificat from the Margins (20 minutes)<\/p>\n<p>Each passage and practice starts on a new page, so you can print only the one you need. The handout comes as a ready-to-print PDF.<\/p>\n<p>These prayers are part of the Sacred Seasons web app. Currently the web app can be saved to a phone home screen and will act like an app. The iOS version will be made soon. To become a tester of the iOS or Android app when it is ready, or to sign up to hear about other seasons, visit <a href=\"https://sacredseasons.julenetegerstrand.com/\" target=\"_blank\" rel=\"noopener\">sacredseasons.julenetegerstrand.com<\/a>.<\/p>\n<div class=\"author\"><img src=\"assets/julene.jpg\" alt=\"Dr. Julene Tegerstrand\"><div><p>These Advent practices were created by <strong>Dr. Julene Tegerstrand<\/strong>, co-founder of <strong>Everyday Peacemaking<\/strong>, a ministry that helps people nurture inner resources for peace and practice compassion in a divided world. I also offer <strong>spiritual direction<\/strong> for individuals and groups, providing space to listen for God’s presence and tend to the soul. To learn more, visit <a href=\"https://www.everydaypeacemaking.com\" target=\"_blank\" rel=\"noopener\">www.everydaypeacemaking.com<\/a>, subscribe to my Substack <a href=\"https://humanisaverb.substack.com\" target=\"_blank\" rel=\"noopener\"><em>Human Is a Verb<\/em><\/a> for reflections and practices, or contact me at <a href=\"mailto:julenet@everydaypeacemaking.org\">julenet@everydaypeacemaking.org<\/a>.<\/p><\/div><\/div>\n", "c_w3-reflections": "<p><strong>Waiting with Joy: Joy as Resistance<\/strong><\/p>\n<p>The theme for the third week of Advent is joy. Sometimes it is difficult to wait with joy as we witness violence, evil, and dehumanization all celebrated in the name of God. How do we embrace joy when the world seems to be unraveling around us? How do we rejoice when people suffer, when communities grieve, and when the powerful continue to oppress the vulnerable? Perhaps the answer is that joy, properly understood, is not an emotion we experience when life is going well. Joy is an act of resistance. It is a refusal to surrender our hope, our humanity, and our commitment to God's vision for the world.<\/p>\n<p>Upon returning from exile and encountering devastating circumstances, the prophet Isaiah proclaims a vision of hope and joy. The people have returned to their homeland, but their homecoming has not brought the restoration they anticipated. Jerusalem lies in ruins, the community faces economic hardship, and the wounds of displacement remain. The work of rebuilding is both physical, emotional, mental, and spiritual. The people must imagine a future when their present circumstances offer little reason for hope.<\/p>\n<p>It is in this context that the prophet Isaiah proclaims, \"The Spirit of the Lord God is upon me, because the Lord has anointed me; he has sent me to bring good news to the oppressed, to bind up the broken-hearted, to proclaim liberty to the captives, and release to the prisoners\" (Isaiah 61:1). He continues, \"To provide for those who mourn in Zion—to give them a garland instead of ashes, the oil of gladness instead of mourning, the mantle of praise instead of a faint spirit\" (Isaiah 61:3a). Despite the fact that home was not a place of safety and security, Isaiah chose to embrace joy.<\/p>\n<p>Isaiah's vision of joy is informed by God's commitment to liberation and restoration. This is not joy that asks the oppressed to overlook their suffering or encourages the brokenhearted to pretend that everything is fine. It is joy rooted in God's promise to transform the conditions that produce oppression, grief, and despair. The promise of gladness comes alongside the promise of good news for the poor, healing for the brokenhearted, and freedom for the captive.<\/p>\n<p><strong>Joy is resistance to the destruction of God's world.<\/strong> It resists the lie that oppression is inevitable, that suffering is unimportant, and that the powerful will always prevail. Isaiah's proclamation insists that the devastation of the present does not define the possibilities of God's future. To embrace joy is to begin living in anticipation of that future, even while the work of restoration remains unfinished.<\/p>\n<p>In 1 Thessalonians, the Apostle Paul invites his listeners to \"Rejoice always, pray without ceasing, give thanks in all circumstances; for this is the will of God in Christ Jesus for you\" (1 Thessalonians 5:16-18). Initially these words might sound like an invitation to perpetual cheerfulness or a command to be grateful regardless of what happens. But the literary context reveals a community wrestling with grief and uncertainty.<\/p>\n<p>Earlier in the letter, Paul addresses the Thessalonians' concern for fellow believers who have died. He does not dismiss their sorrow or suggest that faithful Christians should not mourn. Instead, he reminds them that they grieve differently because their grief is shaped by hope: “For since we believe that Jesus died and rose again, even so, through Jesus, God will bring with him those who have died” (1 Thessalonians 4:14).<\/p>\n<p>Christian joy does not eliminate grief. It refuses to let grief become the whole story. Because Jesus has died and been raised, death does not have the final word over those whom God loves. The resurrection announces that the violence of the world, the reality of loss, and even the grave cannot ultimately defeat God's purposes.<\/p>\n<p><strong>Joy is resistance to death.<\/strong> It is a stubborn proclamation that even death does not determine the limits of our hope. It is resistance to the forces that treat some lives as disposable, to the violence that destroys communities, and to the despair that tells us nothing can change. We can mourn honestly while continuing to hope boldly. We can acknowledge the reality of death while bearing witness to the God who raises the dead.<\/p>\n<p>Paul continues his letter with a prayer that brings the hope of Advent into conversation with the Wesleyan understanding of entire sanctification: “May the God of peace himself sanctify you entirely; and may your spirit and soul and body be kept sound and blameless at the coming of our Lord Jesus Christ. The one who calls you is faithful, and he will do this” (1 Thessalonians 5:23–24).<\/p>\n<p>The God who calls us is also the God who transforms us. Entire sanctification is not an escape from the world or a withdrawal from its suffering. It is God's work of transforming us in love, shaping our hearts, our relationships, and our embodied lives toward holiness. This transformation enables us to resist the forces that deform our humanity and estrange us from one another. As God's grace forms us in holy love, we become people who can embody God's peace in a world marked by violence. We can extend compassion where there is cruelty and cultivate belonging where people are excluded.<\/p>\n<p>And there is joy in this promise. Our transformation does not depend solely on our strength or our ability to repair the world through our own efforts. Paul declares, “The one who calls you is faithful, and he will do this” (1 Thessalonians 5:24). We rejoice because God's sanctifying grace is at work in us, even if our transformation remains incomplete. We rejoice because the God who calls us to holiness is faithful to the work of making us holy in love.<\/p>\n<p><strong>Joy is resistance to the forces that deform us.<\/strong> It is a refusal to allow hatred to shape our hearts, cruelty to determine our practices, or injustice to define our communities. Sanctifying grace does not make us indifferent to the world. It forms us to participate more fully in God's work of healing and restoration.<\/p>\n<p>The Gospel of John introduces another aspect of joy through the witness of John the Baptist. John is sent from God “to testify to the light, so that all might believe through him” (John 1:6–7). The Gospel is careful to clarify that John himself is not the light, Instead, John comes to bear witness to the light. When religious authorities question his identity and demand to know who he is, John refuses the titles they offer him. Instead, he identifies himself as “the voice of one crying out in the wilderness, ‘Make straight the way of the Lord’” (John 1:23).<\/p>\n<p>John's witness is important because he proclaims the coming of Christ in a world (like ours) that has not yet been transformed. The light has come into the world, but the world remains marked by darkness. The promised Messiah is approaching, but the people still live under the weight of political domination and religious expectation. John does not pretend that liberation has already been fully realized. He calls people to prepare the way.<\/p>\n<p>This is the tension of Advent. We embrace joy in what God has done and what God has promised, while as we wait for the fullness of God's kingdom. We bear witness to the light without pretending that the darkness has disappeared.<\/p>\n<p><strong>Joy is resistance to despair.<\/strong> Like John the Baptist, we are called to testify to the light even when we cannot yet see the fullness of its triumph. Our witness is not that the world is already as God intends it to be. Our witness is that the darkness does not overcome the light, and that the One who comes is worthy of our hope, our allegiance, and our lives.<\/p>\n<p>Therefore, joy is not the same as happiness. Happiness often describes a feeling shaped by our circumstances. Joy can coexist with anger, sorrow, exhaustion, and uncertainty. Christian joy does not require us to minimize injustice, ignore our grief, or manufacture a positive attitude in the face of suffering. Instead, joy is grounded in the character and faithfulness of God. It sustains our resistance to the powers of death and destruction while equipping us to participate in God's work of salvation and sanctification.<\/p>\n<p>In his book Martin &amp; Malcolm &amp; America, theologian James Cone emphasizes the role of laughter in the lives and activism of Martin Luther King Jr. and Malcolm X. He writes:<\/p>\n<p>“To fight for life is to experience the joy of life. To laugh, to have fun, is to bear witness to life against death. Therefore, let us laugh, let us shout for joy, not as an indication that we are no longer angry but rather as a sign that we have just begun to fight” (Cone, 309).<\/p>\n<p><img src=\"assets/mlk-malcolm-x.jpg\" alt=\"Martin Luther King Jr. and Malcolm X smiling together\" style=\"width:180px;height:auto;border-radius:12px\"><\/p>\n<p>James Cone reminds us that joy is not the opposite of anger or resistance. We can be angry about injustice and still laugh. We can grieve the violence inflicted upon our community and still celebrate the gift of life. We can recognize the vastness of the struggle before us and still experience the joy of being together, loving one another, and refusing to surrender our humanity to the forces that seek to diminish it.<\/p>\n<p>This is the joy of Advent. We rejoice not because oppression has ended, death has disappeared, or the world has finally become entirely sanctified. We rejoice because God is faithful. We rejoice because Christ has come, Christ is present among us, and Christ will come again. We rejoice because God's grace continues to transform us into people of holy love. We rejoice because the light shines in the darkness.<\/p>\n<p>As we wait for Christ, may our joy be more than a feeling. May it become a form of resistance: Resistance to oppression, resistance to death, resistance to dehumanization, resistance to despair, and resistance to every power that contradicts God's vision of abundant life. May we laugh, sing, worship, love, and work for justice, not because the struggle is over, but because God has called us to participate in the work of making all things new.<\/p>\n<p>This Advent, may we wait with joy. And may our joy bear witness to the world that we have not given up for the light is still shining in the darkness.<\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Mat Thomas at <a href=\"mailto:pastor.mat.thomas@gmail.com\">pastor.mat.thomas@gmail.com<\/a><\/p>\n<p><img src=\"assets/thomas.jpg\" alt=\"Rev. Dr. Mat Thomas\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w3-text1": "<p>Psalm 126 is a Psalm of joy. It is part of the collection of Psalms we know as the <a href=\"https://www.biblehub.com/q/what_are_the_bible's_songs_of_ascent.htm\" target=\"_blank\" rel=\"noopener\">Songs of Ascent<\/a>, traveling psalms to be used by pilgrims going up to Jerusalem. The tone of the Psalm moves from astonished, communal joy to an earnest prayer for ongoing restoration. The Psalm connects to the season of Advent primarily through the theme of joy. It is important to note both the communal reality of joy in the midst of the journey, as well as the reminder that sorrow and joy are interwoven in life. There is hope, however, in the promise that the long night of sorrow will not endure forever.  \"They that sow in tears will reap in joy!\" Advent points ahead to the reason to proclaim, \"the Lord has done great tings for us!\" I appreciate what author,  Paul Anthony Carr wrote about this psalm:<\/p>\n<p>\"Psalm 126 is a psalm of trouble, but it's a psalm of trouble with a twist. It's a psalm that offers you hope when you are in the midst of trouble and tears. It tells us that times of trouble and sorrow do not last. God will turn your sorrow to joy and your tears to laughter. Weeping may endure for the night, but joy comes in the morning. And one day we will leave all the sorrows of this world behind for the eternal joys that await us in heaven.\" (from the sermon, \"<a href=\"https://revpacman.com/2021/07/25/psalm-126-gods-promise-of-enduring/\" target=\"_blank\" rel=\"noopener\">Psalm 126: God's Promise of Enduring Love<\/a>\")<\/p>\n<p><strong>Major Themes<\/strong><\/p>\n<ul>\n<li><strong>Astonished Joy (Verses 1–3):<\/strong> The people describe their release from exile as feeling \"like those who dream\", filled with laughter and singing so striking that even neighboring nations acknowledged God's work.<\/li>\n<li><strong>Prayer for Renewal (Verse 4):<\/strong> The community asks God to fully restore their fortunes, comparing the request to seasonal desert streams (<em>Negev<\/em>) flowing back to life with water.<\/li>\n<li><strong>Sowing and Reaping (Verses 5–6):<\/strong> A profound promise that hardship and grief (\"sowing in tears\") will ultimately culminate in a harvest of gladness (\"reaping in joy\")<\/li>\n<\/ul>\n<p><a href=\"New%20England%20Advent%202026/Week%203_Joy/Psalm%20126%20Responsive%20Reading.pdf\" target=\"_blank\" rel=\"noopener\">Responsive Reading of Psalm 126<\/a><\/p>\n<p><strong>Outline of Psalm 126 from <a href=\"https://www.amazon.com/Outline-Bible-Harold-L-Willmington/dp/0842337016\" target=\"_blank\" rel=\"noopener\">The Outline Bible<\/a><\/strong><\/p>\n<p>The psalmist remembers God's great deliverance and prays it will continue until completion. He describes the nation Judah's emotion upon being released from a terrible captivity.<\/p>\n<p>1. THE REALITY (126:1: At first the freed captives have difficulty comprehending the truth of this wonderful event.<\/p>\n<p>II. THE REACTION (126:2-3)<\/p>\n<p style=\"margin-left:1.2em\">A. Among the people (126:2-3): They are filled with laughter and testify to God's faithfulness.<\/p>\n<p style=\"margin-left:1.2em\">B. Among the pagans (126:2): They acknowledge God's care amazing things he does for his people.<\/p>\n<p>III. THE REQUEST (126:4-6)<\/p>\n<p style=\"margin-left:1.2em\">A. The petition (126:4): \"Restore our fortunes, LORD.\".<\/p>\n<p style=\"margin-left:1.2em\">B. The promise (126:5-6): Those who plant in tears will harve<\/p>\n<h3>Commentary Links<\/h3>\n<p><a href=\"https://www.aplainaccount.org/post/2016/03/07/psalm-126\" target=\"_blank\" rel=\"noopener\">A Plain Account<\/a><br>\n<a href=\"https://cepreaching.org/commentary/2017-12-11/psalm-126/\" target=\"_blank\" rel=\"noopener\">Center for Excellence in Preaching<\/a><br>\n<a href=\"https://enduringword.com/bible-commentary/psalm-126/\" target=\"_blank\" rel=\"noopener\">Enduring Word Commentary<\/a><br>\n<a href=\"https://youtu.be/83abLc0Wh10\" target=\"_blank\" rel=\"noopener\">Five Minute Commentary<\/a><br>\n<span class=\"muted\">Working Preacher (link to be added)<\/span><\/p>\n<h3>Musical Settings<\/h3>\n<p><a href=\"https://open.spotify.com/track/6bsw9snfsEw1QsWwzrIdV7\" target=\"_blank\" rel=\"noopener\">Psalm 126 (Drew Miller)<\/a><br>\n<a href=\"https://open.spotify.com/track/1o0GjFFM1A4Os4NWPUOZef\" target=\"_blank\" rel=\"noopener\">Psalm 126 (Hope College Worship)<\/a><br>\n<a href=\"https://open.spotify.com/track/6A5gYwYwu1a3pSlXZmRae5\" target=\"_blank\" rel=\"noopener\">Psalm 126 (Poor Bishop Hooper)<\/a><br>\n<a href=\"https://open.spotify.com/track/1ImV5euhFGTOWoK6YbhRzn\" target=\"_blank\" rel=\"noopener\">Psalm 126 (Sacred Word Worship)<\/a><br>\n<a href=\"https://open.spotify.com/track/4yVkird82XfFf7vLkKwDqB\" target=\"_blank\" rel=\"noopener\">Psalm 126 (You Have Done Great Things) - Passion<\/a><\/p>\n<p>If you are interested in further dialogue about the content on any of the weekly Psalm pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w3-text2": "<p><a href=\"https://www.biblegateway.com/passage/?search=Isaiah%2061%3A1-4%2C%208-11&version=NRSV\" target=\"_blank\" rel=\"noopener\">Isaiah 61:1-4, 8-11<\/a><\/p>\n<p><a href=\"https://youtu.be/qHnUGyTx2G8\" target=\"_blank\" rel=\"noopener\">Click here for the Commentary on Isaiah 61:1-4, 8-11<\/a><\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/qHnUGyTx2G8?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Commentary on Isaiah 61:1-4, 8-11\" allowfullscreen><\/iframe><\/div>\n<p>Here is a video on the historical context of the book of Isaiah. I am including it in other Isaiah commentaries as well.<\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/mw2sEPcUQKY?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Historical Context of Isaiah\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://www.youtube.com/watch?v=mw2sEPcUQKY\" target=\"_blank\" rel=\"noopener\">Historical Context of Isaiah<\/a><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Mat Thomas at <a href=\"mailto:pastor.mat.thomas@gmail.com\">pastor.mat.thomas@gmail.com<\/a><\/p>\n<p><img src=\"assets/thomas.jpg\" alt=\"Rev. Dr. Mat Thomas\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w3-text3": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/8gQ1yha4TJw?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"1 Thessalonians 5:16-24, Dave Young\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/8gQ1yha4TJw\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%203_Joy/1%20Thess%205-16-24.docx\" download>1 Thess 5-16-24.docx<\/a> <span class=\"muted\">Bible text in this handout: the New Revised Standard Version (NRSV).<\/span><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Dave Young at <a href=\"mailto:dave@northst.org\">dave@northst.org<\/a>.<\/p>\n<p><img src=\"assets/young.jpg\" alt=\"Rev. Dr. David Young\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w3-text4": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/DTKcl5zBnLw?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"John 1:6-8, 19-28, Dave Young\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/DTKcl5zBnLw\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%203_Joy/John%201.docx\" download>John 1.docx<\/a> <span class=\"muted\">Bible text in this handout: the Common English Bible (CEB).<\/span><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Dave Young at <a href=\"mailto:dave@northst.org\">dave@northst.org<\/a>.<\/p>\n<p><img src=\"assets/young.jpg\" alt=\"Rev. Dr. David Young\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w3-worship": "<p><strong><em>Worship on the Third Sunday of Advent<\/em><\/strong><\/p>\n<p>Also called Gaudete Sunday (Latin for \"rejoice\"), the Third Sunday of Advent focuses on Joy. We light the pink candle and rejoice in the approaching Advent of Jesus. We can include Advent songs and themes, but can lean into this \"Christmas\" theme of joy. Hard not to sing Joy to the World! :) (Other than the opening line, this hymn of the Kingdom of God actually has very little direct language of Advent/Christmas.)<\/p>\n<p><strong>Worship Themes to Consider<\/strong><\/p>\n<ul>\n<li>Joy<\/li>\n<li>Rejoicing (Rejoicing in hope)<\/li>\n<li>Praise<\/li>\n<li>Joy as gift, resistance, anticipation<\/li>\n<\/ul>\n<p><strong>Advent Call to Worship<\/strong><\/p>\n<p>Leader: The world is a place of waiting, often shadowed by uncertainty and hardship. Yet, even in these times, a profound joy is offered to us.<\/p>\n<p><strong>People: We come together seeking that joy, to let it fill our hearts and overflow into the world.<\/strong><\/p>\n<p>Leader: For God's promise is near, and God's presence is with us. Let us lift our voices in joyful praise for the coming of the Lord.<\/p>\n<p><strong>People: Let us worship God with shouts of joy and open hearts!<\/strong><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%203_Joy/Responsive%20Reading%20-%20Psalm%20126-2.pdf\" target=\"_blank\" rel=\"noopener\">Responsive Reading - Psalm 126<\/a><\/p>\n<p>We can also use the Psalms reading as a call to worship, or elsewhere in the worship flow. Each week, we have the Psalm in the form of a responsive reading, which is a great option. It adds additional Scripture in our worship and also gives congregational participation in a way beyond singing.<\/p>\n<p>You can also explore various worship resources connected to the Psalm on the <a href=\"#w3-text1\">Psalm 126<\/a> page.<\/p>\n<p><strong>Lighting the Advent Wreath (see the dedicated <a href=\"#wreath\">PAGE<\/a> to this Advent tradition)<\/strong><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%203_Joy/Week%20Three%20Advent%20Wreath%20Readings.pdf\" target=\"_blank\" rel=\"noopener\">Week Three Advent Wreath Reading<\/a><\/p>\n<p><strong>Hymn Suggestions<\/strong><br><em>(Hymn #s are from the Sing to the Lord Hymnal)<\/em><\/p>\n<ul>\n<li><em>God Rest You Merry, Gentlemen #184<\/em><\/li>\n<li><em>Good Christians, All, Rejoice #182<\/em><\/li>\n<li><em>How Great Our Joy! #197<\/em><\/li>\n<li><em>Joy to the World #173<\/em><\/li>\n<li>Joyful, Joyful, We Adore You (Christmas lyrics) #174<\/li>\n<li><em>There's a Song in the Air #196<\/em><\/li>\n<\/ul>\n<p><strong>Other Song Suggestions<\/strong><\/p>\n<ul>\n<li><a href=\"https://open.spotify.com/track/3Gyl1BvC41QD8rXEMfSQWY\" target=\"_blank\" rel=\"noopener\">House of the Lord<\/a><\/li>\n<li><a href=\"https://open.spotify.com/track/5wDPco8kl6sRponff5L9Th\" target=\"_blank\" rel=\"noopener\">Joy to the World (Joyful, Joyful)<\/a><\/li>\n<li><a href=\"https://open.spotify.com/track/1lK4SFE2TMeqEziR3TURFO\" target=\"_blank\" rel=\"noopener\">Joy to the World (Unspeakable Joy)<\/a><\/li>\n<li><a href=\"https://open.spotify.com/track/6mE6s9wjRtBeoe6IqvBXXL\" target=\"_blank\" rel=\"noopener\">Rejoice (Gayle)<\/a><\/li>\n<li><a href=\"https://open.spotify.com/track/1QMXR5HEcic19jfv6AhaLh\" target=\"_blank\" rel=\"noopener\">Rejoice (Getty)<\/a><\/li>\n<li><a href=\"https://open.spotify.com/track/56x2k0KeA1S5NpryHPtx1P\" target=\"_blank\" rel=\"noopener\">The Joy<\/a><\/li>\n<\/ul>\n<p>If you are interested in further dialogue about the content on any of the weekly worship resources pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w4-group": "<p>This week, we focus on the visit of the Angel Gabriel to Mary. As we focus on Advent love, we also recall the ways that Mary had to adjust to the plan of God, even when that plan was difficult to understand or even believe.<\/p>\n<p>As you prepare, you might want to read this week's Bible background page on <a href=\"#w4-text4\">Luke 1:26-38<\/a><\/p>\n<p>If you can display video content using a projector, TV, or even a laptop, consider using a video presentation of the passage, such as the one below.<\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/9r931vGQk8Q?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Daily Gospel Reading Video - St. Luke 1:26-38, WOG\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/9r931vGQk8Q\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%204_Love/Small%20Group%20Resource%20Week%204.pdf\" target=\"_blank\" rel=\"noopener\">Small Group Handout<\/a><\/p>\n<p>If you focus on this week's spiritual practice in your group, be sure to see the page: <a href=\"#w4-practices\">Spiritual Practices: Week Four<\/a>.<\/p>\n<p>If you are interested in further dialogue about this content, you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w4-practices": "<p>This week’s handout gives you two ways to pray during Advent: Lectio Divina and short practices. You can pray each one on your own or with a small group, and you don’t need any experience to lead th
