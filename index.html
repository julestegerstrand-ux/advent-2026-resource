em. The steps are printed on each page.<\/p>\n<p><strong>Lectio Divina<\/strong> means sacred reading. It is an old way of praying with Scripture. You read a short passage aloud four times, slowly, and keep some silence after each reading. Each time, you listen for something different: a word that catches you, what it touches in your life, what you want to say to God, and then rest. In a group, a different person can read each time.<\/p>\n<p><strong>The practices<\/strong> are simple ways to pray with your body, your breath, and your attention. Each one takes 5 to 20 minutes and ends with questions to pray with or share.<\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%204_Love/Advent%20Week%204%20Love%20-%20Lectio%20and%20Group%20Practices.pdf\" target=\"_blank\" rel=\"noopener\">Week 4 Spiritual Practices PDF<\/a><\/p>\n<p>This week, we stand with Mary as she asks a profound question and says yes to God.<\/p>\n<h3>Lectio Divina<\/h3>\n<p>Luke 1:35-38<br>2 Samuel 7:5-7, 11<br>Luke 1:46b-49<br>Romans 16:25-27<\/p>\n<h3>Practices<\/h3>\n<p>The Wide View and the Small Room (20 minutes)<br>Keeping Silence with the Mystery (10 minutes)<\/p>\n<p>Each passage and practice starts on a new page, so you can print only the one you need. The handout comes as a ready-to-print PDF.<\/p>\n<p>These prayers are part of the Sacred Seasons web app. Currently the web app can be saved to a phone home screen and will act like an app. The iOS version will be made soon. To become a tester of the iOS or Android app when it is ready, or to sign up to hear about other seasons, visit <a href=\"https://sacredseasons.julenetegerstrand.com/\" target=\"_blank\" rel=\"noopener\">sacredseasons.julenetegerstrand.com<\/a>.<\/p>\n<div class=\"author\"><img src=\"assets/julene.jpg\" alt=\"Dr. Julene Tegerstrand\"><div><p>These Advent practices were created by <strong>Dr. Julene Tegerstrand<\/strong>, co-founder of <strong>Everyday Peacemaking<\/strong>, a ministry that helps people nurture inner resources for peace and practice compassion in a divided world. I also offer <strong>spiritual direction<\/strong> for individuals and groups, providing space to listen for God’s presence and tend to the soul. To learn more, visit <a href=\"https://www.everydaypeacemaking.com\" target=\"_blank\" rel=\"noopener\">www.everydaypeacemaking.com<\/a>, subscribe to my Substack <a href=\"https://humanisaverb.substack.com\" target=\"_blank\" rel=\"noopener\"><em>Human Is a Verb<\/em><\/a> for reflections and practices, or contact me at <a href=\"mailto:julenet@everydaypeacemaking.org\">julenet@everydaypeacemaking.org<\/a>.<\/p><\/div><\/div>\n", "c_w4-reflections": "<p><strong>Embracing Love While We Wait<\/strong><\/p>\n<p>The theme for the fourth week of Advent is love.  Love is an overused word in the English language and can mean very different things in very different contexts. I love my wife, but I also love burritos. Certainly, the word carries different meanings depending on how we use it. We use love to describe our affections, our preferences, our relationships, and sometimes even our passing interests. But what does it mean to embody and embrace love in response to God's love?<\/p>\n<p>Advent invites us to remember that love is not sentimentality but a way of being in the world. The love we anticipate in the coming of Christ is a love that draws near to the brokenhearted, embraces those pushed to the margins, and refuses to accept that the suffering of others is the way things must be. Embracing love calls us beyond feelings and into action.<\/p>\n<p>In Luke 1:26–38, Mary receives the unexpected news that she will bear Jesus, the embodiment of God's love in the world. Though she does not fully understand what lies ahead, Mary responds with courage and openness to God's invitation. Her story reminds us that embracing love sometimes means saying yes to God even when the path forward is uncertain, trusting that God's love will hold us as we participate in God's work of redemption.<\/p>\n<p>In 2 Samuel, 7:1-11, 16, God reminds David that though he wants to build a house for God, that God is actually preparing a place for David and his people.  Christians affirm that promise points beyond David to Jesus, the one through whom God's love takes flesh and dwells among us. God does not wait for us to love God. God loves us first. Every act of love that we embody in the world is ultimately in response to God's love directed toward us.<\/p>\n<p>Paul's closing words in Romans 16:25-27 remind us that the mystery of God's love, revealed through Jesus Christ, is made known to all nations that is all people! God's love is not limited to one people, one community, or one way of life. It is a love that reaches outward, inviting the whole world into the life God desires for us. Author Cole Arthur Riley affirms this in reference to the doctrine of the Trinity in her book <a href=\"https://www.amazon.com/This-Here-Flesh-Spirituality-Liberation/dp/0593239792\" target=\"_blank\" rel=\"noopener\"><em>This Here Flesh: Spirituality, Liberation, and the Stories That Make Us<\/em><\/a>. \"People talk about God as three distinct persons in one. If this is true, it means the whole cosmos is predicated on a diverse and holy community. And if we bear the image of God, that means we bear the image of a multitude. And that to bear the image of God in its fullness, we need each other.\" Riley's words remind us that love is not about making everyone the same but about learning to live together in the fullness of our differences. As we wait for Christ, we embrace love by building communities where our differences are not simply tolerated but celebrated as essential to reflecting the fullness of God's image.<\/p>\n<p>As we wait in Advent, we are called to participate in making that love known, not simply through what we believe, but through how we treat our neighbors, how we respond to violence, and how we create communities where others experience belonging. We wait for the fullness of God's love to be revealed, even as we embody that love in the world today. Even when the world gives us reasons to despair, Advent reminds us that love is still at work, and we are called to bear witness to it. Amen.<\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Mat Thomas at <a href=\"mailto:pastor.mat.thomas@gmail.com\">pastor.mat.thomas@gmail.com<\/a><\/p>\n<p><img src=\"assets/thomas.jpg\" alt=\"Rev. Dr. Mat Thomas\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w4-text1": "<p><a href=\"https://www.biblegateway.com/passage/?search=2%20Samuel%207%3A1-11%2C%2016&version=NRSV\" target=\"_blank\" rel=\"noopener\">2 Samuel 7:1-11, 16<\/a><\/p>\n<p>2 Samuel 7 comes during a significant time in the story of Israel. David has become king over a united Israel, Jerusalem has been established as his capital, and the ark of God has been brought into the city. David now lives in a house of cedar while the ark remains in a tent. His desire to build a temple seems, at first, like an appropriate act of devotion. Yet through Nathan the prophet, God turns David's plan upside down. David wants to build a house for God, but God promises to build a house for David.<\/p>\n<p>Generally scholars understand 2 Samuel as part of the larger Deuteronomistic History. This is the biblical narrative from Deuteronomy through 2 Kings, which took shape through a lengthy process of collecting, editing, and preserving older traditions. Many would suggest that it came together fully during Israel's exile or shortly afterward in the sixth century BC. Its audience was living in the shadow of Jerusalem's destruction and the loss of the Davidic monarchy. In that context, the promise of an enduring house for David in 2 Samuel 7 would have carried powerful theological significance. The passage asks what God's faithfulness means when circumstances seem to suggest that God's promises have failed.<\/p>\n<p>In terms of where this story fits into the larger narrative of 1 and 2 Samuel, this chapter is a major turning point in 2 Samuel. It shifts attention from what David will accomplish for God to what God promises to accomplish through David and his descendants. The passage also establishes the Davidic covenant, which becomes an important theme throughout the Old Testament and eventually shapes early Christian understandings of Jesus as the promised descendant of David.<\/p>\n<p>The passage reminds us that God’s purposes cannot be reduced to our plans, even when our plans appear faithful. In the late 500s AD, Gregory the Great, the bishop of Rome and one of the major theologians of the early medieval church, noticed this same shift from human plans to God’s purposes in his reflection on Nathan. He uses this passage to reflect on the unpredictable work of prophecy. Gregory has his deacon Peter ask questions, creating a dialogue between the two. Gregory writes:<\/p>\n<p>“The Spirit of prophecy does not enlighten the minds of the prophets constantly, Peter. We read in sacred Scripture that the Holy Spirit breathes when he pleases. For example, when King David asked whether he could build a temple, the prophet Nathan gave his consent, but later had to withdraw it” (Dialogue 2.21, FC 39:88–89).<\/p>\n<p>He explains that Nathan initially approved David’s desire to build the temple but later had to withdraw that approval when God gave him a different word. Nathan, the prophet, had to remain open to God’s Spirit redirecting his understanding.<\/p>\n<p>Gregory’s reflection points us toward something at the heart of Advent. God’s purposes exceed our plans, and God’s grace often moves toward us before we recognize what God is doing. This makes 2 Samuel 7 a profound text for the Fourth Sunday of Advent, the Sunday of Love. Advent reminds us that God's love is not simply our love for God. God's love is first God's gracious movement toward us. In the Church of the Nazarene as Wesleyans we often refer to this as prevenient grace. David wants to do something for God, but God responds by promising what God will do for David. The initiative belongs to God. Everything we do is in response to God's grace. We don't initiate prayer. We respond to God's invitation to pray. We don’t initiate our salvation. God reaches toward us with grace before we ever reach toward God. We don’t initiate God’s love. We receive and respond to the love God has already extended to us. We don’t even initiate our search for God. God is already seeking us, drawing us, and making a way toward us. Our faithfulness, then, is not about trying to get God to notice us or earn God’s favor. It is our response to the God who has already moved toward us in holy love.<\/p>\n<p>Eugene Peterson gives language to this same truth in a deeply personal way. In his book <em>Run With the Horses: The Quest for Life at its Best<\/em>, Eugene Peterson argues, \"Long before we got interested in the subject of God, God subjected us to the most intensive and searching knowledge. Before it ever crossed our minds that God might be important, God singled us out as important. Before we were formed in the womb, God knew us. We are known before we know\" (39). David thought he was coming up with a plan for God, but God reminds him that long before David made his plans, God had already been at work in his life. And the same is true for us. We are known before we know, loved before we love, and sought before we ever think to seek God.<\/p>\n<p>And that is where, I believe, Advent leads us. God does not wait for humanity to construct the perfect house, create the perfect congregation, or make ourselves worthy of God's presence. God simply comes to us. The promise of David's house eventually points beyond David to Jesus, the one through whom God's steadfast love takes flesh and dwells among us. In Christ, we affirm that God does not wait for us to make our way to God. God makes God's way to us, first.<\/p>\n<p>Love, then, on this fourth Sunday of Advent is not sentimental affection or attraction. It is the persistent, covenantal love of God who keeps God's promises, even when (and perhaps especially when) God's people cannot yet see how those promises will be fulfilled. Amen.<\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Mat Thomas at <a href=\"mailto:pastor.mat.thomas@gmail.com\">pastor.mat.thomas@gmail.com<\/a><\/p>\n<p><img src=\"assets/thomas.jpg\" alt=\"Rev. Dr. Mat Thomas\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w4-text2": "<p>Psalm 89 is a powerful biblical song that contrasts soaring praise for God's loyal love with a painful lament over a broken royal crisis. (Enduring Word Commentary) As detailed in the <a href=\"https://enduringword.com/bible-commentary/psalm-89/\" target=\"_blank\" rel=\"noopener\">Enduring Word Bible Commentary<\/a>, Psalm 89 teaches believers how to pour out honest pain to God without losing sight of His unchanging character. Christian theology views the ultimate fulfillment of David's eternal throne not in an earthly collapsing dynasty, but in Jesus Christ.<\/p>\n<p>The Advent connections for this Psalm are grounded in the ways that this Psalm celebrates God's love, the Advent theme for week four. In addition, there is the connection of the promised Messiah's connection to the Davidic covenant, another focus of this Psalm.<\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%204_Love/Psalm%2089%20Responsive%20Reading.pdf\" target=\"_blank\" rel=\"noopener\">Responsive Reading of Psalm 89:1-4, 19-26<\/a><\/p>\n<p><strong>Outline of Psalm 89 from <a href=\"https://www.amazon.com/Outline-Bible-Harold-L-Willmington/dp/0842337016\" target=\"_blank\" rel=\"noopener\">The Outline Bible<\/a><\/strong><\/p>\n<p>In the midst of trouble, the psalmist celebrates God's everlasting and unconditional covenant with David and his descendants, including. the special covenant with David (see 2 Samuel 7) in regard to his royal throne.<\/p>\n<p><strong>I. THE PRAISE (89:1-37):<\/strong> The author offers thanks for four things.<\/p>\n<p><strong>A. God's person (89:1-2, 5-8, 14)<\/strong><\/p>\n<ol>\n<li>For his mercy, love, faithfulness, and miracles (89:1-2, 5)<\/li>\n<li>For his uniqueness (89:6-8): No one compares to him.<\/li>\n<li>For his righteousness and justice (89:14): His throne is founded on these.<\/li>\n<\/ol>\n<p><strong>B. God's power (89:9-13)<\/strong><\/p>\n<ol>\n<li>He creates all things (89:11-13): He is strong and powerful.<\/li>\n<li>He rules over the sea (89:9): He subdues the waves and storms.<\/li>\n<li>He crushes his enemies (89:10): He also scatters them.<\/li>\n<\/ol>\n<p><strong>C. God's provisions (89:15-18):<\/strong> He gives to his people strength and joy.<\/p>\n<p><strong>D. God's promise (89:3-4, 19-37):<\/strong> This promise has to do with the Davidic covenant.<\/p>\n<p>1. The person (89:3, 19-20): God himself made this covenant with King David.<br>\n2. The duration (89:4, 28-29, 35-37): The covenant is unconditional and unending.<br>\n3. The method (89:19-20): It is given in a vision from a prophet, probably Nathan, who then communicates it to David.<br>\n4. The features (89:21-27, 30-34)<\/p>\n<p>a. God will personally steady David (89:21): God will make him strong.<br>\nb. David will be victorious over his foes (89:22-23): God will destroy those who hate him.<br>\nc. He will have God's faithfulness and unfailing love (89:24): He will rise to power.<br>\nd. He will rule from the Tigris and Euphrates rivers to the Mediterranean Sea (89:25).<br>\ne. He will enjoy a relationship with God (89:26): God will be his Father, his God, and the Rock of his salvation.<br>\nf. He will become God's firstborn son (89:27): He will become the mightiest king on earth.<\/p>\n<p>g. The covenant will prevail in spite of any sins committed by David's royal descendants (89:30-34): The covenant is everlasting, but sins committed by David's descendants will be punished.<\/p>\n<p><strong>II. THE PROBLEM (89:38-45)<\/strong>: How can God's present rejection of Israel be reconciled to the Davidic covenant:<\/p>\n<p>A. The time (89:38-39): The psalmist seems to be describing the Babylonian Captivity.<br>\nB. The tragedy (89:40-45)<\/p>\n<p><strong>III. THE PLEA  (89:46-52)<\/strong>: The Psalmist calls upon God to remember two things and show himself strong.<\/p>\n<p>A. Our lives are short, empty, and futile (86:46-48): Everyone will die.<br>\nB. God's love is unfailing  (89:49-52)<\/p>\n<h3>Commentary Links<\/h3>\n<p><a href=\"https://www.aplainaccount.org/post/psalm-89-1-4-15-18\" target=\"_blank\" rel=\"noopener\">A Plain Account<\/a><br>\n<a href=\"https://cepreaching.org/commentary/2017-12-18/psalm-891-4-19-26/\" target=\"_blank\" rel=\"noopener\">Center for Excellence in Preaching<\/a><br>\n<a href=\"https://enduringword.com/bible-commentary/psalm-89/\" target=\"_blank\" rel=\"noopener\">Enduring Word Commentary<\/a><br>\n<a href=\"https://youtu.be/bW1DARUw2PA\" target=\"_blank\" rel=\"noopener\">Five Minute Commentary<\/a><br>\n<a href=\"https://www.workingpreacher.org/commentaries/revised-common-lectionary/fourth-sunday-of-advent-2/commentary-on-psalm-891-4-19-26-4\" target=\"_blank\" rel=\"noopener\">Working Preacher<\/a><\/p>\n<h3>Musical Settings<\/h3>\n<p><a href=\"https://open.spotify.com/track/3jDckeKJGXfEtgiXfMdGi6\" target=\"_blank\" rel=\"noopener\">I Will Make Known (Psalm 89:1)<\/a><br>\n<a href=\"https://open.spotify.com/track/2r3CggjwreBQkAdqaHRyYQ\" target=\"_blank\" rel=\"noopener\">Psalm 89 (Poor Bishop Hooper)<\/a><br>\n<a href=\"https://open.spotify.com/track/423HiNTimyyinLGoOdIvvH\" target=\"_blank\" rel=\"noopener\">Psalm 89  (Street Lights)<\/a><br>\n<a href=\"https://open.spotify.com/track/1Jv061PRe5MqLH1ZBJ6nQh\" target=\"_blank\" rel=\"noopener\">Psalm 89:Forever I Will Sing the Goodness of the Lord<\/a><\/p>\n<p>If you are interested in further dialogue about the content on any of the weekly Psalm pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w4-text3": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/tGog9PyZ0dI?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Romans 16:25-27, Dave Young\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/tGog9PyZ0dI\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%204_Love/Rom%2016-25-27.docx\" download>Rom 16-25-27.docx<\/a> <span class=\"muted\">Bible text in this handout: the Common English Bible (CEB).<\/span><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Dave Young at <a href=\"mailto:dave@northst.org\">dave@northst.org<\/a>.<\/p>\n<p><img src=\"assets/young.jpg\" alt=\"Rev. Dr. David Young\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w4-text4": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/YNb41TAzo4k?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Luke 1:26-38, Dave Young\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/YNb41TAzo4k\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%204_Love/Luke%201-26-38.docx\" download>Luke 1-26-38.docx<\/a> <span class=\"muted\">Bible text in this handout: the Common English Bible (CEB).<\/span><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Dave Young at <a href=\"mailto:dave@northst.org\">dave@northst.org<\/a>.<\/p>\n<p><img src=\"assets/young.jpg\" alt=\"Rev. Dr. David Young\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w4-worship": "<p><strong><em>Worship on the Fourth Sunday of Advent<\/em><\/strong><\/p>\n<p>On this final Sunday of Advent, our theme shifts to Love. We celebrate the gift of Love that is Jesus, and God's heart of love that gave it. We celebrate the completion of the Advent portion of our journey as we begin to transition to Christmas Eve, Christmas Day, and the First Sunday of Christmastide as we proclaim the wonder of Christ's coming. We have been waiting in wonder; now we receive with that same posture of wonder and amazement.<\/p>\n<p><strong>Worship Themes to Consider<\/strong><\/p>\n<ul>\n<li>God's incarnational Love<\/li>\n<li>Our love for God<\/li>\n<li>Completion / the end of the wait<\/li>\n<li>Emmanuel, God with us<\/li>\n<li>Living the promise of the hope, peace, joy, and love of Christ's coming<\/li>\n<\/ul>\n<p><strong>Advent Call to Worship<\/strong><\/p>\n<p>Leader: The fourth week of Advent, the week of love, is upon us. Today we celebrate the steadfast love of God, who sent Jesus, a gift of perfect love, into the world to save us.<\/p>\n<p><strong>All: We, the people of God, respond to this divine love with our own love and gratitude.<br>We come to worship, ready to open our hearts to receive the love of Christ.<\/strong><\/p>\n<p>Leader: We will light the four Advent candles today, symbolizing our hope, peace, joy, and now, our deepest love.<br>May God's love fill us.<\/p>\n<p><strong>All: In the spirit of love, we are called to be a beacon of hope, peace, joy, and love to the world.<br>We are ready to celebrate and share God's love.<\/strong><\/p>\n<p>Leader: Let us worship God, who is love<\/p>\n<p>We can also use the Psalms reading as a call to worship, or elsewhere in the worship flow. Each week, we have the Psalm in the form of a responsive reading, which is a great option. It adds additional Scripture in our worship and also gives congregational participation in a way beyond singing.<\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%204_Love/Psalm%2089%20Responsive%20Reading.pdf\" target=\"_blank\" rel=\"noopener\">Responsive Reading - Psalm 89:1-4, 19-26<\/a><\/p>\n<p>You can also explore various worship resources connected to the Psalm on the <a href=\"#w4-text2\">Psalm 89:1-4, 19-26<\/a> page.<\/p>\n<p><strong>Lighting the Advent Wreath (see the dedicated <a href=\"#wreath\">PAGE<\/a> to this Advent tradition)<\/strong><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%204_Love/Week%20Four%20Advent%20Wreath%20Readings.pdf\" target=\"_blank\" rel=\"noopener\">Week Four Advent Wreath Reading<\/a><\/p>\n<p><strong>Hymn Suggestions<\/strong><br><em>(Hymn #s are from the Sing to the Lord Hymnal)<\/em><\/p>\n<ul>\n<li><em>And Can It Be? #225<\/em><\/li>\n<li><em>Love Divine, All Loves Excelling #507<\/em><\/li>\n<li><em>O the Deep, Deep Love of Jesus #450<\/em><\/li>\n<li><em>Of the Father's Love Begotten #163<\/em><\/li>\n<li><em>Once in Royal David's City #170<\/em><\/li>\n<li><em>Such Love #88<\/em><\/li>\n<li><em>The Love of God #86<\/em><\/li>\n<li><em>Thou Didst Leave Thy Throne  #193<\/em><\/li>\n<li>Wonderful Story of Love #82<\/li>\n<\/ul>\n<p><strong>Other Song Suggestions<\/strong><\/p>\n<p><a href=\"https://open.spotify.com/track/5G0R6u54AKt9K3jy5vWCuU\" target=\"_blank\" rel=\"noopener\">How Deep the Father's Love for Us<\/a><br>\n<a href=\"https://open.spotify.com/track/4aecyhFxY2cG4D095V9IeB\" target=\"_blank\" rel=\"noopener\">Love Came Down<\/a><br>\n<a href=\"https://open.spotify.com/track/0DaAtjw3LiaylJoqC7XnSZ\" target=\"_blank\" rel=\"noopener\">Love Came Down (Shane and Shane)<\/a><br>\n<a href=\"https://open.spotify.com/track/0Pthspt4z9ZamMwzW3iOmg\" target=\"_blank\" rel=\"noopener\">Love Came Down at Christmas<\/a><br>\n<a href=\"https://open.spotify.com/track/3cP2kTEluO7hejX89dWwrI\" target=\"_blank\" rel=\"noopener\">Love Came Down to Bethlehem<\/a><br>\n<a href=\"https://open.spotify.com/track/4tegzoer89C07QCSobzrrS\" target=\"_blank\" rel=\"noopener\">Midnight Clear (Love Song)<\/a><br>\n<a href=\"https://open.spotify.com/track/5gJncZUPDP3bmaUyE7f2ZC\" target=\"_blank\" rel=\"noopener\">Miracle of Love<\/a><br>\n<a href=\"https://open.spotify.com/track/6YCCHnSCcJYWenamiJfLWh\" target=\"_blank\" rel=\"noopener\">Noel<\/a><br>\n<a href=\"https://open.spotify.com/track/1kVAxqg5hkUB2nm67Jkscz\" target=\"_blank\" rel=\"noopener\">This Is Love / Come Thou Long Expected Jesus<\/a><\/p>\n<p>If you are interested in further dialogue about the content on any of the weekly worship resources pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n"};

'<p>This week’s handout gives you two ways to pray during Advent: Lectio Divina and short practices. You can pray each one on your own or with a small group, and you don’t need any experience to lead them. The steps are printed on each page.</p>'+
'<p><strong>Lectio Divina</strong> means sacred reading. It is an old way of praying with Scripture. You read a short passage aloud four times, slowly, and pause after each reading. Each time, you listen for something different: a word that catches you, what it touches in your life, what you want to say to God, and then rest. In a group, a different person can read each time.</p>'+
'<p><strong>The practices</strong> are simple ways to pray with your body, your breath, and your attention. Each one takes 5 to 20 minutes and ends with questions to pray with or share.</p>'+
'<p><a href="New%20England%20Advent%202026/Week%201_Hope/Advent%20Week%201%20Hope%20-%20Lectio%20and%20Group%20Practices.pdf" target="_blank" rel="noopener">Practices for the first week of Advent (PDF to print)</a></p>'+
'<p>This week we wait with people who feel that God has hidden from them, and yet we keep listening. Often, when we listen together, we can help each other notice even small ways God is present.</p>'+
'<h3>Lectio Divina</h3><p>Isaiah 64:7-9<br>Psalm 80:17-19<br>1 Corinthians 1:7-9<br>Mark 13:34-37</p>'+
'<h3>Practices</h3><p>Restore Us: A Breath Prayer (5 minutes)<br>Gifts While Waiting (10 minutes)</p>'+
'<p>Each passage and practice starts on a new page, so you can print only the one you need. The handout is a PDF that’s ready to print.</p>'+
'<p>These prayers are part of the Sacred Seasons web app. Currently the web app can be saved to a phone home screen and will act like an app. The iOS version will be made soon. To become a tester of the iOS or Android app when it is ready, or to sign up to hear about other seasons, visit <a href="'+APP+'" target="_blank" rel="noopener">sacredseasons.julenetegerstrand.com</a>.</p>'+
'<div class="author"><img src="assets/julene.jpg" alt="Dr. Julene Tegerstrand"><div><p>These Advent practices were created by <strong>Dr. Julene Tegerstrand</strong>, co-founder of <strong>Everyday Peacemaking</strong>, a ministry that helps people nurture inner resources for peace and practice compassion in a divided world. I also offer <strong>spiritual direction</strong> for individuals and groups, providing space to listen for God’s presence and tend to the soul. To learn more, visit <a href="https://www.everydaypeacemaking.com" target="_blank" rel="noopener">www.everydaypeacemaking.com</a>, subscribe to my Substack <a href="https://humanisaverb.substack.com" target="_blank" rel="noopener"><em>Human Is a Verb</em></a> for reflections and practices, or contact me at <a href="mailto:julenet@everydaypeacemaking.org">julenet@everydaypeacemaking.org</a>.</p></div></div>'

'</ul>'+
'<h3>Music</h3><p>Songs are linked from Spotify and belong to their artists and publishers. Hymn numbers are from the <em>Sing to the Lord</em> hymnal. &ldquo;We Are Waiting&rdquo; is &copy; 2012 Greater Plan Publishing, LLC, words and music by W. Zachary Taylor and Chris Kline; its chord chart is on Worship Current.</p>'+
'<h3>Videos and outside pages</h3><p>Videos are shown from YouTube and belong to their creators. Links to outside articles, lessons, and songs lead to other websites, which own their content.</p>'+
'<h3>Questions or corrections</h3><p>To ask about using something here, or to ask us to fix or remove it, write to Julene Tegerstrand at <a href="mailto:julenet@everydaypeacemaking.org">julenet@everydaypeacemaking.org</a>.</p>';
var PRIVACY='<p>Last updated October 27, 2026.</p>'+
'<h3>What this site is</h3><p>This is a free Advent resource from the New England District Church of the Nazarene. You do not need an account to read it. The only place we ask for personal details is the optional sign-up form described below.</p>'+
'<h3>What we count</h3><p>We use GoatCounter, a small visit counter, to learn which pages and files people use. It keeps only totals. For each day it records how many times a page or file was opened or an outside link was clicked, and it keeps these tallies in separate lists that cannot be matched to each other:</p><ul>'+
'<li>the website a visitor came from, if any</li>'+
'<li>the browser and its version, such as Firefox or Chrome</li>'+
'<li>the type of device system, such as Windows or macOS</li>'+
'<li>the country, worked out from the internet address</li>'+
'<li>the language setting</li>'+
'<li>the width of the screen</li></ul>'+
'<p>Because the lists are separate, nobody can tell which browser, country, or screen belonged to which visitor. GoatCounter does not store internet addresses, full browser details, or any visitor ID. It does not use cookies and saves nothing in your browser. To tell repeat visits apart, it keeps a temporary code in its memory for up to 8 hours and does not save that code. It does not follow you to other websites, and it shares nothing with third parties. We use the totals only to see how the resource is used.</p>'+
'<p>GoatCounter stores this data on servers in Finland and Germany. The service is run by Martin Tournoij in Ireland. Read <a href="https://www.goatcounter.com/help/privacy" target="_blank" rel="noopener">GoatCounter&rsquo;s privacy policy</a>.</p>'+
'<h3>The optional sign-up form</h3><p>The page called Sign Up for Updates has a Google Form. It is optional, and every page works without it. If you fill it in, you tell us your name, email, church, and role. Your answers go to Google Forms and are kept in one private spreadsheet that only the New England District Discipleship Resource Team can see. We use them to email you about this resource and future Advent and Lent resources. We do not sell or share them. To be removed, write to julenet@everydaypeacemaking.org.</p>'+
'<p>Separately, one page of Dr. Julene Tegerstrand&rsquo;s Advent practices links to a sign-up for her Sacred Seasons web app and the iOS and Android versions, which is run by Everyday Peacemaking, LLC.</p>'+
'<h3>What stays on your device</h3><p>Your text size, the page you last read, which sections are open, which pages you have opened (only to know when to offer the sign-up once), and whether you closed the sign-up banner are saved in your own browser so the site feels the same when you return. We never receive that information. You can clear it in your browser settings.</p>'+
'<h3>Other companies</h3><ul>'+
'<li><strong>GitHub</strong> hosts this site, and like any web host it keeps ordinary server records, which can include your internet address.</li>'+
'<li><strong>Google Fonts</strong> supplies the type for the pages, so your browser contacts Google when a page loads.</li>'+
'<li><strong>YouTube and Spotify</strong> videos and playlists play inside some pages. Those companies may collect information when you press play and follow their own privacy policies. Videos use YouTube&rsquo;s privacy-enhanced mode.</li>'+
'<li>Links to outside websites lead to places we do not control.</li></ul>'+
'<h3>Children</h3><p>We do not knowingly collect personal information from anyone, including children.</p>'+
'<h3>Questions</h3><p>To ask about this page or to have something changed, write to Julene Tegerstrand at <a href="mailto:julenet@everydaypeacemaking.org">julenet@everydaypeacemaking.org</a>.</p>';
function privacyPage(){return backbar()+'<article class="page"><h2 id="ptitle" tabindex="-1">Privacy</h2>'+PRIVACY+'</article>'}
function creditsPage(){return backbar()+'<article class="page"><h2 id="ptitle" tabindex="-1">Credits and Permissions</h2>'+CREDITS+'</article>'}

function setRole(id){try{if(id)sessionStorage.setItem("advent26-role",id);else sessionStorage.removeItem("advent26-role")}catch(e){}}

function rolePage(r){
  var h='<div class="backbar"><a class="nb backhome" href="#">&larr; All resources</a></div><article class="page"><h2 id="ptitle" tabindex="-1">For: '+r.label+'</h2><p>'+r.note+'. Here are the pages made for you.</p>',n=0;

    });
    h+='</ul>';
  });
  if(!n)h+='<p class="note">Pages for this group will appear here as they are added.</p>';

var INDEX=null;
function buildIndex(){
  INDEX=[];
  MODS.forEach(function(m){m.items.forEach(function(it){
    if(!it.id)return;
    INDEX.push({id:it.id,title:plain(it.title),mod:m.title,href:it.href,text:plain(it.title+" "+(it.html||""))});
  })});
}
function searchHTML(){
  return '<div class="search"><label for="q">Search this resource</label><input id="q" type="search" placeholder="Try a song, a Bible passage, or a name" autocomplete="off"><div id="results" aria-live="polite"></div></div>';
}
function runSearch(q){
  var out=document.getElementById("results");if(!out)return;
  q=q.trim();
  if(q.length<2){out.innerHTML="";return}
  if(!INDEX)buildIndex();
  var lq=q.toLowerCase(),h="",n=0;
  INDEX.forEach(function(it){
    if(n>=20)return;
    var low=it.text.toLowerCase(),k=low.indexOf(lq);
    if(k<0)return;
    n++;
    var s=Math.max(0,k-40),snip=it.text.slice(s,k+lq.length+60);
    var i2=snip.toLowerCase().indexOf(lq);
    snip=(s>0?"&hellip;":"")+snip.slice(0,i2).replace(/</g,"&lt;")+"<em>"+snip.slice(i2,i2+lq.length).replace(/</g,"&lt;")+"</em>"+snip.slice(i2+lq.length).replace(/</g,"&lt;")+"&hellip;";
    h+='<a class="res" href="'+(it.href?it.href:'#'+it.id)+'"'+(it.href?' target="_blank" rel="noopener"':'')+'><b>'+it.title+'</b><small>'+it.mod+'</small><small>'+snip+'</small></a>';
  });
  out.innerHTML=n?'<p class="note">'+n+(n===1?' page found':' pages found')+'</p>'+h:'<p class="note">Nothing found for &ldquo;'+q.replace(/</g,"&lt;")+'&rdquo;. Try a shorter word.</p>';
}
function lastKey(){return "advent26-last"}
function rememberPage(id){try{localStorage.setItem(lastKey(),id)}catch(e){}}
function resumeHTML(){
  var id=null;try{id=localStorage.getItem(lastKey())}catch(e){}
  if(!id)return "";
  var f=null;MODS.forEach(function(m){m.items.forEach(function(it){if(it.id===id&&!it.href)f=it})});
  return f?'<p class="resume"><a href="#'+f.id+'">Pick up where you left off: '+plain(f.title)+'</a></p>':"";
}
function modPages(m){return m.items.filter(function(x){return x.id&&!x.href})}
function page(i){
  var it=FLAT[i],m=it.mod,list=modPages(m),k=list.indexOf(it),prev=list[k-1],next=list[k+1],nm=null;
  if(!next){for(var j=MODS.indexOf(m)+1;j<MODS.length;j++){var l2=modPages(MODS[j]);if(l2.length){nm=l2[0];break}}}
  var nt=next?next:nm;
  return backbar()+'<p class="crumb">'+m.title+'</p>'+
  '<article class="page'+(m.wk||m.feat?' wk':'')+'"'+style(m)+'><h2 id="ptitle" tabindex="-1">'+it.title+'</h2>'+it.html+
  '<nav class="nav" aria-label="Page navigation">'+
  (prev?'<a class="nb" href="#'+prev.id+'" aria-label="Previous: '+plain(prev.title)+'">&larr; Previous</a>':'<span class="nb" aria-disabled="true">&larr; Previous</span>')+
  '<a class="nb backhome" href="#">All resources</a>'+
  (nt?'<a class="nb go" href="#'+nt.id+'" aria-label="'+(next?'Next: ':'Next module: ')+plain(nt.title)+'">'+(next?'Next':'Next module')+' &rarr;</a>':'<span class="nb go" aria-disabled="true">Next &rarr;</span>')+
  '</nav>'+backbar()+'<div class="copyrow"><button type="button" class="nb" id="copylink">Copy link to this page</button><span id="copystatus" role="status"></span></div></article>';
}
function enhance(root){
  if(!SHOW_DRAFTS){
    root.querySelectorAll(".muted,.draft").forEach(function(e){if(/to be added|ready for your content/.test(e.textContent))e.parentNode&&e.parentNode.removeChild(e)});
    root.querySelectorAll(".page p,.page li").forEach(function(e){if(!e.textContent.trim()&&!e.querySelector("img,iframe"))e.parentNode.removeChild(e)});
  }
  root.querySelectorAll(".page a[href]").forEach(function(a){
    var href=a.getAttribute("href")||"",txt=a.textContent;
    var ext=/^https?:/i.test(href)||a.getAttribute("target")==="_blank";
    if(/^Watch on YouTube/.test(txt)&&!a.getAttribute("aria-label")){
      var e=a.parentNode.previousElementSibling,ttl="";
      while(e&&!ttl){var f=e.querySelector&&e.querySelector("iframe");if(f&&f.title)ttl=f.title;e=e.previousElementSibling}
      if(ttl)a.setAttribute("aria-label","Watch on YouTube: "+ttl+" (opens in a new tab)");
    }
    var low=decodeURIComponent(href.split("?")[0]).toLowerCase(),ft="";
    if(/\.pdf$/.test(low)&&!/pdf/i.test(txt))ft="PDF";
    else if(/\.docx?$/.test(low)&&!/docx?|word/i.test(txt))ft="Word file";
    if(ft){var s=document.createElement("span");s.className="ftype";s.textContent=" ("+ft+")";a.appendChild(s)}
    if(ext&&!a.querySelector(".sr")&&!a.getAttribute("aria-label")){var r=document.createElement("span");r.className="sr";r.textContent=" (opens in a new tab)";a.appendChild(r)}
  });
}
function decoratePractice(app,id,it){
  var art=app.querySelector("article.page");if(!art)return;
  var m=/^w(\d)-practices$/.exec(id);
  if(m&&it&&it.mod){
    var wk=it.mod;
    art.className+=" wk";art.setAttribute("style",style(wk).replace(/^ style="/,"").replace(/"$/,""));
    var h2=art.querySelector("h2");
    var hero=document.createElement("div");hero.className="phero";
    hero.innerHTML='<img src="assets/wreath-week-'+m[1]+'.svg" alt=""><div><p class="pk">Week '+m[1]+' &middot; '+wk.date+'</p><p class="pn">'+wk.name+'</p><p class="ps">Lectio Divina and short practices to pray alone or with a group</p></div>';
    h2.insertAdjacentElement("afterend",hero);
    art.querySelectorAll("p > a[href$='.pdf']").forEach(function(a){var p=a.parentNode;if(p.children.length===1&&p.textContent.trim()===a.textContent.trim())a.classList.add("btn")});
    var first=null,cards=[];
    art.querySelectorAll("h3").forEach(function(h){
      var nx=h.nextElementSibling,d=document.createElement("div");d.className="pcard";
      h.parentNode.insertBefore(d,h);d.appendChild(h);if(nx&&nx.tagName==="P")d.appendChild(nx);cards.push(d)});
    if(cards.length){var g=document.createElement("div");g.className="pgrid";cards[0].parentNode.insertBefore(g,cards[0]);cards.forEach(function(c){g.appendChild(c)})}
    art.querySelectorAll("p").forEach(function(p){if(/part of the Sacred Seasons web app/.test(p.textContent)){var c=document.createElement("div");c.className="appcard";c.innerHTML='<img src="assets/sacred-seasons-logo.png" alt="Sacred Seasons logo">';var d=document.createElement("div");p.parentNode.replaceChild(c,p);d.appendChild(p);c.appendChild(d)}});
  }
  if(id==="app"){
    var p=art.querySelector("p"),b=art.querySelector("a.btn");if(!p)return;
    var c=document.createElement("div");c.className="appcard";c.innerHTML='<img src="assets/sacred-seasons-logo.png" alt="Sacred Seasons logo">';
    var d=document.createElement("div");p.parentNode.replaceChild(c,p);d.appendChild(p);if(b)d.appendChild(b);c.appendChild(d);
  }
}
function route(){
  var id=location.hash.slice(1),app=document.getElementById("app"),i=-1,role=null;
  FLAT.forEach(function(it,k){if(it.id===id)i=k});
  ROLES.forEach(function(r){if(r.id===id)role=r});
  if(role)setRole(role.id);else if(i<0&&id!=="credits"&&id!=="privacy")setRole(null);
  if(id==="credits"){app.innerHTML=creditsPage();setTitle("Credits and permissions")}
  else if(id==="privacy"){app.innerHTML=privacyPage();setTitle("Privacy")}
  else if(role){app.innerHTML=rolePage(role);setTitle("For "+role.label.toLowerCase())}
  else if(i>=0){app.innerHTML=page(i);setTitle(plain(FLAT[i].title));rememberPage(FLAT[i].id);
    if(FLAT[i].id!=="signup"&&countView(FLAT[i].id)>=SIGNUP_AFTER&&!signupDone()&&typeof SIGNUP_URL!=="undefined"&&SIGNUP_URL)app.insertAdjacentHTML("beforeend",signupRemindHTML())}
  else{app.innerHTML=home();setTitle("")}
  document.body.classList.toggle("sub",!!(role||i>=0||id==="credits"||id==="privacy"));
  if(i>=0)decoratePractice(app,FLAT[i].id,FLAT[i]);
  enhance(app);
  window.scrollTo(0,0);
  var t=document.getElementById("ptitle");if(t)t.focus();
}
/* tools */
(function(){
  function size(n){var c=document.documentElement.classList;for(var k=0;k<4;k++)c.remove("fs"+k);c.add("fs"+n);try{localStorage.setItem("advent26-fs",n)}catch(e){}}
  var cur=0;try{cur=+(localStorage.getItem("advent26-fs")||0)}catch(e){}
  size(cur);
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("button,a");if(!b)return;
    if(b.id==="fsp"){cur=Math.min(3,cur+1);size(cur)}
    else if(b.id==="fsm"){cur=Math.max(0,cur-1);size(cur)}
    else if(b.id==="prt"){window.print()}
    else if(b.id==="signupgo"){try{localStorage.setItem("advent26-signupbar","1")}catch(x){}}
    else if(b.id==="signupclose"){try{localStorage.setItem("advent26-signupbar","1")}catch(x){}var bar=b.closest(".signupbar");if(bar)bar.remove();var h1=document.getElementById("app");if(h1)h1.focus()}
    else if(b.id==="skip"){e.preventDefault();var m=document.getElementById("app");m.focus();m.scrollIntoView()}
    else if(b.id==="copylink"){
      var st=document.getElementById("copystatus");
      function ok(){if(st)st.textContent="Link copied"}
      function fail(){if(st)st.textContent="Copy did not work. Copy the address from the top of your browser."}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(location.href).then(ok,fail)}else{fail()}
    }
  });
  document.addEventListener("input",function(e){if(e.target&&e.target.id==="q")runSearch(e.target.value)});
})();

/* GoatCounter visit counts. Put your GoatCounter site name between the quotes, for example "advent2026". Leave it empty to turn counting off. */
var GC_SITE="newenglandadvent2026";
(function(){
  if(!GC_SITE)return;
  var s=document.createElement("script");s.async=true;
  s.src="https://gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter","https://"+GC_SITE+".goatcounter.com/count");
  s.setAttribute("data-goatcounter-settings",'{"no_onload":true}');
  document.head.appendChild(s);
  function count(o){if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count(o)}
  function titleOf(){var h=document.getElementById("ptitle");return h?h.textContent:"Main page"}
  window.addEventListener("load",function(){setTimeout(function(){count({path:"/"+(location.hash.slice(1)||"home"),title:titleOf()})},300)});
  window.addEventListener("hashchange",function(){setTimeout(function(){count({path:"/"+(location.hash.slice(1)||"home"),title:titleOf()})},100)});
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;
    var h=a.getAttribute("href")||"";
    if(/\.(pdf|docx?)$/i.test(h.split("?")[0])){count({path:"download/"+decodeURIComponent(h.split("/").pop()),title:"Download",event:true})}
    else if(/^https?:/i.test(h)&&h.indexOf(location.host)<0){count({path:"link/"+h.replace(/^https?:\/\//,"").slice(0,80),title:"Outside link",event:true})}
  });
})();
