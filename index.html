<style>
:root{--surface:#FBF4EA;--ink:#2E1F2B;--muted:#6B5563;--line:#E2D2BE;--head:#F3E6D3;--card:#fff;--green:#0B874B;--accent:#3B3A78;--teal:#1E7470;--scarlet:#B3321F;--night:#25244F;--on:#FFF8EE;--c:#3B3A78;--t:#FFF8EE}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--surface:#1c1b3a;--ink:#F5EBDD;--muted:#C9BBCB;--line:#3a3968;--head:#25244F;--card:#2a2960;--green:#4cc38a;--accent:#A9A7F0;--teal:#56c2bb;--scarlet:#F59A87;--c:#A9A7F0;--t:#1D1B38;--btnink:#1D1B38}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:18px/1.6 "DM Sans",system-ui,sans-serif}
a{color:var(--teal)}
.hero{display:block;width:100%;max-width:1800px;height:auto;margin:0 auto}
.banner{background:var(--night);color:var(--on);padding:40px 24px;text-align:center}
.banner h1{font:500 clamp(30px,5vw,44px)/1.15 "Fraunces",Georgia,serif;margin:0 0 8px}

main{max-width:820px;margin:0 auto;padding:24px 16px 64px}
.module{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);margin-bottom:22px;--c:var(--accent);--t:var(--ink)}
.mh{margin:0;font:inherit}.mhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--head);color:var(--ink);padding:16px 20px;font:700 20px "DM Sans",system-ui,sans-serif;cursor:pointer}.tri{width:0;height:0;border-left:8px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;transition:transform .15s}.mhead[aria-expanded=true] .tri{transform:rotate(90deg)}.tools{display:flex;gap:10px;justify-content:flex-end;margin-bottom:14px}.tools .nb{min-height:40px;font-size:16px}[hidden]{display:none!important}
.wk .mhead{background:var(--c);color:var(--t)}
.row{display:flex;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line);border-left:5px solid var(--c);color:var(--ink);text-decoration:none;font-weight:700}
.row:hover,.row:focus-visible{background:var(--head)}
.row.sub{padding-left:54px;font-weight:500}
.ico.round{border-radius:50%}.sr{position:absolute;left:-9999px}.author{display:flex;gap:20px;align-items:flex-start;margin:26px 0 8px;padding-top:20px;border-top:1px solid var(--line)}.author img{width:150px;height:auto;border-radius:12px;flex:none}.author p{margin:2px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:16px 0}.gallery figure{margin:0}.gallery img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}.video{position:relative;padding-top:56.25%;margin:16px 0}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px}.page img{max-width:100%}.page blockquote{margin:16px 0;padding:6px 0 6px 18px;border-left:4px solid var(--c)}.page ul,.page ol{padding-left:1.3em}.page li{margin:6px 0}.muted{color:var(--muted)}
.ico{flex:none;width:18px;height:22px;background:var(--c);border:2px solid var(--c);border-radius:3px}
.grp{padding:14px 20px;font-weight:700;color:var(--muted);border-top:1px solid var(--line);border-left:5px solid var(--c)}
.crumb{margin:0 0 8px;font-size:16px}
.signupbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--scarlet);border-radius:8px;padding:14px 18px;margin:0 0 20px}

.page{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:8px;padding:24px 26px;--c:var(--accent)}

.nb[aria-disabled=true]{opacity:.35;pointer-events:none}

.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}

/* module banners */
.mhead{padding:20px 22px;gap:14px}

.backbar{display:flex;flex-wrap:wrap;margin:0 0 14px}

  <h1>Advent 2026</h1>
  <p>Resources for pastors and church members leading a congregation or group through Advent.</p>
  <p style="font-size:16px;margin-top:10px;opacity:.85">A free resource from the Discipleship Committee of the New England District Church of the Nazarene</p>

<main id="app" tabindex="-1"></main>
<script>
var P={"how": "<p>We created this Advent Resource with the hope that it will be <em><strong>helpful to you<\/strong><\/em> in whatever role you serve in your local church! That is to say, you should use the resources you find here in whatever way works best for you! Please don't feel obligated to utilize every single page or proceed in any particular order. We want to serve you in your own spiritual growth and ministry to others, not give you one more thing to do in what already can be a very busy season. <\/p>\n<p>Here are a few ideas for how you might use this resource: <\/p>\n<ul>\n<li><p>If you are a pastor, you may find the commentary on the scripture readings from the lectionary and the weekly theological reflection helpful as you prepare your sermon each week. There is also a space to share your own preaching ideas with others and hear their ideas as well.<\/p><\/li>\n<li><p>If you are a worship leader, you may find the resources for worship and the weekly Psalm useful as you prepare for Sunday morning worship. <\/p><\/li>\n<li><p>If you are a Sunday School teacher, leader of a small group or Bible study, or a youth or children's leader, there are several small group resources available for each week that you might use in combination with some of the scripture commentaries or the spiritual practices. <\/p><\/li>\n<li><p>Perhaps you are just looking for your own personal devotional practice for the season of Advent. If so, the spiritual practices, scripture commentary, theological reflection, and podcast might provide a kind of daily rhythm for you throughout each week. <\/p><\/li>\n<li><p>Your whole church might even engage all of these resources together as a congregation-wide study across all of these ministries!<\/p><\/li>\n<li><p>Remember: use this resource in whatever way is beneficial to you and your community! And don't hesitate to let us know what you did! We love to hear stories about how these resources are being utilized. (Indeed, if you wanted to email me at the address below, I'd be very happy to share your story with the rest of the team.) <\/p><\/li>\n<\/ul>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Dave Young at <a href=\"mailto:dave@northst.org\">dave@northst.org<\/a>. <\/p>\n", "intro": "<p><strong>Introduction to the Season of Advent<\/strong><\/p>\n<p>Advent marks the beginning of the Christian liturgical year and serves as a sacred season of anticipation, preparation, and hope. Spanning the four Sundays before Christmas, Advent invites believers to pause in the midst of a busy world and turn their hearts toward the coming of Christ—past, present, and future.<\/p>\n<p>In a culture that often rushes to celebrate Christmas prematurely, Advent offers a countercultural rhythm: a call to wait, to reflect, and to long deeply for the arrival of our Savior. It is a time to remember the longing of Israel for the Messiah, to recognize our ongoing need for Christ’s presence in our lives today, and to look forward with hope to His promised return.<\/p>\n<p>Giving attention to this sacred season helps cultivate spiritual attentiveness, patience, and humility. It re-centers us on the story of God’s faithfulness and invites us to prepare not only our homes but our hearts for the wonder of the Incarnation. In this way, Advent becomes more than a countdown to Christmas—it becomes a journey of renewal, awakening us again to the profound mystery and joy of Emmanuel: God with us.<\/p>\n\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/YZjvvE33B4k?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Introduction to Advent video\" allowfullscreen><\/iframe><\/div>\n", "psalm": "<p>The Scripture passages for each week during this season include a selection from the Book of Psalms. While possible, it may be less likely that the Psalm text will be used as the preaching text. However, finding ways to engage with the Psalm can be an important spiritual practice for the season and also a resource for personal and corporate worship. Here are some ideas as you come to each week during this journey to the cross.<\/p>\n<p><strong>1. Read the Psalm in personal devotions.<\/strong><br />\nEach weekly module will include links to visual and musical expressions of the Psalm<\/p>\n<p><strong>2. Read the Psalm in corporate worship<\/strong><br />\nEach weekly module will include a responsive reading of the Psalm that can be used as a call to worship or at some other point in the service. <\/p>\n<p><strong>3. Sermon or Bible Study<\/strong><br />\nUse the Psalm as a primary or supplemental passage for a sermon or Bible Study. Each weekly module will include a short overview of the Psalm and how it connects to the season, as well as links to some online exegetical resources. While not exhaustive, these resources can be an initial overview of the Psalm and various ways that the Psalm speaks to us individually and corporately.<\/p>\n\n<p>If you are interested in further dialogue about the content on any of the weekly Psalm pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com.<\/a> <\/p>\n", "smallgroup": "<p>Each week, there is a small group resource that can be used with a Sunday School Class or other small group format. In addition to an overview for the leader, there is a participant handout that you can download and distribute if you would like.<\/p>\n<p>The weekly lesson will focus primarily on the Gospel passage, but all four passages are listed and you might choose to have someone read each passage as part of the beginning of the meeting.<\/p>\n<p>There is a prayer at the top of the Small Group Discussion Guide. You can use it at the beginning (often best after the reading of the main scripture), or you could use it at the end. You can read it or have everyone read it together.<\/p>\n<p>If your group meets after the Sunday sermon, you can certainly include an opening time for discussion of the sermon.<\/p>\n<p>Remember that the Discussion Guide is a guide that you can feel free to adapt. You do not have to choose all of the suggested discussion questions, for example.<\/p>\n<p>Another idea is to incorporate the weekly spiritual practices as a group. While they will not always be directly mentioned in the small group materials, they could always be a part of the discussion and group project through this season.<\/p>\n\n<p>If you are interested in further dialogue about the content on any of the weekly small group pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com.<\/a> <\/p>\n", "welcome": "<div class=\"draft\">This page is ready for the welcome message.<\/div>", "authors": "<p><em><strong>This resource has been developed by the following team of Nazarene elders on the New England District:<br />\n<\/strong><\/em><\/p>\n<div class=\"author\"><img src=\"assets/nielson.jpg\" alt=\"\"><div><p><strong>Rev. Dr. John Nielson<br />\n<\/strong><\/p>\n<p><a href=\"mailto:john.nielson@mcnaz.com\"><strong>john.nielson@mcnaz.com<\/strong><\/a><\/p><\/div><\/div>\n<p>Rev. Dr. John W. Nielson currently serves as the Lead Pastor of Manchester Church of the Nazarene in Manchester, CT.<\/p>\n<p>Before coming to Manchester in 2025, Dr. Nielson served at Eastern Nazarene College in the Religion and Culture Program as Associate Professor of Practical Theology and Music Director for ENC Music from August 2018 until December 2024.<\/p>\n<p>Prior to joining the faculty of Eastern Nazarene College, Dr. Nielson served as the Lead Pastor of the Melwood Church of the Nazarene in Upper Marlboro, Maryland (on the Mid-Atlantic District) for 24 years. Prior to this assignment, he served for five years as the Worship Pastor at St. Paul’s Church of the Nazarene in Kansas City, MO.<\/p>\n<p>Dr. Nielson attended Eastern Nazarene College, where he received a BA in religion in 1989. He received the Master of Divinity degree from Nazarene Theological Seminary in 1993 and was ordained as an Elder that same year. He then received the Doctor of Ministry degree from Nazarene Theological Seminary in 2013, where his dissertation was entitled, <em>Developing Practices of Corporate Lament for the Local Parish<\/em>.<\/p>\n<p>He and his wife Amy, have three daughters, Bethany, Kathryn (and a son-in-law, David) and Jenna. In 2024, they welcomed their first grandson, Kayden Quinn Drennan.<\/p>\n\n<div class=\"author\"><img src=\"assets/julene.jpg\" alt=\"\"><div><p><strong>Rev. Dr. Julene Tegerstrand<\/strong><\/p>\n<p> julene@everydaypeacemaking.org<br />\n everydaypeacemaking.org<br />\n <a href=\"https://humanisaverb.substack.com/\">humanisaverb.substack.com<\/a><\/p><\/div><\/div>\n<p>Rev. Dr. Julene Tegerstrand is a writer, educator, and spiritual director whose work explores how the slow work of spiritual formation prepares us to meet conflict with grace. For her, Advent is not only a season of waiting but of becoming, of learning to hold tension, listen deeply, and respond from the grounded peace of Christ.<\/p>\n<p>Julene recently co-founded <em>Everyday Peacemaking<\/em> with her husband, Steve Tumolo, to help Christian leaders cultivate the inner resources needed for the hard and holy work of transforming conflict. She believes discipleship and conflict are intertwined practices of holiness where formation meets the courage to love in difficult places.<\/p>\n<p>A former professor of Intercultural Studies at Eastern Nazarene College, Julene now teaches classes on the inner life, spiritual direction, pilgrimage, and conflict transformation at Northwest Nazarene University and Nazarene Theological Seminary. Her Substack, <em>Human Is a Verb<\/em>, invites readers to explore what it means to become deeply human in turbulent times through reflection, theology, and storytelling.<\/p>\n<p>Julene offers one-on-one and group spiritual direction and welcomes new clients. She and Steve are also available to collaborate with churches and organizations seeking to grow in the ministry of reconciliation and everyday peacemaking.<\/p>\n\n<div class=\"author\"><img src=\"assets/thomas.jpg\" alt=\"\"><div><p><strong>Rev. Dr. Mat Thomas<\/strong><\/p>\n<p><a href=\"mailto:pastor.mat.thomas@gmail.com\"><strong>pastor.mat.thomas@gmail.com<\/strong><\/a><\/p><\/div><\/div>\n<p>Reverend Mat Thomas served at Bethel Church of the Nazarene in Quincy, Massachusetts, from 2003–2026, first as youth and associate pastor and, from 2015–2026, as lead pastor. He holds a B.A. in Religion from Eastern Nazarene College (2005), an M.A. in Pastoral Ministry from Northwest Nazarene University (2010), and a Doctor of Ministry from Nazarene Theological Seminary in the Black Leadership and Ministry track.<\/p>\n<p>Prior to Eastern Nazarene College’s closing, Mat taught philosophy, ethics, church history, and theology in its Religion and Culture program for more than a decade. He has also taught as an adjunct instructor at Regis College and Northwest Nazarene University. He currently serves as Associate Professor of Christian Ministry at Point Loma Nazarene University in San Diego, California.<\/p>\n<p>Mat’s teaching and ministry interests include Christian formation, practical theology, racial justice, and belonging, Wesleyan-Holiness theology, and the intersection of faith and culture. He is particularly interested in how churches can become communities where people experience genuine belonging, encounter God, and participate in the work of justice and peace.<\/p>\n<p>Mat and his wife I’Esha have three children, Martin, Russy, and Braydon. <\/p>\n<div class=\"author\"><img src=\"assets/young.jpg\" alt=\"\"><div><p><strong>Rev. Dr. David Young<\/strong><\/p>\n<p><a href=\"mailto:dave@northst.org\"><strong>dave@northst.org<\/strong><\/a><\/p><\/div><\/div>\n<p>David Young is co-pastor with Jacob Hafler at North Street Community Church of the Nazarene in Hingham, MA. He also serves on the New England District NDI Council and Board of Ministry and teaches for Northwest Nazarene University's online Christian Ministry program and Wesley Theological Seminary. Previous ministry roles include Dean of the Chapel and Associate Professor of Biblical Literature at Eastern Nazarene College as well as Pastor of Clinton First Church of the Nazarene in Clinton, IL. Dave is a graduate of Boston University School of Theology (Ph.D., New Testament and Early Christianity), Nazarene Theological Seminary (M.Div.) and Eastern Nazarene College (B.A., Theology and Philosophy). He met his wife, Jessica, while they were both students at ENC. They have three remarkable children; Hannah, Malachi, and Esther. Dave loves basketball, biking, pizza, tacos, and New England summers (New England winters are another matter), and studying scripture. <\/p>\n", "graphics": "<p>Graphics for the Prepare the Way Advent series.<\/p><div class=\"gallery\"><figure><img src=\"assets/prepare-cover.jpg\" alt=\"Prepare the Way cover\"><figcaption><a href=\"New%20England%20Advent%202026/Module%202_General%20resources/M2.1.Advent%20Series%20Graphics/Prepare%20Way%20Images/preparethewaycover.jpg\" download>Download the full size image<\/a><\/figcaption><\/figure><figure><img src=\"assets/prepare-bg.jpg\" alt=\"Prepare the Way background\"><figcaption><a href=\"New%20England%20Advent%202026/Module%202_General%20resources/M2.1.Advent%20Series%20Graphics/Prepare%20Way%20Images/preparethewaybg.jpg\" download>Download the full size image<\/a><\/figcaption><\/figure><\/div>", "sermon": "<p><strong>Advent Sermon Series: Prepare the Way<br />\n<br />\nClick <a href=\"New%20England%20Advent%202026/Module%202_General%20resources/M2.2.Advent%20Sermon%20Series/Prepare%20the%20Way%20Sermon%20Series%20Overview.pdf\">HERE<\/a> to download a PDF of the Sermon Series Overview<\/strong><\/p>\n<p><em><strong>Making Room for the Coming of Christ<\/strong><\/em><\/p>\n<p><strong>Series Theme:<\/strong><br />\nAdvent is a season of preparation. We prepare our homes, our calendars, and our celebrations—but Scripture calls us to prepare something deeper: <strong>our hearts and our lives for the coming of Christ.<\/strong> Through the prophets, we discover that God meets us in our longing, comforts us in our weariness, restores what is broken, shines light into our darkness, and gives us joy in his presence.<\/p>\n<p><strong>NOTE:<\/strong> I have chosen to switch the Old Testament reading from the Lectionary for Week 4, to keep the whole series in Isaiah.<\/p>\n\n<p><strong>Week 1 — Prepare the Way for God to Come<\/strong><\/p>\n<p><strong>Isaiah 64:1–9<\/strong><\/p>\n<p><strong>Theme:<\/strong> Longing for God<\/p>\n<p><strong>Main Idea:<\/strong> Sometimes preparing the way begins simply by admitting how desperately we need God.<\/p>\n<p>Isaiah's prayer is raw and honest: <em>“O that you would tear open the heavens and come down!”<\/em> The people are longing for God to intervene in a world that feels broken and distant from him.<\/p>\n<p><strong>Possible sermon points:<\/strong><\/p>\n<ul>\n<li><p>We prepare the way by acknowledging our need.<\/p><\/li>\n<li><p>We can bring our honest questions and disappointments to God.<\/p><\/li>\n<li><p>Even when we feel far from God, we belong to the God who is shaping us.<\/p><\/li>\n<\/ul>\n<p><strong>Advent emphasis:<\/strong> <strong>Hope<\/strong><\/p>\n<p><strong>Key phrase:<\/strong><\/p>\n<p><em>“Prepare the way by making room for our longing for God.”<\/em><\/p>\n\n<p><strong>Week 2 — Prepare the Way with Comfort<\/strong><\/p>\n<p><strong>Isaiah 40:1–11<\/strong><\/p>\n<p><strong>Theme:<\/strong> God comes to weary people<\/p>\n<p><strong>Main Idea:<\/strong> God prepares the way by bringing comfort to people who are weary, discouraged, and waiting.<\/p>\n<p>Isaiah's message changes dramatically: <em>“Comfort, O comfort my people.”<\/em> The voice announces that God is coming—and his coming changes everything.<\/p>\n<p><strong>Possible sermon points:<\/strong><\/p>\n<ul>\n<li><p>God speaks comfort into our weariness.<\/p><\/li>\n<li><p>God makes a way where there seems to be no way.<\/p><\/li>\n<li><p>The coming King is both powerful and tender.<\/p><\/li>\n<\/ul>\n<p>The beautiful image of verse 11 could become the heart of the sermon:<br />\n<strong>“He will feed his flock like a shepherd; he will gather the lambs in his arms.”<\/strong><\/p>\n<p><strong>Advent emphasis:<\/strong> <strong>Peace<\/strong><\/p>\n<p><strong>Key phrase:<\/strong><\/p>\n<p><em>“Prepare the way by allowing God's comfort to meet you in your weariness.”<\/em><\/p>\n\n<p><strong>Week 3 — Prepare the Way for Restoration<\/strong><\/p>\n<p><strong>Isaiah 61:1–4, 8–11<\/strong><\/p>\n<p><strong>Theme:<\/strong> Good news for the broken<\/p>\n<p><strong>Main Idea:<\/strong> The coming of God's Anointed One brings good news, healing, freedom, and restoration.<\/p>\n<p>This passage gives us a picture of God's mission: good news to the poor, healing for the brokenhearted, freedom for captives, and rebuilding what has been devastated.<\/p>\n<p>Jesus later identifies himself with this mission in Luke 4.<\/p>\n<p><strong>Possible sermon points:<\/strong><\/p>\n<ul>\n<li><p>Christ comes to bring good news.<\/p><\/li>\n<li><p>Christ meets us in places of brokenness.<\/p><\/li>\n<li><p>God doesn't simply repair what is broken—he makes it beautiful again.<\/p><\/li>\n<li><\/li>\n<\/ul>\n<p>Verse 3 gives you a powerful image for Advent:<\/p>\n<p><strong>“The oil of gladness instead of mourning.”<\/strong><\/p>\n<p><strong>Advent emphasis:<\/strong> <strong>Restoration / Joy<\/strong><\/p>\n<p><strong>Key phrase:<\/strong><\/p>\n<p><em>“Prepare the way by believing that God can bring beauty out of brokenness.”<\/em><\/p>\n\n<p><strong>Week 4 — Prepare the Way for the Light<\/strong><\/p>\n<p><strong>Isaiah 9:1–7<\/strong><\/p>\n<p><strong>Theme:<\/strong> Light in the darkness<\/p>\n<p><strong>Main Idea:<\/strong> When darkness seems overwhelming, God promises the coming of a light that cannot be extinguished.<\/p>\n<p>This is one of Advent's most recognizable prophetic passages:<br />\n<strong>“The people who walked in darkness have seen a great light.”<\/strong><\/p>\n<p>The promised child comes as <strong>Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.<\/strong><\/p>\n<p><strong>Possible sermon points:<\/strong><\/p>\n<ul>\n<li><p>God sees us in the darkness.<\/p><\/li>\n<li><p>God's light doesn't wait for the darkness to disappear.<\/p><\/li>\n<li><p>The child who comes brings a different kind of kingdom.<\/p><\/li>\n<li><p>Christ's peace is stronger than the chaos around us.<\/p><\/li>\n<\/ul>\n<p><strong>Advent emphasis:<\/strong> <strong>Love / Light<\/strong><\/p>\n<p><strong>Key phrase:<\/strong><\/p>\n<p><em>“Prepare the way by looking for the light of Christ, even in the darkness.”<\/em><\/p>\n\n<p><strong>Christmas Sunday — Prepare the Way with Joy<\/strong><\/p>\n<p><strong>Isaiah 61:10–62:3<\/strong><\/p>\n<p><strong>Theme:<\/strong> Rejoicing in what God is doing<\/p>\n<p><strong>Main Idea:<\/strong> Those who have experienced God's salvation cannot help but rejoice—and God's people become a visible testimony to his faithfulness.<\/p>\n<p>The passage moves from mourning to celebration:<\/p>\n<p><strong>“I will greatly rejoice in the LORD; my whole being shall exult in my God.”<\/strong><\/p>\n<p>The imagery of clothing, a bride and bridegroom, a flourishing garden, and a shining crown makes this a beautiful conclusion to the series.<\/p>\n<p><strong>Possible sermon points:<\/strong><\/p>\n<ul>\n<li><p>God's salvation gives us a reason to rejoice.<\/p><\/li>\n<li><p>God is still at work, even when we cannot yet see the finished picture.<\/p><\/li>\n<li><p>God's people are meant to shine as witnesses to his faithfulness.<\/p><\/li>\n<li><p>The coming of Christ changes our identity.<\/p><\/li>\n<\/ul>\n\n<p><strong>Key phrase:<\/strong><\/p>\n<p><em>“Prepare the way by making room for the joy of God's salvation.”<\/em><\/p>\n\n\n\n\n\n\n<p><strong>Series Arc<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 7%\" />\n<col style=\"width: 24%\" />\n<col style=\"width: 45%\" />\n<col style=\"width: 21%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Week<\/strong><\/th>\n<th><strong>Passage<\/strong><\/th>\n<th><strong>Sermon Title<\/strong><\/th>\n<th><strong>Theme<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Isaiah 64:1–9<\/td>\n<td><strong>Prepare the Way for God to Come<\/strong><\/td>\n<td>Hope<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Isaiah 40:1–11<\/td>\n<td><strong>Prepare the Way with Comfort<\/strong><\/td>\n<td>Peace<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Isaiah 61:1–4, 8–11<\/td>\n<td><strong>Prepare the Way for Restoration<\/strong><\/td>\n<td>Restoration / Joy<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Isaiah 9:1–7<\/td>\n<td><strong>Prepare the Way for the Light<\/strong><\/td>\n<td>Light / Love<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td> <\/td>\n<td>Isaiah 61:10–62:3<\/td>\n<td><strong>Prepare the Way with Joy<\/strong><\/td>\n<td>Returning to Joy<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n\n<p><strong>A simple series progression:<\/strong><\/p>\n<p><strong>Longing → Comfort → Restoration → Light → Joy<\/strong><\/p>\n<p>And the overarching message could be:<\/p>\n<p><strong>Advent is more than preparing for Christmas. It is preparing our hearts for the Christ who comes to meet us in our longing, comfort us in our weariness, restore what is broken, shine light into our darkness, and fill us with joy.<\/strong><\/p>\n<p><strong>Series tagline<\/strong><\/p>\n<p><strong>PREPARE THE WAY<\/strong><br />\n<em>Make room for the One who is coming.<\/em><\/p>\n", "calendar": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/EjWE9GRhfmI?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Introduction to the Christian Calendar video\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/EjWE9GRhfmI\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>", "colors": "<p>Historically, the Christian Church has marked time differently. The Christian Calendar spends one-half of the year (Advent-Pentecost) telling the story of Jesus. This cycle includes colors that are commonly tied to that particular season and/or Sunday.<\/p>\n<p>Traditionally, the main color used for the season of Advent is purple. Another option, however, and one which helps distinguish it from the season of Lent, is to use blue. For the Advent Wreath, the colors are either purple, with pink/rose for the third Sunday, or all blue. The center candle, the Christ Candle, is white.<\/p>\n\n<p>If you are interested in further dialogue about the content, you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com.<\/a> <\/p>\n\n", "wreath": "<p><span class=\"muted\">John's video on the Advent Wreath (to be added)<\/span><\/p>\n\n<p><a href=\"New%20England%20Advent%202026/Module%202_General%20resources/Prepare%20the%20Way%20Advent%20Wreath%20Readings.pdf\" target=\"_blank\" rel=\"noopener\">Download Prepare the Way Advent Wreath Readings (PDF)<\/a><\/p>\n<p>Each week, there is also a copy of that week's Advent Wreath reading on the Worship Resources page.<\/p>\n<p><a href=\"https://www.amazon.com/MOZEAL-Hand-Poured-Unscented-Candles-Long-Lasting/dp/B0CHQVDN6Q/ref=sr_1_8?crid=1439C8A262CS7&amp;dib=eyJ2IjoiMSJ9.ylozb90iLUbjPklWkEz86z4j8w_RbWAyI9rAZv2C-pWYgaBbLNSouxq3UmwzxsUL97K7ZUmed3iiNe4wyvcPQFAF_0658CkGvcjyTOqZSkpJBRfh-daL8nfHvdkUpntlBmLQhjECUpSmf_luiNwcTDWmdjxmqAU6LvgG-YSvB6usNWiJ06_81_LFeI5Mm_GW784I_dchR-7dTWLpUEVj-9o0-5I-4MIRK2H5iIrnzFiT_o8rmjLJfuAZuWwACjkFVlPT0w0IoXMqvxu4kwrnO4iDQJpndoUCEbBQ0385B7Y.D9ZnfoAswWAjkhRFLostzZ62fhuOl9wS114M79U4Ir4&amp;dib_tag=se&amp;keywords=pillar%2Badvent%2Bcandles&amp;qid=1759144165&amp;sprefix=pillar%2Badvent%2Bcandles%2Caps%2C143&amp;sr=8-8&amp;th=1\">One Amazon option for pillar advent candles<\/a>. <\/p>\n\n<p><a href=\"https://www.focusonthefamily.com/parenting/celebrating-advent-as-a-family-parents-guide-to-meaningful-christmas-traditions/\" target=\"_blank\" rel=\"noopener\">Family Guide to the Advent Wreath (Focus on the Family)<\/a><\/p>\n", "music": "<p>A list of Advent songs for worship and personal use.<\/p><a class=\"btn\" href=\"https://www.thegospelcoalition.org/article/advent-playlist-2023/\" target=\"_blank\" rel=\"noopener\">Open the Advent Songs List (The Gospel Coalition)<\/a>", "children": "<p>The scope and sequence for the children's lessons in the Prepare the Way series.<\/p><a class=\"btn\" href=\"New%20England%20Advent%202026/Module%202_General%20resources/M2.7.Prepare%20the%20Way%20Children%27s%20Scope%20and%20Sequence.pdf\">Open the Children's Scope and Sequence (PDF)<\/a>", "c_ce-biblical": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/U1GVSBMCbkw?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Christmas Eve Year A, Dave Young\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/U1GVSBMCbkw\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Dave Young at <a href=\"mailto:dave@northst.org\">dave@northst.org<\/a>.<\/p>\n<p><img src=\"assets/young.jpg\" alt=\"Rev. Dr. David Young\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_ce-intro": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/AB9fv8dDsbA?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Christmas Eve Intro, John Nielson\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/AB9fv8dDsbA\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n", "c_ce-playlist": "<iframe data-testid=\"embed-iframe\" style=\"border-radius:12px\" src=\"https://open.spotify.com/embed/playlist/16dHypTZyUF8UeBx6JwvWl?utm_source=generator\" width=\"100%\" height=\"352\" frameBorder=\"0\" title=\"Christmas Eve Spotify playlist\" allowfullscreen=\"\" allow=\"autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture\" loading=\"lazy\"><\/iframe>\n<p><a href=\"https://open.spotify.com/playlist/16dHypTZyUF8UeBx6JwvWl\" target=\"_blank\" rel=\"noopener\">Open the playlist in Spotify<\/a><\/p>\n", "c_ce-reflections": "<p><strong><u>Theological Reflections for Preaching and Teaching on Christmas Eve-The Incarnation.<\/u><\/strong><\/p>\n<p>Christmas Eve (and the entire season of Christmas) is an ideal time to reflect on the incarnation of God, in Jesus the Christ. This holy night gathers us around the mystery that the eternal Word became flesh and dwelt among us. The birth of Jesus is not simply the beginning of a story, but the embodiment of God’s redemptive plan entering human history in the most intimate way possible.<\/p>\n<p>In the incarnation, God entered a human body as Jesus the Christ. African Church Father Saint Athanasius of Alexandria maintained that Jesus was fully God and fully human during the Arian controversy which led to the council of Nicea. Athanasius articulated that Jesus was God in the flesh. Athanasius believed that prior to Jesus, humanity required redemption, and only God can bring that redemption. Therefore, Jesus must be fully God. To break the power of sin on humanity, Jesus also must be fully human.  Therefore, Athanasius reasoned that Jesus was fully God and fully human. This union of divinity and humanity is the heart of the Christmas message: heaven and earth meet in the manger.<\/p>\n<p>Athanasius’s teachings have been affirmed as orthodox within Christianity. Athanasius stated: <em>What then was God to do? Or what should be done, except to renew again the “in the image,” so that through its human beings would be able once again to know him? But how could this have occurred except by the coming of the very image of God, our Savior Jesus Christ? For neither by human beings was it possible, since they were created “in the image”; but neither by angels, for they were not even images. So the Word of God came himself, in order that he being the image of the Father, the human being “in the image” might be recreated. It could not, again, have been done any other way, without death and corruption being utterly destroyed. So he rightly took a mortal body, that in it death might henceforth be destroyed utterly and human beings be renewed again according to the image.<\/em><\/p>\n<p>Humans were and are created in the image of God. Sin corrupted God’s image in humanity. According to Athanasius, God assumed a human body as Jesus the Christ to destroy death and renew humanity according to God’s image. Another translation of this ancient text says, “<em>The Word of God came in his own Person.<\/em>”  God, in Christ, entered a body for us and our salvation. On Christmas Eve, we remember that this salvation began not in a palace but in a humble stable, among ordinary people and fragile circumstances. The incarnation reveals that God’s redemptive work meets us in the ordinary, in the flesh, and in the vulnerability of human life.<\/p>\n<p>If Jesus became fully human and did not just appear human as many Docetists, Apollinarians, and Gnostics have erroneously argued, then the incarnation of God in Christ reveals the importance of the redemption of bodies. Athanasius continued, <em>“For he was incarnate that we might be made God; and he manifested himself through a body that we might receive an idea of the invisible Father; and he endured the insults of human beings, that we might inherit incorruptibility.”<\/em> In other words, the incarnation affirms that salvation is not an escape from the body but the renewal and resurrection of it.<\/p>\n<p>Athanasius is not literally saying that humans become gods. Instead, he is suggesting that in the incarnation the Infinite One (God) becomes finite (human) so that finite beings might become infinite. One Catholic author, Karlo Broussard also supports this when he says, <em>“the phrase, ‘that we might become God’ is better translated as ‘that we might be deified.’ The Greek word for ‘deified,’ theopoiethomen, has the connotation of participation in rather than becoming God.”<\/em>  According to Athanasius, God entered a body to empower humanity to participate more fully in God, thus redeeming the whole human, both bodies and souls.<\/p>\n<p>Therefore, Christmas Eve emphasizes the salvation of souls and the liberation of bodies for they are eternally interconnected because of the incarnation of Jesus. On this holy night, we celebrate that God has drawn near, not as an abstract idea but as a living presence. The light that shines in the darkness is not merely a metaphor but the real illumination of divine love entering our world. The cry of the newborn Christ is the cry of divine solidarity with human suffering.<\/p>\n<p>Christmas is the annual proclamation that God is with us, Emmanuel. The manger scene becomes the theological centerpiece of God’s redemptive love: the infinite made intimate, the divine made visible, the holy made human. Athanasius’ theology helps us see that Christmas is not only a celebration of Jesus’ birth but of God’s action of making us more like God. Each candle lit and each carol sung proclaims that through Christ, our humanity is renewed and our bodies made sacred once more. The incarnation transforms Christmas from a sentimental story into a divine revolution. For the Creator entering creation makes all things new. In Jesus, heaven touches earth, and we are invited to share in the very life of God. Amen.<\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Mat Thomas at <a href=\"mailto:pastor.mat.thomas@gmail.com\">pastor.mat.thomas@gmail.com<\/a><\/p>\n<p><img src=\"assets/thomas.jpg\" alt=\"Rev. Dr. Mat Thomas\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_ce-worship": "<p><strong>Christmas Eve Calls to Worship<\/strong><\/p>\n<p>L: The people who once lived in darkness have been given a great light!<\/p>\n<p><strong>P: Praise be to God who has heard our cries.<\/strong><\/p>\n<p>L: Our souls sing out God’s praise!<\/p>\n<p><strong>P: God has brought us a light of Hope and Peace.<\/strong><\/p>\n<p>L: Tonight, in this place, the Light of God’s Love is given to us!<\/p>\n<p><strong>P: And we shall see that light and let it shine through our lives. AMEN.<\/strong><\/p>\n<p><em>Call to Worship for Christmas Eve<\/em><\/p>\n<p>when all has gone quiet<br>and the world begins to sleep<br>cooried in and snug<br>beneath a blanket of frost<br>&hellip;<\/p>\n<p>~ written by Roddy Hamilton, and posted on the <a href=\"https://re-worship.blogspot.com/2017/12/christmas-eve-call-to-worship.html\" target=\"_blank\" rel=\"noopener\"><strong>re:Worship<\/strong><\/a> website. <a href=\"https://re-worship.blogspot.com/2017/12/christmas-eve-call-to-worship.html\" target=\"_blank\" rel=\"noopener\">Read the full poem<\/a>.<\/p>\n<p><a href=\"New%20England%20Advent%202026/Christmas%20Eve/Christmas%20Eve%20Wreath%20Reading.pdf\" target=\"_blank\" rel=\"noopener\">Advent Wreath Reading<\/a><\/p>\n<p><strong>Hymn Suggestions<\/strong><br><em>(Hymn #s are from the Sing to the Lord Hymnal)<\/em><\/p>\n<ul>\n<li><em>And Can It<\/em><\/li>\n<\/ul>\n<p><strong>Other Song Suggestions<\/strong><\/p>\n<ul>\n<li><a href=\"https://open.spotify.com/track/5G0R6u54AKt9K3jy5vWCuU\" target=\"_blank\" rel=\"noopener\">How Deep the Father's Love for Us<\/a><\/li>\n<\/ul>\n<p><strong>Prayers &amp; Poems for Christmas Eve<\/strong><\/p>\n<p>Tomorrow is Christmas. Christmas is a Monday.<br>\n<span style=\"margin-left:2em\">Then a whole week of Christmas-tide<\/span><br>\n<span style=\"margin-left:2em\">waiting like Prophet Anna<\/span><br>\n<span style=\"margin-left:2em\">to speak about the Child<\/span><br>&hellip;<\/p>\n<p>—Catherine Faith MacLean, from <em>Advent Pocket Prayers<\/em>, The United Church of Canada. <a href=\"https://united-church.ca/sites/default/files/2023-12/au_prayer-zine.pdf\" target=\"_blank\" rel=\"noopener\">Read the full poem<\/a>.<\/p>\n<p><strong>Hush<\/strong><br>\nSssh.<br>\nCan you hear it?<br>\nAn expectant silence,<br>\na hushed anticipation,<br>\nas if the very galaxy<br>&hellip;<br>\n— written by Lucinda Hynett, in <strong><em>Alive Now<\/em><\/strong>. Posted on the <a href=\"https://liturgylink.wordpress.com/\" target=\"_blank\" rel=\"noopener\">Liturgylink<\/a> website. <a href=\"https://re-worship.blogspot.com/2011/12/christmas-eve-poem-hush.html\" target=\"_blank\" rel=\"noopener\">Read the full poem<\/a>.<\/p>\n", "c_cm-kids": "<p>Free Kindle Book: <a href=\"https://www.amazon.com/dp/B0CPZN2NRM\" target=\"_blank\" rel=\"noopener\">12 Days of Promise: Family Christmas Devotional<\/a><\/p>\n<p><a href=\"https://ministry-to-children.com/christmas-worksheets/\" target=\"_blank\" rel=\"noopener\">Free Christmas Worksheets for Kids<\/a><\/p>\n", "c_cs-children": "<h3>Key Concepts &amp; Themes<\/h3>\n<ul>\n<li><strong>The Nativity Story:<\/strong><br>Focus on the events of Jesus' birth, with lessons on baby Jesus in the manger, the shepherds, and the wise men. Crafts can include making manger scenes or nativity ornaments.<\/li>\n<li><strong>Peace on Earth:<\/strong><br>Use the theme of the Prince of Peace to teach children about finding peace through Jesus, especially during the holiday season.<\/li>\n<li><strong>Light of the World:<\/strong><br>Explore how Jesus' arrival brought light to the world, using themes to help children feel brave and hopeful.<\/li>\n<li><strong>Christmas Around the World:<\/strong><br>Use this theme to teach about how Christmas is celebrated in different cultures.<\/li>\n<li><strong>The Shepherds and Angels:<\/strong><br>Focus on the story of the angels announcing Jesus' birth to the shepherds.<\/li>\n<\/ul>\n<h3>MUSIC AND WORSHIP<\/h3>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/p86WrE_6KmY?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Very Merry Christmas, SING ALONG Lyric Video, Make Some Noise Kids\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/p86WrE_6KmY\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/qqCSJo-uMCk?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"The Best Christmas Gift, OFFICIAL MUSIC VIDEO, LifeKids\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/qqCSJo-uMCk\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<h3>CHILDREN'S SERMONS and LESSONS<\/h3>\n<p>This lesson focuses on the escape to Egypt  in Matthew 2:13-23 to teach children that God protects and guides them, even when life is scary or uncertain. Key takeaways include trusting God, listening for His guidance, and understanding that He has a plan and will always be with them. Activities can include creating a \"Hope Box\" to write down prayers and goals, or making a \"Light of the World Lantern\" to remind them of God's light and protection.<br>\nLesson overview<\/p>\n<ul>\n<li><strong>Main theme:<\/strong> God protects and guides us, and we can trust Him even in difficult times.<\/li>\n<li><strong>Key scripture:<\/strong> Matthew 2:13-23, \"The Escape to Egypt\".<\/li>\n<li><strong>Core concepts:<\/strong>\n<ul>\n<li><strong>God's protection:<\/strong> God warned Joseph in a dream to flee to Egypt to keep Jesus safe from King Herod.<\/li>\n<li><strong>God's guidance:<\/strong> An angel warned Joseph in a dream to leave Egypt and return to Israel when Herod was gone.<\/li>\n<li><strong>Trust:<\/strong> We can trust that God has a plan for us, even when we are scared or things are uncertain.<\/li>\n<li><strong>God is with us:<\/strong> God is always with us and promises to care for us.<\/li>\n<\/ul><\/li>\n<\/ul>\n<p>Activity ideas<\/p>\n<ul>\n<li><strong>\"Hidden in His Heart Hope Box\":<\/strong><br>Decorate a small box to hold prayer requests and goals, reminding children to put their trust in God and talk to Him.<\/li>\n<li><strong>\"Light of the World Lantern\":<\/strong><br>Make a craft that represents Jesus as the light of the world, using a paper lantern and a safe light source inside. This can visually reinforce the idea of being protected by Christ's love.<\/li>\n<li><strong>Maze activity:<\/strong><br>Use a maze to represent life's challenges and God's ability to guide us through them. You can lead the children through a maze while they think about times they needed God's help.<\/li>\n<li><strong>\"God is in Control\" drawing:<\/strong><br>Have the children draw pictures showing times when God helped them or was with them in a scary situation.<\/li>\n<\/ul>\n<p>Discussion questions<\/p>\n<ul>\n<li>What are some things that can make us feel scared?<\/li>\n<li>How did God help Joseph and Mary?<\/li>\n<li>What are some ways God can guide us today?<\/li>\n<li>What does it mean to trust God with our lives?<\/li>\n<\/ul>\n<h3>ACTIVITIES<\/h3>\n<p>Activities and games<\/p>\n<ul>\n<li><strong>Scavenger hunt:<\/strong> Hide small nativity-themed items like an angel or a star and give kids clues to find them all.<\/li>\n<li><strong>Bible Bingo:<\/strong> Use a simple bingo game with Christmas-themed squares.<\/li>\n<li><strong>\"I Spy\" game:<\/strong> Use a printable \"I Spy\" picture find game with a Christmas theme.<\/li>\n<li><strong>Christmas carols and skits:<\/strong> Have the children sing carols or perform a simple skit, acting out the Christmas story.<\/li>\n<\/ul>\n<p><a href=\"https://ministry-to-children.com/christmas-worksheets/\" target=\"_blank\" rel=\"noopener\">Printable Christmas Worksheets<\/a><br>\n<a href=\"https://ministry-to-children.com/10-bible-word-search-puzzles-for-christmas/\" target=\"_blank\" rel=\"noopener\">Christmas Word Searches<\/a><\/p>\n<p>If you are interested in further dialogue about this content you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_cs-group": "<p>This week, we focus on the account from Matthew's gospel on the flight of Jesus into Egypt as well as the account of the massacre of the innocents. As you prepare, you might want to read this week's Bible background page on <a href=\"#cs-text\">Matthew 2:13-23<\/a><\/p>\n<p>If you can show video content with a projector, TV, or even a laptop, use a video presentation of the passage, such as the one below.<\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/7_65RCr4M8k?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"DISCOVER JESUS - The Flight of Jesus (Matthew 2:13-23)\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/7_65RCr4M8k\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Christmas%20Sunday/Small%20Group%20Resource%20Christmas%20Sunday.pdf\" target=\"_blank\" rel=\"noopener\">Small Group Handout<\/a><\/p>\n<p><strong>Here are some additional small group ideas:<\/strong><\/p>\n<p><strong><u>1. What would you take?<\/u><\/strong><br>\nThis activity encourages empathy and reflection on what is truly important when forced to leave everything behind.<\/p>\n<ul>\n<li><strong>Prompt:<\/strong> Imagine you are Joseph and Mary, with a newborn baby. An angel warns you to flee with only what you can carry. You have to leave your home, your community, and everything you know.<\/li>\n<li><strong>Activity:<\/strong> Set a timer for 5 minutes. Have each group member write down or gather a few items they would grab in that short amount of time.<\/li>\n<li><strong>Discussion:<\/strong> Share the choices people made. Discuss what was hard to leave behind, and what it might feel like to be a refugee in a foreign land. How does this shed light on the plight of refugees today and on God's call for us to care for them?<\/li>\n<\/ul>\n<p><strong><u>2. The dark side of Advent<\/u><\/strong><br>\nThe story of Herod's massacre is a reminder that Advent is not always a joyous, sentimental time. It's a period of \"holy tension\" between the promised hope and the brokenness of the world.<\/p>\n<ul>\n<li><strong>Prompt:<\/strong> Matthew 2:16–18 describes Herod's horrific actions. Why do you think Matthew included this dark and violent part of the story, especially right after the joyful visit of the Magi?<\/li>\n<li><strong>Discussion:<\/strong>\n<ul>\n<li>Discuss the reality of suffering, evil, and doubt in our world, even during Christmas.<\/li>\n<li>How does the story challenge our typical expectations of the Advent season?<\/li>\n<li>Where do you see signs of \"darkness\" in the world today that make you long for Christ's return?<\/li>\n<\/ul><\/li>\n<\/ul>\n<p><strong><u>3. Trusting God in uncertainty<\/u><\/strong><br>\nJoseph had to trust God's direction repeatedly, even when it meant uprooting his family and moving to an unknown place.<\/p>\n<ul>\n<li><strong>Prompt:<\/strong> In the passage, Joseph is warned in a dream to go to Egypt, and then later in a dream is told to return to Israel, eventually settling in Nazareth because of a warning about Archelaus.<\/li>\n<li><strong>Activity:<\/strong> Have members silently reflect on a time when they had to make a major life decision based on a quiet prompting or \"leap of faith,\" without a clear or certain outcome.<\/li>\n<li><strong>Discussion:<\/strong>\n<ul>\n<li>How did you experience God's guidance during that time?<\/li>\n<li>What made trusting God difficult or frightening?<\/li>\n<li>How does Joseph's consistent obedience, even in confusing circumstances, encourage you in your own life?<\/li>\n<\/ul><\/li>\n<\/ul>\n<p><strong><u>4. The \"hope box\"<\/u><\/strong><br>\nThis activity helps group members visualize giving their anxieties and hopes to God.<\/p>\n<ul>\n<li><strong>Activity:<\/strong> Provide each member with a small box or container (e.g., a decorated matchbox or small tin). Instruct them to write down specific fears, anxieties, or uncertainties they are facing this season on small pieces of paper. On the other side of the paper, they write a corresponding hope or prayer for God's provision.<\/li>\n<li><strong>Instructions:<\/strong> Put the papers inside the box and decorate it with a heart or a caption like \"hidden in his heart, covered by God's love.\"<\/li>\n<li><strong>Discussion:<\/strong> After the activity, briefly discuss the experience. Keep the boxes as a tangible reminder to trust in God's protection<\/li>\n<\/ul>\n<p><strong><u>5. Advent tags<\/u><\/strong><br>\nThis activity focuses on personal growth during Advent.<\/p>\n<ul>\n<li><strong>Activity:<\/strong> Give each person a blank tag (like a luggage tag) and string. On one side of the tag, have them write something they want to \"peel away\" during Advent (e.g., busyness, impatience, materialism). On the other side, they write a trait they want to grow (e.g., hope, peace, courage).<\/li>\n<li><strong>Instructions:<\/strong> Tie the tag to a small bare branch or an indoor plant. As the plant grows or gets decorated, it can serve as a reminder of new growth.<\/li>\n<li><strong>Discussion:<\/strong> Share and pray over the tags. How does Matthew's account of suffering and protection inspire a different kind of \"hope\" and \"courage\"?<\/li>\n<\/ul>\n<p>If you are interested in further dialogue about this content you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_cs-reflections": "<p><strong><u>Theological Reflections for Preaching and Teaching on First Sunday of Christmas.<\/u><\/strong><\/p>\n<p><span class=\"muted\">(Reflections to be added)<\/span><\/p>\n<p>If you are interested in further dialogue about the content on this page, you are welcome to contact Mat Thomas at <a href=\"mailto:pastor.mat.thomas@gmail.com\">pastor.mat.thomas@gmail.com<\/a><\/p>\n<p><img src=\"assets/thomas.jpg\" alt=\"Rev. Dr. Mat Thomas\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_cs-text": "<p><strong>Online Based Summary of the Text<\/strong><\/p>\n<p>Sermon commentaries on Matthew 2:13–23 focus on the flight of the Holy Family to Egypt and their eventual return, highlighting themes of God's protection, obedience, the fulfillment of prophecy, and the tension between good and evil.  The passage presents a God who orchestrates salvation through humble and obedient people, even as evil forces seek to thwart him. Key themes include Joseph's faithful obedience to divine instruction, the parallel between Jesus and Moses (both escaping a tyrant's decree), and the horror of Herod's Massacre of the Innocents, which is framed as a fulfillment of prophetic sorrow.<\/p>\n<p><strong>Key themes and points for a sermon<\/strong><\/p>\n<p><strong>God's protection and sovereignty:<\/strong> God is actively involved in protecting Jesus and the Holy Family through dreams and divine guidance.<\/p>\n<ul>\n<li>An angel appears to Joseph three times, directing him to flee to Egypt, where to go, and eventually to return.<\/li>\n<li>This demonstrates God's power to protect His plan from those who oppose it, even in the face of great evil.<\/li>\n<\/ul>\n<p><strong>Obedience:<\/strong> Joseph's obedience to God's commands is central to the narrative.<\/p>\n<ul>\n<li>He acts on the instructions given to him in his dreams, taking the necessary steps to protect his family.<\/li>\n<li>This highlights the importance of listening to and obeying God's word, even when it requires a difficult or immediate response.<\/li>\n<\/ul>\n<p><strong>Fulfillment of prophecy:<\/strong> Matthew frames these events as fulfilling Old Testament prophecies.<\/p>\n<ul>\n<li>Jesus's flight to and return from Egypt is seen as fulfilling Hosea 11:1, “Out of Egypt I called my son,” says the source: <a href=\"https://www.workingpreacher.org\" target=\"_blank\" rel=\"noopener\">www.workingpreacher.org<\/a>.<\/li>\n<li>The slaughter of the children is linked to Jeremiah 31:15, a cry of grief and sorrow, says the source: <a href=\"https://www.workingpreacher.org\" target=\"_blank\" rel=\"noopener\">www.workingpreacher.org<\/a>.<\/li>\n<\/ul>\n<p><strong>The struggle between good and evil:<\/strong> The passage presents a stark contrast between Herod's evil actions and God's protective plan for Jesus.<\/p>\n<ul>\n<li>Herod's actions are driven by fear and a desire to maintain his power, leading him to commit atrocities.<\/li>\n<li>This sets up Jesus as an irritant to corrupt power structures and introduces his path of suffering from the beginning.<\/li>\n<\/ul>\n<p><strong>A message of hope and action:<\/strong> The story encourages believers to be agents of protection and welcome for those who are displaced or in danger today.<\/p>\n<ul>\n<li>It calls on the congregation to be where God is and to help make a home for those seeking safety.<\/li>\n<\/ul>\n<p><strong>Sermon Commentary Links<\/strong><\/p>\n<p><a href=\"https://cepreaching.org/commentary/2019-12-23/matthew-213-23-2/\" target=\"_blank\" rel=\"noopener\">Center for Excellence in Preaching<\/a><br>\n<a href=\"https://enduringword.com/bible-commentary/matthew-2/\" target=\"_blank\" rel=\"noopener\">Enduring Word Commentary<\/a><br>\n<a href=\"https://sermonwriter.com/biblical-commentary-old/matthew-213-23/\" target=\"_blank\" rel=\"noopener\">Sermon Writer<\/a><br>\n<a href=\"https://www.workingpreacher.org/commentaries/revised-common-lectionary/first-sunday-of-christmas/commentary-on-matthew-213-23\" target=\"_blank\" rel=\"noopener\">Working Preacher<\/a><\/p>\n", "c_cs-worship": "<p><strong><em>Worship on the First Sunday after Christmas Day<\/em><\/strong><\/p>\n<p>The primary goal of worship on this first Sunday after Christmas Day is to be sure that we are celebrating Christmas! All Advent we have been looking forward to it, and now we enter the celebration. Christmas lasts 12 days! (There's a song because it lasts 12 days, not the other way around!). Sing Christmas carols and songs of celebration! Don't allow the culture, which has already moved on to Valentine's Day, to dictate how we celebrate Christmas. We tell time differently. Help your people with this concept. Keep the decorations up, the Christ candle lit, and the songs of Christmas alive!<\/p>\n<p><strong>Worship Themes to Consider<\/strong><\/p>\n<ul>\n<li>Christmas celebration - Christmas has just begun!<\/li>\n<li>The Incarnation: This is the core of the celebration—the idea that God became human in the person of Jesus. This theme can be explored through scripture and sermon, emphasizing the invisible becoming visible and the absolute becoming particular.<\/li>\n<li>Hope, Peace, and Salvation: The birth of Jesus is Good News that brings hope, peace, and salvation to the world. Worship can focus on these gifts and how they can fuel optimism and guide our lives.<\/li>\n<li>God's Love: The Christmas story is a reminder of God's continual love for humanity. Themes can revolve around the love that came down and the gift that changed the world.<\/li>\n<\/ul>\n<p><strong>Christmas Sunday Call to Worship<\/strong><\/p>\n<p>Leader: In the quiet of the night, a message of great joy is given to us.<\/p>\n<p><strong>Congregation: Fear not, for behold, we bring you good news of great joy for all people.<\/strong><\/p>\n<p>Leader: God's promise, revealed in the birth of his Son, fills us with wonder.<\/p>\n<p><strong>Congregation: We marvel at the purest and most precious gift, the gift of your Son.<\/strong><\/p>\n<p>Leader: We are called to be instruments of that good news, to be a community of faith.<\/p>\n<p><strong>Congregation: Our joy comes from community, from seeing God's kingdom come on earth as it is in heaven.<\/strong><\/p>\n<p>Leader: For in the birth of Jesus, God is with us, Emmanuel.<\/p>\n<p><strong>Congregation: Emmanuel, God-with-us, your light lifts up our hearts and voices.<\/strong><\/p>\n<p>Leader: Let us live out this good news, to embody the word of your love.<\/p>\n<p><strong>Congregation: May we celebrate the joy of Christ's coming, and may the love of Jesus Christ the Son shine forth from within us, both now and forevermore.<\/strong><\/p>\n<p>We can also use the Psalms reading as a call to worship, or elsewhere in the worship flow. Each week, we have the Psalm in the form of a responsive reading, which is a great option. It adds additional Scripture in our worship and also gives congregational participation in a way beyond singing.<\/p>\n<p><a href=\"New%20England%20Advent%202026/Christmas%20Sunday/Psalm%20148%20Responsive%20Reading.pdf\" target=\"_blank\" rel=\"noopener\">Responsive Reading - Psalm 148<\/a><\/p>\n<p>You can also explore various worship resources connected to the Psalm on the <span class=\"muted\">Psalm 148 (page to be added)<\/span> page.<\/p>\n<p><strong>Hymn Suggestions<\/strong><br><em>(Hymn #s are from the Sing to the Lord Hymnal)<\/em><\/p>\n<ul>\n<li><em>Angels, from the Realms of Glory #192<\/em><\/li>\n<li><em>Angels We Have Heard on High #190<\/em><\/li>\n<li><em>Go Tell It on the Mountain #181<\/em><\/li>\n<li><em>Hark! the Herald Angels Sing #191<\/em><\/li>\n<li><em>Joy to the World #173<\/em><\/li>\n<li><em>O Come All Ye Faithful #175<\/em><\/li>\n<li><em>The Birthday of a King #187<\/em><\/li>\n<\/ul>\n<p><strong>Other Song Suggestions<\/strong><\/p>\n<p><a href=\"https://open.spotify.com/track/1gGU2zFtIMMx2SAA5d0XyJ\" target=\"_blank\" rel=\"noopener\">Behold<\/a><br>\n<a href=\"https://open.spotify.com/track/58ePGDlx3W3o9sh8N1HLh3\" target=\"_blank\" rel=\"noopener\">Christmas Day<\/a><br>\n<a href=\"https://open.spotify.com/track/1m0TwLxfXAtv2Cn61mwIG0\" target=\"_blank\" rel=\"noopener\">Emmanuel God With Us<\/a><br>\n<a href=\"https://open.spotify.com/track/35gYOLJV58he0uKxtlmLDI\" target=\"_blank\" rel=\"noopener\">For Unto Us a Child Is Born (Come, Now is the Time to Worship)<\/a><br>\n<a href=\"https://open.spotify.com/track/1EwF6k8xZeQuS8WFLgBg2Z\" target=\"_blank\" rel=\"noopener\">He Shall Reign Forevermore<\/a><br>\n<a href=\"https://open.spotify.com/track/5wDPco8kl6sRponff5L9Th\" target=\"_blank\" rel=\"noopener\">Joy to the World (Joyful, Joyful)<\/a><br>\n<a href=\"https://open.spotify.com/track/6YCCHnSCcJYWenamiJfLWh\" target=\"_blank\" rel=\"noopener\">Noel<\/a><br>\n<a href=\"https://open.spotify.com/track/09JZvkzQ3HoVHNAfPzKTNC\" target=\"_blank\" rel=\"noopener\">Your Name (Christmas Version)<\/a><\/p>\n<p>If you are interested in further dialogue about the content on any of the weekly worship resources pages you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_lam-blue": "<p><strong>Samples,  Sites and Service Plans<\/strong><\/p>\n<p><a href=\"https://cathedral.org/wp-content/uploads/2023/12/Blue-Christmas-2023-FINAL.pdf\" target=\"_blank\" rel=\"noopener\">Blue Christmas (Washington National Cathedral)<\/a><br>\n<a href=\"https://worshipwords.co.uk/blue-christmas-service-complete-ana-gobledale-uk/\" target=\"_blank\" rel=\"noopener\">Blue Christmas Service<\/a><br>\n<a href=\"https://harmonyva.org/wp-content/uploads/2022/12/12-21-22-Blue-Christmas-Order-of-Worship-for-website-1.pdf\" target=\"_blank\" rel=\"noopener\">Blue Christmas Service - 2<\/a><br>\n<a href=\"https://karibartkus.com/offering-a-blue-christmas-service-to-honor-the-loss-and-cling-to-the-hope/\" target=\"_blank\" rel=\"noopener\">Love Does That - Service Ideas<\/a><br>\n<a href=\"https://thepastorsworkshop.com/blog/an-order-of-worship-for-a-blue-christmas-service-aka-a-longest-night-service\" target=\"_blank\" rel=\"noopener\">The Pastors Workshop - An Order of Worship for a Blue Christmas Service (aka a Longest Night Service)<\/a><br>\n<span class=\"muted\">UMC Discipleship Ministries (link to be added)<\/span><br>\n<span class=\"muted\">Young Clergy Women Site (link to be added)<\/span><\/p>\n", "c_lam-ce": "<p>Including lament in a Christmas Eve service involves acknowledging sorrow and brokenness while holding onto resolute hope for God's kingdom to come. can be done through intercessory prayers that name contemporary issues like injustice or division, selecting hymns that combine sorrow with expectation (like \"O Come, O Come, Immanuel\"), and incorporating readings or personal testimonies that speak to suffering and the yearning for God's intervention. The goal is to provide an honest, faith-filled response to pain and an affirmation of belief in God's promises, ultimately leading to recommitment and a deeper longing for the fulfilled reign of Christ.<\/p>\n<p><strong>Why Include Lament?<\/strong><\/p>\n<ul>\n<li><strong>Honesty about the world:<\/strong><br>Acknowledging the brokenness, chaos, and suffering in the world acknowledges that the birth of Jesus did not immediately eliminate all pain and injustice,<\/li>\n<li>Biblical lament is a Godly response to suffering and injustice, which ultimately seeks to recommit one's hope in God's promises, according to <a href=\"https://belmont.libguides.com/lament/definition\" target=\"_blank\" rel=\"noopener\">LibGuides<\/a>.<\/li>\n<li>A more complete expression of Advent:<br>It allows for a more holistic expression of the Advent season, which is not only about the joyous anticipation of Jesus' birth but also about the deep longing for a future where God's kingdom has fully come.<\/li>\n<li>Deepens faith:<br>By voicing our pain and sorrow, it can strengthen faith and trust in God and his promises for the future, according to The Village Church.<\/li>\n<\/ul>\n<p><strong>How to Include Lament in a Christmas Eve Service<\/strong><\/p>\n<ul>\n<li><strong>Prayers of Lament:<\/strong><br>Use specific prayers that name current issues and lament the presence of sin, suffering, and division in the community and world.<\/li>\n<li><strong>Hymns and Songs:<\/strong><br>Incorporate hymns that blend sorrow with hope, such as \"O Come, O Come, Immanuel,\" which is \"O come, O King of Nations\" and \"O Come, O Bright and Morning Star,\" which expresses hope in the midst of darkness.<\/li>\n<li><strong>Scripture Readings:<\/strong><br>Read passages from scripture that address lament, such as Old Testament prophetic books or even a modern translation by someone like Rev. Dr. Wilda Gafney.<\/li>\n<li><strong>Personal Testimonies:<\/strong><br>Invite members of the congregation to share brief, personal stories of suffering or struggle, followed by a recommitment to hope in Christ.<\/li>\n<li><strong>Liturgical Elements:<\/strong><br>Design elements of the service to be contemplative rather than solely joyous, such as a time for reflective silence or a more somber reading of the Christmas narrative before the joyful parts of the service.<\/li>\n<li><strong>Theme of Hope:<\/strong><br>Ensure the lament is balanced with a message of resolute hope in God's future kingdom, leading to a joyful conclusion.<\/li>\n<\/ul>\n", "c_lam-intro": "<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/uZFzJTASFtc?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Advent and Lament, John Nielson\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/uZFzJTASFtc\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n", "c_lam-playlist": "<iframe data-testid=\"embed-iframe\" style=\"border-radius:12px\" src=\"https://open.spotify.com/embed/playlist/0tP6YN1g6CJn0n6lyKiW2z?utm_source=generator\" width=\"100%\" height=\"352\" frameBorder=\"0\" title=\"Advent Lament Spotify playlist\" allowfullscreen=\"\" allow=\"autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture\" loading=\"lazy\"><\/iframe>\n<p><a href=\"https://open.spotify.com/playlist/0tP6YN1g6CJn0n6lyKiW2z\" target=\"_blank\" rel=\"noopener\">Open the playlist in Spotify<\/a><\/p>\n", "c_lam-poems": "<p><strong><a href=\"https://cmalliance.org/advent-reflections-of-weeping/\" target=\"_blank\" rel=\"noopener\">Advent Reflections of Weeping<\/a><\/strong><\/p>\n<p><strong>Advent Prayer of Lament<\/strong><\/p>\n<p>Lord, we look with hope for the day<br>\nwhen there is no more grief,<br>\n<span style=\"margin-left:1.2em\">no more sorrow,<\/span><br>\n<span style=\"margin-left:1.2em\">no more sin,<\/span><br>\n<span style=\"margin-left:1.2em\">no more death.<\/span><br>&hellip;<\/p>\n<p>— written by Mike Cosper, and posted on the re:Worship website. <a href=\"https://re-worship.blogspot.com/2011/11/prayer-of-lament-for-advent.html\" target=\"_blank\" rel=\"noopener\">Read the full prayer<\/a>.<\/p>\n<p><strong>Some of Us<\/strong><\/p>\n<p>Some of us have<br>\nSome of us don't<br>\nSome of us will<br>\nAnd some of us won't<br>&hellip;<\/p>\n<p>-Song lyrics by Russ Hitt. Watch the song with its lyrics:<\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/bxhnL4v49P0?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Some of Us, song with lyrics, Russ Hitt\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/bxhnL4v49P0\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n", "c_w1-children": "<p><a href=\"New%20England%20Advent%202026/Week%201_Hope/Advent%201%20Children%27s%20Lesson%20%28Option%202%29.pdf\" target=\"_blank\" rel=\"noopener\">Advent 1 Children's Lesson.pdf<\/a><br>\nAdvent 1 Children's Lesson (Option 2).pdf<\/p>\n<p>For a children's lesson on the first Sunday of Advent, focus on the theme of hope through the Advent wreath, the concept of God's promise of Jesus, and the importance of waiting and watching for His coming, both for the birth at Christmas and for His future return. Activities can include lighting the first purple candle on the Advent wreath, singing hymns, reading Bible passages like Jeremiah 33:14-16 or Luke 21:25-36, and creating a \"Jesse tree\" with ornaments representing God's plan.<\/p>\n<p><strong>Key Concepts for the First Sunday of Advent<\/strong><\/p>\n<ul>\n<li><strong>Hope:<\/strong> This is the central theme for the first Sunday of Advent.<\/li>\n<li><strong>God's Promises:<\/strong> God promised to send a Savior, and He fulfilled that promise with Jesus' birth and will fulfill it again when Jesus returns.<\/li>\n<li><strong>Waiting and Watching:<\/strong> Advent is a season of waiting for Jesus, both at Christmas and for His second coming.<\/li>\n<\/ul>\n<p><strong>Activity Ideas<\/strong><\/p>\n<ol>\n<li><strong>The Advent Wreath and Prophecy Candle:<\/strong>\n<ul>\n<li>Introduce the Advent wreath and explain that the first purple candle represents hope.<\/li>\n<li>Explain that this candle reminds us of the prophets, especially Isaiah, who foretold Jesus' birth.<\/li>\n<li>Light the candle and discuss God's promise to send the \"godly Branch\" from David's royal line.<\/li>\n<\/ul><\/li>\n<li><strong>Bible Stories and Readings:<\/strong>\n<ul>\n<li>Read from Jeremiah 33:14-16, which speaks of God's promises being fulfilled in the \"godly Branch\".<\/li>\n<li>Consider using Luke 21:25-36 to discuss being watchful and ready for Jesus' return.<\/li>\n<\/ul><\/li>\n<li><strong>The Jesse Tree:<\/strong>\n<ul>\n<li>Start a Jesse tree project by creating ornaments that represent biblical figures and events leading up to Jesus' birth.<\/li>\n<li>For the first Sunday, you could make an ornament representing a prophet like Isaiah or a symbol of hope, like a star.<\/li>\n<\/ul><\/li>\n<li><strong>Discussion and Reflection:<\/strong>\n<ul>\n<li>Ask children to wonder how people felt waiting for God's promise of a Savior to be fulfilled.<\/li>\n<li>Discuss how they can prepare for Jesus by being loving, kind, and helpful.<\/li>\n<\/ul><\/li>\n<\/ol>\n<p><strong>Bringing it Together<\/strong><\/p>\n<ul>\n<li><strong>Prayer:<\/strong><br>Close with a prayer for God to help them be patient and to show and share His love while they wait.<\/li>\n<li><strong>The Gift of Hope:<\/strong><br>Emphasize that Jesus is the greatest gift, and the hope we have in Him does not disappoint.<\/li>\n<\/ul>\n<h3>MUSIC AND WORSHIP<\/h3>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/ar6q_BflrzY?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Emmanuel - Kid's Advent Song (Lyrics)\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/ar6q_BflrzY\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><em><strong>The Kids Advent Song<\/strong><br>Tune of “Twinkle Twinkle Little Star”<\/em><\/p>\n<p><strong>Advent is a time to wait,<\/strong> (hold hand up as you say “wait”)<br>\n<strong>Not quite time to celebrate,<\/strong> (shake head and wag finger from side to side)<br>\n<strong>Count the candles 1 by 1,<\/strong> (put 4 fingers up, one at a time)<br>\n<strong>Until Advent time is done.<\/strong> (wave hands, palms down)<br>\n<strong>Day by day we work and play,<\/strong> (stack fist on top of fist, back and forth)<br>\n<strong>To prepare for Christmas day!<\/strong> (put arms on shoulders and hug yourself)<\/p>\n<h3>CHILDREN'S SERMONS and LESSONS<\/h3>\n<p><a href=\"https://garynealhansen.com/a-childrens-sermon-on-luke-21-25-36/\" target=\"_blank\" rel=\"noopener\">Children's Sermon Idea<\/a><br>\n<a href=\"https://ministry-to-children.com/lesson-patience-and-promisesthe-hope-of-advent\" target=\"_blank\" rel=\"noopener\">Another Advent Lesson for Kids (on Ministry-To-Children)<\/a><br>\n<a href=\"https://ministry-to-children.com/be-prepared-sunday-school-lesson-from-luke-2125-36\" target=\"_blank\" rel=\"noopener\">Advent 1 Children's Lesson (on Ministry-To-Children)<\/a><\/p>\n<h3>CRAFTS<\/h3>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/A0Hhz197Ubs?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"Craft Ideas: Waiting for Jesus. Luke 21:25-36, Ministry-To-Children\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/A0Hhz197Ubs\" target=\"_blank\" rel=\"noopener\">Craft Ideas: Waiting for Jesus. Luke 21:25-36, Ministry-To-Children<\/a><\/p>\n<p>If you are interested in further dialogue about this content you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w1-group": "<p>This week, we focus on Jesus' teaching about his return. In Advent, we focus on the first and final Advent of Jesus.<\/p>\n<p>As you prepare, you might want to read this week's Bible background page on <a href=\"#w1-text4\">Mark 13:24-37<\/a>.<\/p>\n<p>If you can display video content using a projector, TV, or even a laptop, consider using a video presentation of the passage, such as the one below.<\/p>\n<div class=\"video\"><iframe src=\"https://www.youtube-nocookie.com/embed/ip1vUHBCRl0?rel=0&amp;cc_load_policy=1&amp;playsinline=1\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" title=\"English ESV | Mark 13:1-37, Lumo Project Films\" allowfullscreen><\/iframe><\/div>\n<p><a href=\"https://youtu.be/ip1vUHBCRl0\" target=\"_blank\" rel=\"noopener\">Watch on YouTube<\/a><\/p>\n<p><a href=\"New%20England%20Advent%202026/Week%201_Hope/Small%20Group%20Resource%20Week%201.pdf\" target=\"_blank\" rel=\"noopener\">Small Group Handout<\/a><\/p>\n<p>Here is an additional HANDOUT you can print out for your small group that focuses on <a href=\"New%20England%20Advent%202026/Week%201_Hope/Mark%2013.docx\" download>Mark 13:24-37<\/a>.<\/p>\n<p>If you focus on this week's spiritual practice in your group, be sure to see the page: <a href=\"#w1-practices\">Spiritual Practices: Week One<\/a>.<\/p>\n<h3>Additional Small Group Activities (online sources)<\/h3>\n<p><a href=\"https://www.crossroads.net/media/articles/10-minutes-to-more-hope-advent-week-1\" target=\"_blank\" rel=\"noopener\">10 Minutes to More Hope (Advent: Week 1)<\/a><\/p>\n<p>If you are interested in further dialogue about this content, you are welcome to contact John Nielson at <a href=\"mailto:jwnielson@mac.com\">jwnielson@mac.com<\/a>.<\/p>\n<p><img src=\"assets/nielson.jpg\" alt=\"Rev. Dr. John Nielson\" style=\"width:150px;height:auto;border-radius:12px\"><\/p>\n", "c_w1-reflections": "<h3>Waiting with Hope: Keep Awake<\/h3>\n<p>Advent begins in the dark. This may seem like a strange way to begin the season. We are surrounded by lights. Christmas music is playing. Decorations are going up. Stores are filled with reminders that Christmas is coming. We light candles, hang lights, and decorate our homes because we are preparing to celebrate the coming of Christ.<\/p>\n<p>And yet, the church begins Advent with Scriptures that refuses to ignore the darkness.<\/p>\n<p>Isaiah cries out, “O that you would tear open the heavens and come down.”<\/p>\n<p>The psalmist pleads, “Restore us, O God; let your face shine, that we may be saved.”<\/p>\n<p>Jesus speaks of the sun being darkened, the moon losing its light, and the stars falling from heaven.<\/p>\n<p>And then Jesus says, “Beware, keep alert.\" And, \"Keep awake.”<\/p>\n<p>This seems like an odd way to begin preparing for Christmas. But perhaps this is exactly where Advent needs to begin. The Christian hope is not born from pretending that everything is fine. Authentic hope tells the truth about the shadows while trusting that God is still at work.<\/p>\n<p>Isaiah 64 comes from a people who know something about the shadows. Israel has returned from exile, but the return has not produced the restoration they imagined. The people are home, but home is not yet what it was supposed to be. Their restoration remains incomplete.<\/p>\n<p>And so Isaiah prays with astonishing honesty, “O that you would tear open the heavens and come down.” This is not a polite prayer. Isaiah is asking God to show up. Isaiah is asking, \"God, where are you?\" He is crying out, \"God, we need you here,\" Perhaps even, he's shouting, \"God, we need you to come down into the mess we are living in.\"<\/p>\n<p>And then Isaiah remembers who God is: “Yet, O Lord, you are our Father; we are the clay, and you are our potter; we are all the work of your hand.” The people are waiting. But they are waiting with hope. Their hope does not ignore of diminish the darkness. Their hope is that the darkness is does not have the last word. That is an important distinction.<\/p>\n<p>There are moments when Christian hope can become a way of avoiding reality. We can use hopeful language to rush past grief, injustice, disappointment, or pain. We can tell people to “just have faith” when what they really need is someone willing to sit with them in the darkness.<\/p>\n<p>Isaiah does something different. Isaiah names the darkness. He cries out. He tells the truth. And yet, Isaiah still hopes.<\/p>\n<p>That is the posture of Advent. We don't have to choose between honesty and hope. We can look directly at what is broken and still believe that God is not finished. The world is still filled with shadows.<\/p>\n<p>We see them in wars that destroy communities and families. We see them in poverty and displacement. We see them in racism and injustice. We see them in addiction and abuse. We see them in sickness and grief. We see them in families carrying burdens that nobody else can see. We see them in the loneliness that can become especially painful during a season that constantly tells us we should be happy. And sometimes the shadows are much closer to home.<\/p>\n<p>Some of us are entering Advent carrying grief. Some are waiting for a diagnosis. Some are waiting for reconciliation. Some are waiting for a job. Some are waiting for a child to come home. Some are waiting for something in themselves to change. Some are simply tired. Advent does not ask us to deny those realities.<\/p>\n<p>Instead, Advent teaches us how to wait in the midst of them. That is why Jesus' words in Mark are so important: “Keep awake.” Jesus has just described a world filled with despair. This includes war, persecution, deception, suffering, and cosmic disorder. And then he tells his disciples to stay awake. He doesn't tell them exactly when the Son of Man will come. He doesn't give them a chart that allows them to calculate the end.<\/p>\n<p>Stay awake. Pay attention. Remain attentive. Don't become numb. Don't fall asleep to what God is doing. Don't allow the darkness around you to convince you that God has stopped working.<\/p>\n<p>The command to keep awake is therefore not primarily about predicting the future. It is about learning how to hope and embody the Gospel in the present.<\/p>\n<p>We wait for Christ by becoming attentive to Christ. But Christian attentiveness cannot stop with seeing.<\/p>\n<p>To keep awake is to become awake to the suffering of ou
